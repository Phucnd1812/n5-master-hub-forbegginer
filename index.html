    // Danh sách bài học tự sinh từ dữ liệu (gồm cả các bài D như 3D, 7D)
    const N5_LESSONS = [...new Set([...GRAMMAR_DATA, ...VOCAB_DATA].map(x => x.lesson))]
      .sort((a, b) => {
        const pa = a.match(/(\d+)([A-Z])/), pb = b.match(/(\d+)([A-Z])/);
        return (+pa[1] - +pb[1]) || pa[2].localeCompare(pb[2]);
      });

    // Xáo trộn Fisher-Yates: thứ tự ngẫu nhiên tốt và không làm thay đổi mảng gốc.
    function pickRandom(arr, n = arr.length) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled.slice(0, n);
    }

    // Chuẩn hóa để so khớp tiếng Việt, chữ Nhật và Romaji không phân biệt hoa/thường.
    function normalizeSearchText(value) {
      return String(value ?? '')
        .normalize('NFKC')
        .toLocaleLowerCase()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/[\s　]+/g, ' ')
        .trim();
    }

    const KANA_ROMAJI = {
      'きゃ':'kya','きゅ':'kyu','きょ':'kyo','しゃ':'sha','しゅ':'shu','しょ':'sho',
      'ちゃ':'cha','ちゅ':'chu','ちょ':'cho','にゃ':'nya','にゅ':'nyu','にょ':'nyo',
      'ひゃ':'hya','ひゅ':'hyu','ひょ':'hyo','みゃ':'mya','みゅ':'myu','みょ':'myo',
      'りゃ':'rya','りゅ':'ryu','りょ':'ryo','ぎゃ':'gya','ぎゅ':'gyu','ぎょ':'gyo',
      'じゃ':'ja','じゅ':'ju','じょ':'jo','びゃ':'bya','びゅ':'byu','びょ':'byo',
      'ぴゃ':'pya','ぴゅ':'pyu','ぴょ':'pyo',
      'あ':'a','い':'i','う':'u','え':'e','お':'o',
      'か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
      'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so',
      'た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
      'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no',
      'は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
      'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo',
      'や':'ya','ゆ':'yu','よ':'yo','ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro',
      'わ':'wa','を':'o','ん':'n',
      'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go',
      'ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
      'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do',
      'ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
      'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
      'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o','ゔ':'vu'
    };

    function kanaToRomaji(input) {
      const kana = String(input ?? '').replace(/[ァ-ヶ]/g, ch =>
        String.fromCharCode(ch.charCodeAt(0) - 0x60)
      );
      let result = '';
      for (let i = 0; i < kana.length; i++) {
        const ch = kana[i];
        if (ch === 'っ') {
          const nextPair = kana.slice(i + 1, i + 3);
          const nextSingle = kana.slice(i + 1, i + 2);
          const next = KANA_ROMAJI[nextPair] || KANA_ROMAJI[nextSingle] || '';
          if (next) result += next.startsWith('ch') ? 't' : next[0];
          continue;
        }
        if (ch === 'ー') {
          const lastVowel = result.match(/[aeiou](?!.*[aeiou])/);
          if (lastVowel) result += lastVowel[0];
          continue;
        }
        const pair = kana.slice(i, i + 2);
        if (KANA_ROMAJI[pair]) {
          result += KANA_ROMAJI[pair];
          i++;
        } else if (KANA_ROMAJI[ch]) {
          result += KANA_ROMAJI[ch];
        } else {
          result += ch;
        }
      }
      return normalizeSearchText(result).replace(/[^a-z0-9]/g, '');
    }

    function plainSearchText(value) {
      return String(value ?? '')
        .replace(/<ruby[^>]*>([\s\S]*?)<rt[^>]*>([\s\S]*?)<\/rt><\/ruby>/gi, '$1 $2')
        .replace(/<[^>]*>/g, ' ')
        .replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&');
    }

    function collectSearchStrings(value, output = []) {
      if (value == null) return output;
      if (typeof value === 'string' || typeof value === 'number') output.push(String(value));
      else if (Array.isArray(value)) value.forEach(item => collectSearchStrings(item, output));
      else if (typeof value === 'object') Object.values(value).forEach(item => collectSearchStrings(item, output));
      return output;
    }

    function searchMatches(query, ...values) {
      const q = normalizeSearchText(query);
      if (!q) return true;
      const qCompact = q.replace(/[^a-z0-9\u3040-\u30ff\u3400-\u9fff]/g, '');
      return collectSearchStrings(values).some(raw => {
        const plain = plainSearchText(raw);
        if (normalizeSearchText(plain).includes(q)) return true;
        const romaji = kanaToRomaji(plain);
        // Hỗ trợ cả kiểu gõ rút gọn như "isogashi" cho "isogashii".
        return qCompact.length >= 4 && romaji.includes(qCompact);
      });
    }

    function matchesSearchQueryForGrammar(item) {
      return searchMatches(state.searchQuery, item);
    }

    /* ==========================================================================
       3. TEXT-TO-SPEECH (TTS) AUDIO ENGINE
       ========================================================================== */
    function playAudio(text) {
      playAudioInLanguage(text, 'ja-JP');
    }

    function playAudioInLanguage(text, language) {
      if (!('speechSynthesis' in window)) {
        showToast('Trình duyệt không hỗ trợ phát âm TTS');
        return;
      }
      const spokenText = String(text || '').trim();
      if (!spokenText) { showToast('Không có nội dung để phát âm'); return; }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(spokenText);
      utterance.lang = language;
      utterance.rate = state.ttsRate;
      const languagePrefix = language.split('-')[0].toLowerCase();
      const voice = window.speechSynthesis.getVoices().find(v => (v.lang || '').toLowerCase().startsWith(languagePrefix));
      if (voice) utterance.voice = voice;
      window.speechSynthesis.speak(utterance);
    }

    // Read the Vietnamese meaning on the back of the currently displayed card.
    function playFlashcardVietnameseAudio() {
      let pool = getFlashcardBasePool();
      if (state.fcShuffle && state.fcDeckIds.length) {
        const cardById = new Map(pool.map(item => [item.id, item]));
        pool = state.fcDeckIds.map(id => cardById.get(id)).filter(Boolean);
      }
      const card = pool[state.fcIndex];
      const meaning = card && (card.vi || card.meaning || card.brief || card.explanation);
      if (!meaning) { showToast('Thẻ này chưa có nội dung tiếng Việt để đọc'); return; }
      playAudioInLanguage(String(meaning).replace(/<br\s*\/?\s*>/gi, ' ').replace(/<[^>]+>/g, ''), 'vi-VN');
    }

    function buildGrammarExtra(item) {
      const formula = `${item.formula || ''} ${item.title || ''}`;
      const tips = [];
      if (/から/.test(formula) && /まで/.test(formula)) {
        tips.push('「から」đánh dấu điểm bắt đầu, còn「まで」đánh dấu điểm kết thúc. Hãy đặt mốc thời gian hoặc địa điểm tương ứng ngay sau từng trợ từ.');
      }
      if (/も/.test(formula)) {
        tips.push('「も」thường thay cho「は」khi muốn nói chủ thể mới cũng có đặc điểm vừa nhắc đến. Hãy xác định thông tin ở câu trước để biết “cũng” đang bổ sung điều gì.');
      }
      if (/の/.test(formula)) {
        tips.push('「の」nối hai danh từ. Quan hệ giữa chúng phụ thuộc vào ngữ cảnh, chẳng hạn sở hữu, nội dung, xuất xứ hoặc đơn vị trực thuộc; không nên mặc định lúc nào cũng dịch là “của”.');
      }
      if (/[か]/.test(formula) && /(です|ます|何|誰|どこ)/.test(formula)) {
        tips.push('Với câu hỏi có「か」, phần cần hỏi thường nằm trước「か」. Khi trả lời, hãy cung cấp đúng thông tin được hỏi và có thể lược bỏ phần đã rõ trong ngữ cảnh.');
      }
      if (/ね/.test(formula)) {
        tips.push('「ね」ở cuối câu thường dùng để xác nhận hoặc tìm sự đồng tình. Ngữ điệu nhẹ nhàng sẽ khiến câu nghe tự nhiên hơn.');
      }
      if (/よ/.test(formula)) {
        tips.push('「よ」ở cuối câu nhấn mạnh hoặc cung cấp thông tin cho người nghe. Cần chú ý quan hệ xã hội và sắc thái để tránh nghe quá áp đặt.');
      }
      if (/(じゃない|ではありません|くない|ません|ないです|ない)/.test(formula)) {
        tips.push('Đây là dấu hiệu phủ định trong cấu trúc. Khi tự đặt câu, hãy kiểm tra phần phủ định gắn vào danh từ, tính từ hay động từ để chia đúng dạng, không áp dụng một cách máy móc cho mọi từ loại.');
      }
      if (/(でした|かった|ました)/.test(formula)) {
        tips.push('Dạng quá khứ cho biết sự việc hoặc trạng thái thuộc về thời điểm đã qua. Từ chỉ thời gian như「昨日」hay「先週」có thể giúp làm rõ mốc thời gian trong câu.');
      }
      if (/てください/.test(formula)) {
        tips.push('Khi có「てください」, động từ phía trước cần được chia sang thể て. Đây là cách nhờ hoặc yêu cầu lịch sự ở mức cơ bản.');
      } else if (/て/.test(formula)) {
        tips.push('Khi cấu trúc có thể て, hãy xác định vai trò của nó trong mẫu cụ thể: nối hành động/trạng thái, diễn tả trình tự hay kết hợp với phần đứng sau.');
      }

      const slots = [];

    // Fill Vietnamese translations for examples whose source data has no vi field.
    // Results are cached locally; translation is performed only for the currently rendered grammar view.
    async function translateVisibleGrammarExamples(container) {
      const nodes = Array.from(container.querySelectorAll('[data-grammar-translate="1"]'));
      const cacheKey = 'n5_hub_grammar_vi_translations';
      let cache = {};
      try { cache = JSON.parse(localStorage.getItem(cacheKey) || '{}'); } catch (error) {}
      const translatedNodes = new WeakSet();
      async function translateNode(node) {
        if (translatedNodes.has(node) || !node.isConnected) return;
        translatedNodes.add(node);
        let source = '';
        try { source = decodeURIComponent(node.dataset.source); } catch (error) {}
        if (!source) { node.textContent = ''; return; }
        if (cache[source]) { node.textContent = '👉 ' + cache[source]; return; }
        node.textContent = 'Đang dịch sang tiếng Việt…';
        try {
          const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=ja&tl=vi&dt=t&q=' + encodeURIComponent(source);
          const response = await fetch(url);
          if (!response.ok) throw new Error('Translation request failed');
          const data = await response.json();
          const translated = (data[0] || []).map(part => part[0]).join('').trim();
          if (!translated) throw new Error('Empty translation');
          cache[source] = translated;
          node.textContent = '👉 ' + translated;
          try { localStorage.setItem(cacheKey, JSON.stringify(cache)); } catch (error) {}
        } catch (error) {
          node.textContent = 'Chưa tải được bản dịch. Kiểm tra kết nối mạng rồi tải lại trang.';
        }
      }
      // Translate only examples near the viewport; this avoids hundreds of requests
      // when the user opens the complete 130-pattern grammar list at once.
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              observer.unobserve(entry.target);
              translateNode(entry.target);
            }
          });
        }, { root: document.getElementById('mainContainer'), rootMargin: '280px 0px' });
        nodes.forEach(node => observer.observe(node));
      } else {
        nodes.slice(0, 8).forEach(translateNode);
      }
    }

    }

    /* ==========================================================================
       9. SMART FLASHCARD HUB (3D FLIP CARD)
       ========================================================================== */
    function getFlashcardBasePool() {
      let pool = [];
      if (state.fcCategory === 'vocab') pool = VOCAB_DATA;
      else if (state.fcCategory === 'kanji') pool = KANJI_DATA;
      else pool = GRAMMAR_DATA;

      if (state.fcFilterLesson !== 'ALL') {
        pool = pool.filter(item => item.lesson === state.fcFilterLesson || item.group === state.fcFilterLesson);
      }
      return pool;
    }

    function refreshFlashcardDeck() {
      const pool = getFlashcardBasePool();
      state.fcDeckIds = state.fcShuffle ? pickRandom(pool, pool.length).map(item => item.id) : [];
    }

    function setFlashcardCategory(category) {
      state.fcCategory = category;
      state.fcFilterLesson = 'ALL';
      state.fcIndex = 0;
      state.fcFlipped = false;
      refreshFlashcardDeck();
      renderFlashcardHub(document.getElementById('mainContainer'));
      document.activeElement && document.activeElement.blur && document.activeElement.blur();
      requestAnimationFrame(() => { const card = document.getElementById('flashcardElement'); if (card) { card.classList.remove('rotate-y-180'); void card.offsetHeight; } });
    }

    function setFlashcardLesson(lesson) {
      state.fcFilterLesson = lesson;
      state.fcIndex = 0;
      state.fcFlipped = false;
      refreshFlashcardDeck();
      renderFlashcardHub(document.getElementById('mainContainer'));
    }

    function toggleFlashcardShuffle() {
      state.fcShuffle = !state.fcShuffle;
      state.fcIndex = 0;
      state.fcFlipped = false;
      refreshFlashcardDeck();
      renderFlashcardHub(document.getElementById('mainContainer'));
      showToast(state.fcShuffle ? 'Đã xáo trộn thứ tự flashcard' : 'Đã trở về thứ tự gốc');
    }

    function renderFlashcardHub(container) {
      let pool = getFlashcardBasePool();
      if (state.fcShuffle && state.fcDeckIds.length) {
        const cardById = new Map(pool.map(item => [item.id, item]));
        pool = state.fcDeckIds.map(id => cardById.get(id)).filter(Boolean);
      }

      const chapterOptions = state.fcCategory === 'kanji'
        ? [...new Set(KANJI_DATA.map(item => item.group))].sort((a, b) => a.localeCompare(b, 'vi', { numeric: true }))

            .sort((a, b) => {
              const pa = a.match(/(\d+)([A-Z])/), pb = b.match(/(\d+)([A-Z])/);
              return (+pa[1] - +pb[1]) || pa[2].localeCompare(pb[2]);
            });
      const chapterLabel = state.fcCategory === 'kanji' ? 'Chọn nhóm chữ Hán' : 'Chọn chương';
      const chapterOptionsHtml = `<option value="ALL">Tất cả chương</option>` + chapterOptions.map(chapter =>

    function toggleCardFlip() {
      state.fcFlipped = !state.fcFlipped;
      const el = document.getElementById('flashcardElement');
      if (el) {
        if (state.fcFlipped) el.classList.add('rotate-y-180');
        else el.classList.remove('rotate-y-180');
      }
    }

    function nextFlashcard() {
      state.fcFlipped = false;
      state.fcIndex++;
      renderFlashcardHub(document.getElementById('mainContainer'));
    }

    function prevFlashcard() {
      state.fcFlipped = false;
      state.fcIndex = Math.max(0, state.fcIndex - 1);
      renderFlashcardHub(document.getElementById('mainContainer'));
    }

    /* ==========================================================================
       10. QUIZ & PRACTICE MODULE
       ========================================================================== */
    function renderQuizHub(container) {
      if (!state.quizActive) {
        container.innerHTML = `

            </div>

              <ul class="space-y-2 text-sm text-slate-600 dark:text-slate-400">
                <li class="flex items-center"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 mr-2"></i> 10 câu hỏi trắc nghiệm ngẫu nhiên từ kho N5 Mori</li>
                <li class="flex items-center"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 mr-2"></i> Kiểm tra cách đọc Hiragana, Ý nghĩa Việt và Ngữ pháp</li>
                <li class="flex items-center"><i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-500 mr-2"></i> Tính thời gian làm bài & Chấm điểm tức thì</li>
              </ul>
            </div>

            <button onclick="startQuiz()" class="w-full sm:w-auto px-8 py-3.5 bg-sakura-500 hover:bg-sakura-600 text-white font-extrabold rounded-2xl shadow-xl shadow-sakura-500/30 text-base transition-all transform hover:-translate-y-0.5">

      // Quiz Active View

            <span class="text-xs font-bold text-slate-500">Câu hỏi ${state.quizIndex + 1} / ${state.quizQuestions.length}</span>

              <span id="quizTimerText">${formatTime(state.quizTimer)}</span>
            </div>
          </div>

          <!-- Question Box -->
          <div class="bg-white dark:bg-jpdark-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-sm text-center space-y-4">

              ${q.question}

    function startQuiz() {
      // Generate 10 dynamic random questions
      const questions = [];
      
      // Add vocab questions
      pickRandom(VOCAB_DATA.filter(v => v.vi.length < 60), 5).forEach(v => {
        const distractors = VOCAB_DATA.filter(x => x.id !== v.id).sort(() => 0.5 - Math.random()).slice(0, 3).map(x => x.vi);
        const options = [...distractors, v.vi].sort(() => 0.5 - Math.random());
        questions.push({
          typeLabel: "Từ vựng - Ý nghĩa",
          question: v.kanji || v.kana,
          correct: options.indexOf(v.vi),
          options: options
        });
      });

      // Add Kanji questions
      pickRandom(KANJI_DATA.filter(k => k.hanviet && k.hanviet !== '—'), 3).forEach(k => {
        const distractors = KANJI_DATA.filter(x => x.id !== k.id).sort(() => 0.5 - Math.random()).slice(0, 3).map(x => x.hanviet);
        const options = [...distractors, k.hanviet].sort(() => 0.5 - Math.random());
        questions.push({
          typeLabel: "Kanji - Âm Hán Việt",
          question: k.kanji,
          correct: options.indexOf(k.hanviet),
          options: options
        });
      });

      // Add Grammar questions
      pickRandom(GRAMMAR_DATA.filter(g => g.meaning && g.title.length < 70), 2).forEach(g => {
        const distractors = GRAMMAR_DATA.filter(x => x.id !== g.id).sort(() => 0.5 - Math.random()).slice(0, 3).map(x => x.title);
        const options = [...distractors, g.title].sort(() => 0.5 - Math.random());
        questions.push({
          typeLabel: "Ngữ pháp - Mẫu câu",
          question: `Ý nghĩa: "${g.meaning}"`,
          correct: options.indexOf(g.title),
          options: options
        });
      });

      state.quizQuestions = questions.sort(() => 0.5 - Math.random());
      state.quizIndex = 0;
      state.quizScore = 0;
      state.quizUserAnswers = [];
      state.quizTimer = 0;
      state.quizActive = true;

      if (state.quizTimerInterval) clearInterval(state.quizTimerInterval);
      state.quizTimerInterval = setInterval(() => {
        state.quizTimer++;
        const el = document.getElementById('quizTimerText');
        if (el) el.innerText = formatTime(state.quizTimer);
      }, 1000);

      renderQuizHub(document.getElementById('mainContainer'));
    }

    function selectQuizAnswer(idx) {
      const q = state.quizQuestions[state.quizIndex];
      const isCorrect = idx === q.correct;
      if (isCorrect) state.quizScore += 10;
      state.quizUserAnswers.push({ question: q, userIdx: idx, isCorrect });

      if (state.quizIndex < state.quizQuestions.length - 1) {
        state.quizIndex++;
        renderQuizHub(document.getElementById('mainContainer'));
      } else {
        // Quiz Complete
        clearInterval(state.quizTimerInterval);
        showQuizResult();
      }
    }

    function showQuizResult() {
      const main = document.getElementById('mainContainer');
      const percentage = Math.round((state.quizScore / (state.quizQuestions.length * 10)) * 100);

      main.innerHTML = `
        <div class="max-w-2xl mx-auto space-y-6 text-center py-8">
          <div class="bg-white dark:bg-jpdark-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-lg space-y-4">

            <div class="text-6xl font-black text-sakura-500 py-2">${percentage}%</div>
            <p class="text-sm text-slate-600 dark:text-slate-400">Bạn đạt được <strong>${state.quizScore}</strong> / ${state.quizQuestions.length * 10} điểm trong thời gian <strong>${formatTime(state.quizTimer)}</strong>.</p>
            
            <button onclick="state.quizActive=false; renderQuizHub(document.getElementById('mainContainer'));" class="px-6 py-3 bg-sakura-500 text-white font-bold rounded-xl text-sm shadow-md">
              Làm Bài Kiểm Tra Khác
            </button>
          </div>
        </div>
      `;
    }

              ${bookmarkedGrammar.length > 0 ? `
                <div>
                  <h3 class="font-bold text-slate-900 dark:text-white text-base mb-3">Ngữ pháp đã lưu (${bookmarkedGrammar.length})</h3>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    ${bookmarkedGrammar.map(g => `
                      <div class="bg-white dark:bg-jpdark-900 p-4 border border-slate-200 dark:border-slate-800 rounded-2xl flex items-center justify-between">
                        <div>
                          <p class="font-bold text-slate-900 dark:text-white font-jp text-base">${g.title}</p>
                          <p class="text-xs text-slate-500">${g.meaning}</p>
                        </div>
                        <button onclick="toggleBookmark('${g.id}')" class="text-amber-500 p-1.5 hover:bg-slate-100 dark:hover:bg-jpdark-800 rounded-lg">
                          <i data-lucide="bookmark" class="w-4 h-4 fill-current"></i>
                        </button>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          `}
        </div>
      `;
    }

    /* ==========================================================================
       12. HELPER FUNCTIONS & LISTENERS
       ========================================================================== */
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function showToast(message) {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = "bg-slate-900 text-white text-xs px-4 py-2.5 rounded-xl shadow-lg border border-slate-700 pointer-events-auto transition-all duration-300 transform translate-y-2 opacity-0 flex items-center space-x-2";
      toast.innerHTML = `<i data-lucide="info" class="w-4 h-4 text-sakura-500"></i><span>${message}</span>`;
      container.appendChild(toast);
      lucide.createIcons();

      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 10);

      setTimeout(() => {
        toast.classList.add('opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function updateHeaderProgress() {
      const totalItems = GRAMMAR_DATA.length + VOCAB_DATA.length + KANJI_DATA.length;
      const completedCount = state.completedItems.length;
      const progressPercent = Math.round((completedCount / totalItems) * 100) || 0;

      const txt = document.getElementById('headerProgressText');
      const bar = document.getElementById('headerProgressBar');
      if (txt) txt.innerText = `${progressPercent}%`;
      if (bar) bar.style.width = `${progressPercent}%`;
    }

    // Keyboard Shortcuts Listener
    document.addEventListener('keydown', (e) => {
      // '/' search shortcut
      const activeTag = document.activeElement?.tagName;
      const isTyping = ['INPUT', 'TEXTAREA', 'SELECT'].includes(activeTag) || document.activeElement?.isContentEditable;
      if (e.key === '/' && !isTyping) {
        e.preventDefault();
        const searchInput = document.getElementById('globalSearchInput');
        if (searchInput) searchInput.focus();
      }

      // Flashcard navigation shortcuts
      if (state.currentView === 'flashcard' && !isTyping) {
        if (e.key === 'ArrowRight') nextFlashcard();
        if (e.key === 'ArrowLeft') prevFlashcard();
        if (e.key === ' ') {
          e.preventDefault();
          toggleCardFlip();
        }
      }
    });

    // Window Init Engine
    window.onload = function() {
      // Responsive sidebar controls: collapsible on desktop, tap-outside drawer on mobile.
      const sidebar = document.getElementById('sidebar');
      const sidebarOverlay = document.getElementById('sidebarOverlay');
      const desktopSidebarToggle = document.getElementById('desktopSidebarToggleBtn');
      const desktopBreakpoint = window.matchMedia('(min-width: 768px)');

      const syncDesktopSidebarButton = () => {
        if (!desktopSidebarToggle) return;
        const isCollapsed = document.body.classList.contains('sidebar-collapsed');
        desktopSidebarToggle.setAttribute('aria-expanded', String(!isCollapsed));
        desktopSidebarToggle.setAttribute('aria-label', isCollapsed ? 'Mở thanh điều hướng' : 'Thu gọn thanh điều hướng');
        desktopSidebarToggle.setAttribute('title', isCollapsed ? 'Mở thanh bên' : 'Thu gọn thanh bên');
        const icon = desktopSidebarToggle.querySelector('[data-lucide]');
        if (icon) icon.setAttribute('data-lucide', isCollapsed ? 'panel-left-open' : 'panel-left-close');
        if (window.lucide) window.lucide.createIcons();
      };

      const closeMobileSidebar = () => {
        sidebar.classList.add('-translate-x-full');
        sidebarOverlay.classList.add('hidden');
        document.body.classList.remove('sidebar-drawer-open');
      };

      const openMobileSidebar = () => {
        sidebar.classList.remove('-translate-x-full');
        sidebarOverlay.classList.remove('hidden');
        document.body.classList.add('sidebar-drawer-open');
      };

      const setDesktopSidebarCollapsed = (collapsed) => {
        document.body.classList.toggle('sidebar-collapsed', collapsed);
        try { localStorage.setItem('n5_hub_sidebar_collapsed', collapsed ? '1' : '0'); } catch (error) {}
        syncDesktopSidebarButton();
      };

      // Restore the user's desktop preference; mobile always starts with the drawer closed.
      let savedSidebarPreference = '0';
      try { savedSidebarPreference = localStorage.getItem('n5_hub_sidebar_collapsed') || '0'; } catch (error) {}
      if (desktopBreakpoint.matches) {
        document.body.classList.toggle('sidebar-collapsed', savedSidebarPreference === '1');
      } else {
        closeMobileSidebar();
      }
      syncDesktopSidebarButton();

      document.getElementById('openSidebarBtn').addEventListener('click', openMobileSidebar);
      document.getElementById('closeSidebarBtn').addEventListener('click', closeMobileSidebar);
      sidebarOverlay.addEventListener('click', closeMobileSidebar);

      desktopSidebarToggle.addEventListener('click', () => {
        const collapsed = document.body.classList.contains('sidebar-collapsed');
        setDesktopSidebarCollapsed(!collapsed);
      });

      // Keep the correct drawer state when moving between mobile and desktop widths.
      desktopBreakpoint.addEventListener('change', (event) => {
        if (event.matches) {
          closeMobileSidebar();
          let preference = '0';
          try { preference = localStorage.getItem('n5_hub_sidebar_collapsed') || '0'; } catch (error) {}
          document.body.classList.toggle('sidebar-collapsed', preference === '1');
          syncDesktopSidebarButton();
        } else {
          document.body.classList.remove('sidebar-collapsed');
          closeMobileSidebar();
        }
      });

      // Escape also closes the mobile drawer for keyboard users.
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !desktopBreakpoint.matches && !sidebar.classList.contains('-translate-x-full')) {
          closeMobileSidebar();
        }
      });

      // TTS Rate Slider Listener
      const ttsSlider = document.getElementById('ttsRateSlider');
      const ttsVal = document.getElementById('ttsRateValue');
      ttsSlider.addEventListener('input', (e) => {
        state.ttsRate = parseFloat(e.target.value);
        ttsVal.innerText = `${state.ttsRate.toFixed(1)}x`;
        saveState();
      });

      // Global Search Input Listener
      const globalSearch = document.getElementById('globalSearchInput');
      globalSearch.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderCurrentView();
      });

      // Theme Toggle Listener
      const themeBtn = document.getElementById('themeToggleBtn');
      themeBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('n5_hub_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
      });

      // Restore saved dark theme preference
      if (localStorage.getItem('n5_hub_theme') === 'dark' || (!('n5_hub_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      updateHeaderProgress();
      navigateTo('dashboard');
    };
  </script>
</body>
</html>
