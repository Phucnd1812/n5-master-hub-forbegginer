<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N5 Master Hub v3.4 - Dũng Mori Companion</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sakura: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e',
              950: '#082f49',
            },
            jpdark: {
              800: '#1e1e24',
              900: '#121216',
              950: '#0a0a0d'
            }
          },
          fontFamily: {
            jp: ['"Noto Sans JP"', '"Meiryo"', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }

  </script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* Custom 3D Card Flip CSS */
    .perspective-1000 { perspective: 1000px; }
    .transform-style-3d { transform-style: preserve-3d; }
    .backface-hidden { backface-visibility: hidden; }
    .rotate-y-180 { -webkit-transform: rotateY(180deg); transform: rotateY(180deg); }
    
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }

    ruby rt { font-size: 0.55em; color: #94a3b8; font-weight: 400; }
    .jp-example { white-space: normal; line-height: 2.1; }
    .expl-text { line-height: 1.7; }
    .kanji-stroke-box {
      background-image: linear-gradient(to right, rgba(229, 231, 235, 0.5) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(229, 231, 235, 0.5) 1px, transparent 1px);
      background-size: 50% 50%;
    }
    .dark .kanji-stroke-box {
      background-image: linear-gradient(to right, rgba(55, 65, 81, 0.5) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(55, 65, 81, 0.5) 1px, transparent 1px);
    }

    /* Sky blue + green + black identity, with gradients in both themes. */
    :root {
      --brand-sky: #38bdf8;
      --brand-green: #22c55e;
      --brand-ink: #0f172a;
      color-scheme: light;
    }
    html.dark { color-scheme: dark; }
    body {
      background-image: linear-gradient(135deg, #f0f9ff 0%, #f0fdf4 52%, #f8fafc 100%);
    }
    html.dark body {
      background-image: linear-gradient(135deg, #020617 0%, #071827 54%, #052e25 100%);
    }
    #mainContainer {
      background-image:
        radial-gradient(ellipse at 8% 0%, rgba(56, 189, 248, .10), transparent 38%),
        radial-gradient(ellipse at 92% 100%, rgba(34, 197, 94, .08), transparent 36%);
    }
    html.dark #mainContainer {
      background-image:
        radial-gradient(ellipse at 8% 0%, rgba(14, 165, 233, .13), transparent 38%),
        radial-gradient(ellipse at 92% 100%, rgba(34, 197, 94, .10), transparent 36%);
    }
    header, #sidebar {
      background-image: linear-gradient(115deg, rgba(56, 189, 248, .055), rgba(34, 197, 94, .045));
    }
    html.dark header, html.dark #sidebar {
      background-image: linear-gradient(115deg, rgba(56, 189, 248, .07), rgba(34, 197, 94, .055));
    }
    .bg-sakura-500 {
      background-image: linear-gradient(115deg, #38bdf8 0%, #0ea5e9 48%, #22c55e 100%) !important;
    }
    .bg-sakura-600 {
      background-image: linear-gradient(115deg, #0ea5e9 0%, #0284c7 50%, #16a34a 100%) !important;
    }
    .bg-sakura-700 { background-color: #0369a1 !important; }
    .text-sakura-500 { color: #0284c7 !important; }
    .text-sakura-600 { color: #0369a1 !important; }
    .dark .text-sakura-400 { color: #7dd3fc !important; }
    .bg-sakura-50 { background-color: #f0f9ff !important; }
    .bg-sakura-100 { background-color: #e0f2fe !important; }
    .dark .bg-sakura-950\/40, .dark .bg-sakura-950\/60 {
      background-color: rgba(3, 105, 161, .20) !important;
    }
    .shadow-sakura-500\/20, .shadow-sakura-500\/30 {
      --tw-shadow-color: rgba(14, 165, 233, .22) !important;
    }
    .grammar-extra {
      border: 1px solid rgba(14, 165, 233, .20);
      background: linear-gradient(120deg, rgba(240, 249, 255, .9), rgba(240, 253, 244, .72));
    }
    .dark .grammar-extra {
      background: linear-gradient(120deg, rgba(8, 47, 73, .34), rgba(20, 83, 45, .20));
      border-color: rgba(56, 189, 248, .20);
    }
    .grammar-extra summary { cursor: pointer; list-style: none; }
    .grammar-extra summary::-webkit-details-marker { display: none; }
    .grammar-extra summary:focus-visible { outline: 2px solid #38bdf8; outline-offset: 3px; }

    /* Desktop sidebar can be fully collapsed without affecting the mobile drawer. */
    #sidebar { transition: transform .3s ease; }
    #mainLayout { transition: margin-left .3s ease; }
    @media (min-width: 768px) {
      body.sidebar-collapsed #sidebar { transform: translateX(-100%); }
      body.sidebar-collapsed #mainLayout { margin-left: 0; }
    }
    /* iOS Safari: use document scrolling on phones (not a nested h-screen scroller),
       allowing Safari's own bottom address/tool bar to collapse while scrolling. */
    @media (max-width: 767px) {
      html, body { min-height: 100%; height: auto; }
      body { overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      #app { display: block; height: auto; min-height: 100vh; min-height: 100svh; overflow: visible; }
      #mainLayout { display: flex; min-height: 100vh; min-height: 100svh; height: auto; overflow: visible; margin-left: 0; }
      #mainContainer { flex: 1 0 auto; min-height: calc(100vh - 4rem); min-height: calc(100svh - 4rem); overflow: visible; }
      body.sidebar-drawer-open { overflow: hidden; }
    }
    /* Safari/WebKit needs the prefixed 3D properties to avoid stale translucent card faces. */
    .perspective-1000 { -webkit-perspective: 1000px; }
    .transform-style-3d { -webkit-transform-style: preserve-3d; }
    .backface-hidden { -webkit-backface-visibility: hidden !important; backface-visibility: hidden !important; }
    .flashcard-front-title {
      width: 100%; max-width: 100%; max-height: 62%;
      font-size: clamp(1.15rem, 7.2vw, 3rem); line-height: 1.22;
      overflow-wrap: anywhere; word-break: normal; white-space: normal;
      overflow-y: auto; padding-inline: .15rem;
    }
    .flashcard-front-title.long { font-size: clamp(1rem, 5.2vw, 2.15rem); }
    /* Keep face rotations intact; translateZ(0) here would override rotateY(180deg). */
    .flashcard-face { -webkit-backface-visibility: hidden !important; backface-visibility: hidden !important; will-change: transform; box-sizing: border-box; }
    .flashcard-front-face { -webkit-transform: rotateY(0deg); transform: rotateY(0deg); }
    .flashcard-back-face { -webkit-transform: rotateY(180deg); transform: rotateY(180deg); }
    /* Allow long Kanji/grammar content to use the available card height instead of being clipped. */
    .flashcard-stage { height: clamp(26rem, 64vh, 34rem); height: clamp(26rem, 64svh, 34rem); min-height: 26rem; }
    .flashcard-face-header, .flashcard-face-footer { flex: 0 0 auto; min-width: 0; }
    .flashcard-face-content { flex: 1 1 auto; min-height: 0; min-width: 0; width: 100%; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .flashcard-front-content { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .75rem; padding: .5rem 0; }
    .flashcard-front-title { max-height: 100%; flex: 0 1 auto; overflow-y: auto; }
    .flashcard-back-content { display: flex; flex-direction: column; justify-content: center; gap: .8rem; padding: .5rem 0; overflow-wrap: anywhere; word-break: normal; }
    .flashcard-back-content h3, .flashcard-back-content p { max-width: 100%; overflow-wrap: anywhere; word-break: normal; }
    .flashcard-back-formula { white-space: normal; overflow-wrap: anywhere; word-break: break-word; line-height: 1.55; }
    @media (max-width: 639px) {
      .flashcard-stage { height: clamp(26rem, 64svh, 32rem); min-height: 26rem; }
      .flashcard-face { padding: 1rem !important; }
      .flashcard-face-header { gap: .5rem; align-items: flex-start; }
      .flashcard-face-header span:last-child { text-align: right; }
      .flashcard-back-content h3 { font-size: clamp(1.15rem, 5.2vw, 1.5rem); line-height: 1.35; }
      .flashcard-back-content p { font-size: .78rem; line-height: 1.55; }
    }
    .grammar-example-translation { color: #047857; font-size: .875rem; line-height: 1.55; }
    .dark .grammar-example-translation { color: #86efac; }
    .grammar-card { min-width: 0; overflow: hidden; }
    .grammar-card-title { min-width: 0; overflow-wrap: anywhere; word-break: normal; line-height: 1.45; }
    .grammar-formula { min-width: 0; white-space: normal; overflow-wrap: anywhere; word-break: break-word; line-height: 1.65; }
    .grammar-example-row { display: flex; flex-direction: column; min-width: 0; }
    .grammar-example-text { min-width: 0; width: 100%; }
    .grammar-example-jp { font-size: clamp(.875rem, 3.8vw, 1rem); line-height: 1.9; overflow-wrap: anywhere; word-break: normal; }
    .grammar-example-translation { max-width: 100%; white-space: normal; overflow-wrap: anywhere; word-break: break-word; }
    @media (min-width: 640px) {
      .grammar-example-row { flex-direction: row; align-items: flex-start; }
      .grammar-example-text { flex: 1 1 auto; }
      .grammar-example-audio { flex: 0 0 auto; }
    }
    @media (max-width: 639px) {
      .grammar-card { padding: 1rem !important; border-radius: 1rem; }
      .grammar-card-title { font-size: .98rem; }
      .grammar-formula { font-size: .8rem; padding: .65rem !important; }
      .grammar-extra { padding: .8rem !important; }
      .grammar-extra summary { align-items: flex-start; }
      .grammar-example-row { gap: .55rem; padding: .7rem !important; }
      .grammar-example-audio { align-self: flex-end; padding: .4rem !important; }
      .grammar-page-filter { width: 100%; min-width: 0; }
      .grammar-page-filter select { min-width: 0; flex: 1 1 auto; max-width: 100%; }
    }
    @media (hover: none) {
      button, a { -webkit-tap-highlight-color: transparent; }
    }
  </style>
</head>
<body class="h-full bg-slate-50 dark:bg-jpdark-950 text-slate-800 dark:text-slate-100 font-sans antialiased transition-colors duration-200">
  <div id="app" class="flex h-screen overflow-hidden">

    <!-- SIDEBAR (Desktop Fixed, Mobile Drawer) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-white dark:bg-jpdark-900 border-r border-slate-200 dark:border-slate-800 flex flex-col transition-transform duration-300 transform -translate-x-full md:translate-x-0">
      <!-- Logo & Header -->
      <div class="h-16 flex items-center justify-between px-5 border-b border-slate-200 dark:border-slate-800">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('dashboard')">
          <div class="w-9 h-9 rounded-xl bg-sakura-500 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-sakura-500/30">
            日
          </div>
          <div>
            <h1 class="font-bold text-base leading-tight tracking-tight text-slate-900 dark:text-white">N5 Master Hub</h1>
            <p class="text-xs text-sakura-500 dark:text-sakura-400 font-medium">Giáo trình Dũng Mori</p>
          </div>
        </div>
        <button id="closeSidebarBtn" aria-label="Đóng thanh điều hướng" title="Đóng menu" class="md:hidden text-slate-500 hover:text-slate-700 dark:text-slate-400">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Navigation Menu -->
      <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
        <button onclick="navigateTo('dashboard')" data-nav="dashboard" class="nav-item w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all">
          <i data-lucide="layout-dashboard" class="w-5 h-5 mr-3"></i>
          <span>Tổng quan & Tiến độ</span>
        </button>
        <button onclick="navigateTo('grammar')" data-nav="grammar" class="nav-item w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all">

          <span>Ngữ pháp (Bài 1A - 14C)</span>
        </button>
        <button onclick="navigateTo('vocab')" data-nav="vocab" class="nav-item w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all">
          <i data-lucide="languages" class="w-5 h-5 mr-3"></i>
          <span>Từ vựng (Bài 1A - 14C)</span>
        </button>
        <button onclick="navigateTo('kanji')" data-nav="kanji" class="nav-item w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all">

          <span>Chữ Hán (1.1 - 14.3)</span>
        </button>
        <button onclick="navigateTo('flashcard')" data-nav="flashcard" class="nav-item w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all">
          <i data-lucide="layers" class="w-5 h-5 mr-3"></i>

        </button>
        <button onclick="navigateTo('quiz')" data-nav="quiz" class="nav-item w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all">
          <i data-lucide="brain-circuit" class="w-5 h-5 mr-3"></i>
          <span>Luyện tập & Kiểm tra</span>
        </button>
        <button onclick="navigateTo('bookmarks')" data-nav="bookmarks" class="nav-item w-full flex items-center px-3 py-2.5 text-sm font-medium rounded-xl transition-all">
          <i data-lucide="bookmark" class="w-5 h-5 mr-3"></i>
          <span>Mục đã đánh dấu</span>
        </button>
      </nav>

      <!-- Bottom Audio Settings & Info -->
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 space-y-3">
        <div class="bg-slate-100 dark:bg-jpdark-800 p-3 rounded-xl">
          <div class="flex items-center justify-between text-xs font-semibold text-slate-500 dark:text-slate-400 mb-2">

            <span id="ttsRateValue" class="text-sakura-500 font-bold">1.0x</span>

          <input type="range" id="ttsRateSlider" min="0.5" max="1.5" step="0.1" value="1.0" class="w-full accent-sakura-500 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-lg cursor-pointer">
        </div>
        
        <div class="text-xs text-center text-slate-400 dark:text-slate-500">
          Chỉ mục N5 theo Dũng Mori • v3.1
        </div>
      </div>
    </aside>

    <!-- Mobile backdrop: tap outside the drawer to close it. -->
    <button id="sidebarOverlay" type="button" aria-label="Đóng thanh điều hướng" tabindex="-1"

          <button id="openSidebarBtn" aria-label="Mở thanh điều hướng" title="Mở menu" class="md:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">

          <button id="desktopSidebarToggleBtn" aria-label="Thu gọn thanh điều hướng" aria-expanded="true" title="Thu gọn thanh bên"

            <span class="hidden sm:inline-block absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-semibold text-slate-400 border border-slate-300 dark:border-slate-700 px-1.5 py-0.5 rounded">/</span>

  <script>
    /* ==========================================================================
       1. DATASET ENGINE (N5 DŨNG MORI COMPREHENSIVE CURRICULUM BÀI 1A - 14C)

title":"N（は）いくらですか → N（は）số tiềnです","formula":"N（は）いくらですか → N（は）số tiềnです","meaning":"N bao nhiêu tiền?","explanation":"Mẫu câu được dùng để hỏi về giá tiền.<br>★ Phân tích thành phần câu:「いくら」từ để hỏi giá tiền: bao nhiêu tiền?","brief":"Mẫu câu được dùng để hỏi về giá tiền.","notes":"","examples":[{"jp":"①A：これ、いくらですか。<br>B：そちらは1,980<ruby>円<rt>えん</rt></ruby>です。","kana":"","vi":"","audio":"これ、いくらですか。 そちらは1,980円です。"},{"jp":"②A：それ（は）いくらですか。<br>B：こちらは3,800<ruby>円<rt>えん</rt></ruby>です。","kana":"","vi":"","audio":"それ（は）いくらですか。 こちらは3,800円です。"},{"jp":"③A：これはいくらですか。<br>B：そちらは500<ruby>円<rt>えん</rt></ruby>です。","kana":"","vi":"","audio":"これはいくらですか。 そちらは500円です。"}]},{"id":"g1c_7","lesson":"Bài 1C","title":"N（は）何ですか → N（は） Nです","formula":"N（は）何ですか → N（は） Nです","meaning":"N là cái gì? → N là N","explanation":"Mẫu câu được dùng để hỏi về đồ vật.<br>★ Phân tích thành phần câu:「何」từ để hỏi đồ vật: cái gì?","brief":"Mẫu câu được dùng để hỏi về đồ vật.","notes":"","examples":[{"jp":"①A：これは<ruby>何<rt>なん</rt></ruby>ですか。<br>B：カメラです。","kana":"","vi":"","audio":"これは何ですか。 カメラです。"},{"jp":"②A：それは<ruby>何<rt>なん</rt></ruby>ですか。<br>B：かさです。","kana":"","vi":"","audio":"それは何ですか。 かさです。"},{"jp":"③A：これは<ruby>何<rt>なん</rt></ruby>ですか。<br>B：（これは）<ruby>辞書<rt>じしょ</rt></ruby>です。","kana":"","vi":"","audio":"これは何ですか。 （これは）辞書です。"}]},{"id":"g1c_8","lesson":"Bài 1C","title":"～ね","formula":"～ね","meaning":"～nhỉ?","explanation":"「～ね」được để cuối câu để xác nhận lại thông tin từ đối phương một lần nữa.","brief":"「～ね」được để cuối câu để xác nhận lại thông tin từ đối phương một lần nữa.","notes":"","examples":[{"jp":"①A：<ruby>電話番号<rt>でんわばんごう</rt></ruby>は080-1234-5678です。<br>B：080-1234-5678ですね。","kana":"","vi":"","audio":"電話番号は080-1234-5678です。 080-1234-5678ですね。"},{"jp":"②こちらは4,500<ruby>円<rt>えん</rt></ruby>ですね。","kana":"","vi":"","audio":"こちらは4,500円ですね。"},{"jp":"③A：こちらは1,980<ruby>円<rt>えん</rt></ruby>です。<br>B：1,980<ruby>円<rt>えん</rt></ruby>ですね。","kana":"","vi":"","audio":"こちらは1,980円です。 1,980円ですね。"}]},{"id":"g1c_9","lesson":"Bài 1C","title":"～よね/～よ","formula":"～よね/～よ","meaning":"～đúng không nhỉ? ～ đấy/ cơ","explanation":"❶ 「よね」 được để cuối câu với 2 cách dùng chính:<br>・Người nói cho rằng điều mình đang nghĩ là đúng và muốn xác nhận lại với đối phương cho chắc chắn.<br>・Người nói tìm kiếm sự đồng tình từ đối phương khi tin rằng đối phương sẽ có cùng suy nghĩ với mình về một sự việc nào đó.<br>❷「よ」～ đấy (mà): Vĩ tố「よ」được để cuối câu, dùng để nói cho đối phương một thông tin mà người đó chưa biết.<br>Tuy nhiên, khi sử dụng「よ」thì câu nói sẽ có vẻ bề trên nên tránh sử dụng với cấp trên, người có mối quan hệ không thân thiết với mình.","brief":"❶ 「よね」 được để cuối câu với 2 cách dùng chính:","notes":"","examples":[{"jp":"①A：<ruby>今日<rt>きょう</rt></ruby>は３<ruby>日<rt>っか</rt></ruby>ですよね。<br>B：はい。そうです。","kana":"","vi":"","audio":"今日は３日ですよね。 はい。そうです。"},{"jp":"②A：これは1000<ruby>円<rt>えん</rt></ruby>ですよね。<br>B：いいえ、それは2000<ruby>円<rt>えん</rt></ruby>です。","kana":"","vi":"","audio":"これは1000円ですよね。 いいえ、それは2000円です。"},{"jp":"③A：<ruby>明日<rt>あした</rt></ruby>は<ruby>土曜日<rt>どようび</rt></ruby>ですよね。<br>B：いいえ、<ruby>明日<rt>あした</rt></ruby>は<ruby>日曜日<rt>にちようび</rt></ruby>ですよ。","kana":"","vi":"","audio":"明日は土曜日ですよね。 いいえ、明日は日曜日ですよ。"},{"jp":"④<ruby>田中<rt>たなか</rt></ruby>さん<br>→<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>会社員<rt>かいしゃいん</rt></ruby>ですよね。","kana":"","vi":"","audio":"田中さん 田中さんは会社員ですよね。"},{"jp":"⑤A<ruby>田中<rt>たなか</rt></ruby>さん・<ruby>会社員<rt>かいしゃいん</rt></ruby>B<ruby>会社員<rt>かいしゃいん</rt></ruby><br>→A：<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>会社員<rt>かいしゃいん</rt></ruby>ですよね。<br>B：はい、<ruby>会社員<rt>かいしゃいん</rt></ruby>です。","kana":"","vi":"","audio":"A田中さん・会社員B会社員 田中さんは会社員ですよね。 はい、会社員です。"},{"jp":"⑥Aすずきさん・<ruby>会社員<rt>かいしゃいん</rt></ruby>B<ruby>学生<rt>がくせい</rt></ruby><br>→A：ゆいさんは<ruby>会社員<rt>かいしゃいん</rt></ruby>ですよね。<br>B：いいえ、ゆいさんは<ruby>学生<rt>がくせい</rt></ruby>ですよ。","kana":"","vi":"","audio":"Aすずきさん・会社員B学生 ゆいさんは会社員ですよね。 いいえ、ゆいさんは学生ですよ。"}]},{"id":"g2a_1","lesson":"Bài 2A","title":"（Nは） N でした","formula":"（Nは） N でした","meaning":"N (đã) là N","explanation":"・Mẫu câu khẳng định trong quá khứ có vị ngữ là danh từ.<br>★ Phân tích thành phần câu:「でした」là dạng quá khứ của「～です」<br>・Tương tự thì Phi quá khứ, khi muốn tạo câu nghi vấn, chúng ta sẽ thêm「か」 ở cuối câu.","brief":"・Mẫu câu khẳng định trong quá khứ có vị ngữ là danh từ.","notes":"","examples":[{"jp":"①<ruby>昨日<rt>きのう</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みでした。","kana":"","vi":"","audio":"昨日は休みでした。"},{"jp":"②5<ruby>日<rt>つか</rt></ruby>は<ruby>誕<rt>たんじ</rt></ruby><ruby>生<rt>じょう</rt></ruby><ruby>日<rt>うび</rt></ruby>でした。","kana":"","vi":"","audio":"5日は誕生日でした。"},{"jp":"③これは1,000<ruby>円<rt>えん</rt></ruby>でした。","kana":"","vi":"","audio":"これは1,000円でした。"},{"jp":"④<ruby>田中<rt>たなか</rt></ruby>さん・<ruby>学生<rt>がくせい</rt></ruby><br>→<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>学生<rt>がくせい</rt></ruby>でした。","kana":"","vi":"","audio":"田中さん・学生 田中さんは学生でした。"}]},{"id":"g2a_2","lesson":"Bài 2A","title":"じゃなかったです / ( Nは) N じゃありませんでした / ではありませんでした","formula":"じゃなかったです / ( Nは) N じゃありませんでした / ではありませんでした","meaning":"N (đã) không phải là N","explanation":"Mẫu câu phủ định trong quá khứ có vị ngữ là danh từ.<br>★ Phân tích thành phần câu:<br>trong quá khứ của「でした」","brief":"Mẫu câu phủ định trong quá khứ có vị ngữ là danh từ.","notes":"","examples":[{"jp":"「じゃなかったです/じゃありませんでした/ではありませんでした」làdạngphủđịnh","kana":"","vi":"","audio":"「じゃなかったです/じゃありませんでした/ではありませんでした」làdạngphủđịnh"},{"jp":"①<ruby>昨日<rt>きのう</rt></ruby>は<ruby>仕事<rt>しごと</rt></ruby>じゃなかったです。<br>じゃありませんでした。<br>ではありませんでした。","kana":"","vi":"","audio":"昨日は仕事じゃなかったです。 じゃありませんでした。 ではありませんでした。"},{"jp":"②6<ruby>日<rt>いか</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みじゃなかったです。<br>じゃありませんでした。<br>ではありませんでした。","kana":"","vi":"","audio":"6日は休みじゃなかったです。 じゃありませんでした。 ではありませんでした。"},{"jp":"③A：<ruby>昨日<rt>きのう</rt></ruby>は<ruby>仕事<rt>しごと</rt></ruby>でしたか。<br>B：いいえ、<ruby>仕事<rt>しごと</rt></ruby>じゃなかったです。<ruby>休<rt>やす</rt></ruby>みでした。","kana":"","vi":"","audio":"昨日は仕事でしたか。 いいえ、仕事じゃなかったです。休みでした。"},{"jp":"④<ruby>昨日<rt>きのう</rt></ruby>・<ruby>雨<rt>あめ</rt></ruby>・〇→<ruby>昨日<rt>きのう</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>でした。<br><ruby>昨日<rt>きのう</rt></ruby>・<ruby>雨<rt>あめ</rt></ruby>・×→<ruby>昨日<rt>きのう</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>じゃなかったです。","kana":"","vi":"","audio":"昨日・雨・〇昨日は雨でした。 昨日・雨・×昨日は雨じゃなかったです。"},{"jp":"⑤<ruby>明日<rt>あした</rt></ruby>・<ruby>雨<rt>あめ</rt></ruby>・〇→<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>です。<br><ruby>明日<rt>あした</rt></ruby>・<ruby>雨<rt>あめ</rt></ruby>・×→<ruby>明日<rt>あした</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>じゃないです。","kana":"","vi":"","audio":"明日・雨・〇明日は雨です。 明日・雨・×明日は雨じゃないです。"}]},{"id":"g2b_3","lesson":"Bài 2B","title":"誰の Nですか / → N の Nです","formula":"誰の Nですか / → N の Nです","meaning":"N của ai ? → N của N","explanation":"（１）Cách nói về chủ sở hữu của một đồ vật nào đó.<br>★ Phân tích thành phần câu:<br>・ の: trợ từ<br>・Trợ từ nối giữa 2 danh từ<br>・Nghĩa là &quot;của&quot; N có thể được lược bỏ khi N đã được nhắc đến trước đó hoặc đã rõ nghĩa.<br>Khi đó, câu có dạng:「Nの です。」(Là của N).<br>Khi N không phải là đồ vật được sở hữu mà là danh từ chỉ người, chúng ta vẫn có thể dùng「N の N」để nói về một người nào đó có mối quan hệ với bản thân mình.","brief":"（１）Cách nói về chủ sở hữu của một đồ vật nào đó.","notes":"","examples":[{"jp":"①A：このかばんは<ruby>誰<rt>だれ</rt></ruby>のかばんですか。<br>B：ナムさんのかばんです。","kana":"","vi":"","audio":"このかばんは誰のかばんですか。 ナムさんのかばんです。"},{"jp":"②A：これ、<ruby>誰<rt>だれ</rt></ruby>のスマホですか。<br>B：あ、<ruby>私<rt>わたし</rt></ruby>のです。","kana":"","vi":"","audio":"これ、誰のスマホですか。 あ、私のです。"},{"jp":"③ナムさんは<ruby>私<rt>わたし</rt></ruby>の<ruby>友達<rt>ともだち</rt></ruby>です。","kana":"","vi":"","audio":"ナムさんは私の友達です。"},{"jp":"④A：これ、<ruby>誰<rt>だれ</rt></ruby>のかぎですか。<br>B：<ruby>山田<rt>やまだ</rt></ruby>さんのかぎです。","kana":"","vi":"","audio":"これ、誰のかぎですか。 山田さんのかぎです。"}]},{"id":"g2b_42","lesson":"Bài 2B","title":"じゃなかったです。 / 何の Nですか / ( Nは) N じゃありませんでした。 / → N の でNはであすりませ んでした。","formula":"じゃなかったです。 / 何の Nですか / ( Nは) N じゃありませんでした。 / → N の でNはであすりませ んでした。","meaning":"N về cái gì ? → N về N","explanation":"（2）Cách nói về nội dung, chủng loại của một đồ vật/ chủ thể nào đó.<br>N trong trường hợp này không thể lược bỏ.","brief":"（2）Cách nói về nội dung, chủng loại của một đồ vật/ chủ thể nào đó.","notes":"","examples":[{"jp":"①<ruby>日本料理<rt>にほんりょうり</rt></ruby>の<ruby>本<rt>ほん</rt></ruby>","kana":"","vi":"","audio":"日本料理の本"},{"jp":"②<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>本<rt>ほん</rt></ruby>","kana":"","vi":"","audio":"日本語の本"},{"jp":"③<ruby>日本語<rt>にほんご</rt></ruby>の<ruby>学校<rt>がっこう</rt></ruby>","kana":"","vi":"","audio":"日本語の学校"},{"jp":"④ベトナム<ruby>語<rt>ご</rt></ruby>の<ruby>先生<rt>せんせい</rt></ruby>","kana":"","vi":"","audio":"ベトナム語の先生"},{"jp":"⑤A：その<ruby>本<rt>ほん</rt></ruby>は<ruby>何<rt>なん</rt></ruby>の<ruby>本<rt>ほん</rt></ruby>ですか。<br>B：×<ruby>料理<rt>りょうり</rt></ruby>のです。/〇<ruby>料理<rt>りょうり</rt></ruby>の<ruby>本<rt>ほん</rt></ruby>です。","kana":"","vi":"","audio":"その本は何の本ですか。 ×料理のです。/〇料理の本です。"},{"jp":"⑥A：これは<ruby>何<rt>なん</rt></ruby>の<ruby>鍵<rt>かぎ</rt></ruby>ですか。<br>B：<ruby>車<rt>くるま</rt></ruby>の<ruby>鍵<rt>かぎ</rt></ruby>です。<br>これ","kana":"","vi":"","audio":"これは何の鍵ですか。 車の鍵です。 これ"}]},{"id":"g2b_5","lesson":"Bài 2B","title":"どこの Nですか / → N の Nです","formula":"どこの Nですか / → N の Nです","meaning":"N có nguồn gốc, xuất xứ ở đâu? → N của/ từ N","explanation":"（3）Cách nói về nguồn gốc, xuất xứ của một đồ vật/ chủ thể nào đó.<br>N có thể được lược bỏ khi N đã được nhắc đến trước đó hoặc đã rõ nghĩa.","brief":"（3）Cách nói về nguồn gốc, xuất xứ của một đồ vật/ chủ thể nào đó.","notes":"","examples":[{"jp":"①A：ナムさんのオートバイはどこのオートバイですか。<br>B：<ruby>韓国<rt>かんこく</rt></ruby>のオートバイです。","kana":"","vi":"","audio":"ナムさんのオートバイはどこのオートバイですか。 韓国のオートバイです。"},{"jp":"②A：このお<ruby>菓子<rt>かし</rt></ruby>、どこの（お<ruby>菓子<rt>かし</rt></ruby>）ですか。<br>B：ベトナムのです。","kana":"","vi":"","audio":"このお菓子、どこの（お菓子）ですか。 ベトナムのです。"},{"jp":"③A：<ruby>田中<rt>たなか</rt></ruby>さんB：<ruby>日本<rt>にほん</rt></ruby><br>→A：<ruby>田中<rt>たなか</rt></ruby>さんの<ruby>車<rt>くるま</rt></ruby>はどこの<ruby>車<rt>くるま</rt></ruby>ですか。<br>B：<ruby>日本<rt>にほん</rt></ruby>の<ruby>車<rt>くるま</rt></ruby>です。","kana":"","vi":"","audio":"田中さん日本 田中さんの車はどこの車ですか。 日本の車です。"}]},{"id":"g2b_6","lesson":"Bài 2B","title":"何の Nですか。 / → N の Nです。","formula":"何の Nですか。 / → N の Nです。","meaning":"N được làm từ gì? → N được làm từ N","explanation":"（4）Cách nói về nguyên vật liệu làm nên một đồ vật/ chủ thể nào đó.<br>N trong trường hợp này không thể lược bỏ.","brief":"（4）Cách nói về nguyên vật liệu làm nên một đồ vật/ chủ thể nào đó.","notes":"","examples":[{"jp":"①A：それは<ruby>何<rt>なん</rt></ruby>のお<ruby>菓子<rt>かし</rt></ruby>ですか。<br>B：×<ruby>豆<rt>まめ</rt></ruby>のです。/〇<ruby>豆<rt>まめ</rt></ruby>のお<ruby>菓子<rt>かし</rt></ruby>です。","kana":"","vi":"","audio":"それは何のお菓子ですか。 ×豆のです。/〇豆のお菓子です。"},{"jp":"②それはぶどうのお<ruby>菓子<rt>かし</rt></ruby>です。","kana":"","vi":"","audio":"それはぶどうのお菓子です。"},{"jp":"③A:<ruby>日本酒<rt>にほんしゅ</rt></ruby>は<ruby>何<rt>なん</rt></ruby>のお<ruby>酒<rt>さけ</rt></ruby>ですか。<br>B:<ruby>米<rt>こめ</rt></ruby>のお<ruby>酒<rt>さけ</rt></ruby>です。","kana":"","vi":"","audio":"日本酒は何のお酒ですか。 米のお酒です。"}]},{"id":"g2c_7","lesson":"Bài 2C","title":"N の N","formula":"N の N","meaning":"N của/ thuộc N","explanation":"2 (cơ quan tổ chức) 1<br>・Cách nói về nơi sở thuộc của người/ chủ thể nào đó.<br>★ Phân tích thành phần câu: N là cơ quan, tổ chức mà N trực thuộc.<br>SAKURA<br>*カンパニー：công ty","brief":"2 (cơ quan tổ chức) 1","notes":"","examples":[{"jp":"①<ruby>田中<rt>たなか</rt></ruby>さんはABCカンパニー*の<ruby>社員<rt>しゃいん</rt></ruby>です。","kana":"","vi":"","audio":"田中さんはABCカンパニー*の社員です。"},{"jp":"②<ruby>私<rt>わたし</rt></ruby>は、<ruby>大学<rt>だいがく</rt></ruby>の<ruby>職員<rt>しょくいん</rt></ruby>です。","kana":"","vi":"","audio":"私は、大学の職員です。"},{"jp":"③<ruby>鈴木<rt>すずき</rt></ruby>さんはSakura<ruby>図書館<rt>としょかん</rt></ruby>の<ruby>職員<rt>しょくいん</rt></ruby>です。<br><ruby>図書館<rt>としょかん</rt></ruby><br><ruby>鈴木<rt>すずき</rt></ruby>さん","kana":"","vi":"","audio":"鈴木さんはSakura図書館の職員です。 図書館 鈴木さん"}]},{"id":"g2c_8","lesson":"Bài 2C","title":"（N は） N で N です","formula":"（N は） N で N です","meaning":"N là N và là N","explanation":"・Cách nói liệt kê cho 2 danh từ trở lên đứng liền kề nhau.<br>★ Phân tích thành phần câu: Trợ từ「で」 nối trực tiếp giữa các danh từ liệt kê về đặc tính, chủng loại của người hoặc sự vật trong câu.<br>・Giống với tiếng Việt, tiếng Nhật cũng có từ loại Tính từ: dùng để nói về tính chất, đặc trưng, tình hình, trạng thái của con người, sự vật, sự việc... nào đó.<br>・Tính từ trong tiếng Nhật được chia làm 2 loại:<br>❶Tính từ đuôi「い」: Là những tính từ có đuôi kết thúc bằng「い」; ký hiệu là A<br>❷Tính từ đuôi「な」: Là những tính từ khi kết hợp với Danh từ để tạo thành một cụm danh từ thì sau tính từ phải thêm「な」 (phần này sẽ được học kỹ hơn trong phần C của bài); ký hiệu là A","brief":"・Cách nói liệt kê cho 2 danh từ trở lên đứng liền kề nhau.","notes":"","examples":[{"jp":"①<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>日本人<rt>にほんじん</rt></ruby>でABCカンパニーの<ruby>社員<rt>しゃいん</rt></ruby>です。","kana":"","vi":"","audio":"田中さんは日本人でABCカンパニーの社員です。"},{"jp":"②アインさん・<ruby>会社員<rt>かいしゃいん</rt></ruby>・エンジニア<br>→アインさんは<ruby>会社員<rt>かいしゃいん</rt></ruby>でエンジニアです。<br>ふじ<ruby>大学<rt>だいがく</rt></ruby>","kana":"","vi":"","audio":"アインさん・会社員・エンジニア アインさんは会社員でエンジニアです。 ふじ大学"},{"jp":"③ミンさんはベトナム<ruby>人<rt>じん</rt></ruby>でふじ<ruby>大学<rt>だいがく</rt></ruby>の<ruby>学生<rt>がくせい</rt></ruby>です。<br>ミンさん","kana":"","vi":"","audio":"ミンさんはベトナム人でふじ大学の学生です。 ミンさん"}]},{"id":"g3a_1","lesson":"Bài 3A","title":"（Nは） A です","formula":"（Nは） A です","meaning":"N (có tính chất, đặc điểm) A","explanation":"Mẫu câu khẳng định của câu có vị ngữ là tính từ A<br>★ Phân tích thành phần câu:<br>・Trật tự câu hoàn toàn tương tự với cấu trúc câu có vị ngữ là danh từ.<br>・Các phó từ chỉ mức độ như: ちょっと (một chút),少し (hơi hơi), まあまあ (bình thường, tàm tạm), とても(rất),本当に(thật sự)... sẽ đứng trước A .<br>⑤","brief":"Mẫu câu khẳng định của câu có vị ngữ là tính từ A","notes":"","examples":[{"jp":"い","kana":"","vi":"","audio":"い"},{"jp":"①<ruby>今日<rt>きょう</rt></ruby>は<ruby>暑<rt>あつ</rt></ruby>いです。","kana":"","vi":"","audio":"今日は暑いです。"},{"jp":"②<ruby>毎日<rt>まいにち</rt></ruby><ruby>忙<rt>いそが</rt></ruby>しいです。","kana":"","vi":"","audio":"毎日忙しいです。"},{"jp":"③ベトナム<ruby>料理<rt>りょうり</rt></ruby>はとてもおいしいです。","kana":"","vi":"","audio":"ベトナム料理はとてもおいしいです。"},{"jp":"④この<ruby>店<rt>みせ</rt></ruby>は<ruby>本当<rt>ほんとう</rt></ruby>に<ruby>安<rt>やす</rt></ruby>いですね。<br>→<ruby>美味<rt>おい</rt></ruby>しい。","kana":"","vi":"","audio":"この店は本当に安いですね。 美味しい。"}]},{"id":"g3a_2","lesson":"Bài 3A","title":"（Nは） A くないです","formula":"（Nは） A くないです","meaning":"N không có (tính chất, đặc điểm) A","explanation":"Mẫu câu phủ định có vị ngữ là tính từ A ở thì Phi quá khứ.<br>★ Phân tích thành phần câu:<br>・Aくない là dạng phủ định của A<br>・ Một số phó từ chỉ mức độ thường đi kèm với thể phủ định như: あまり (không lắm), 全然(hoàn toàn không),そんなに(không đến mức đó, đến mức như thế).<br>❖Trường hợp đặc biệt:「いい」→ 「よくない」<br>❖Câu phủ định của tính từ A khác với câu phủ định của danh từ, phần phủ định sẽ được thể hiện ngay trong cách chia của từ và cuối câu kết thúc bằng「です。」","brief":"Mẫu câu phủ định có vị ngữ là tính từ A ở thì Phi quá khứ.","notes":"","examples":[{"jp":"い","kana":"","vi":"","audio":"い"},{"jp":"①<ruby>暑<rt>あつ</rt></ruby>い→<ruby>暑<rt>あつ</rt></ruby>いくない<br><ruby>今日<rt>きょう</rt></ruby>は<ruby>暑<rt>あつ</rt></ruby>くないです。","kana":"","vi":"","audio":"暑い暑いくない 今日は暑くないです。"},{"jp":"②<ruby>忙<rt>いそが</rt></ruby>しい→<ruby>忙<rt>いそが</rt></ruby>しいくない<br><ruby>明日<rt>あした</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しくないです。","kana":"","vi":"","audio":"忙しい忙しいくない 明日は忙しくないです。"},{"jp":"③この<ruby>店<rt>みせ</rt></ruby>・<ruby>広<rt>ひろ</rt></ruby>い・×<br>→この<ruby>店<rt>みせ</rt></ruby>は<ruby>広<rt>ひろ</rt></ruby>くないです。","kana":"","vi":"","audio":"この店・広い・× この店は広くないです。"},{"jp":"④この<ruby>学校<rt>がっこう</rt></ruby>・<ruby>新<rt>あたら</rt></ruby>しい・あまり<br>→この<ruby>学校<rt>がっこう</rt></ruby>はあまり<ruby>新<rt>あたら</rt></ruby>しくないです。","kana":"","vi":"","audio":"この学校・新しい・あまり この学校はあまり新しくないです。"}]},{"id":"g3a_3","lesson":"Bài 3A","title":"（Nは） A です","formula":"（Nは） A です","meaning":"N (có tính chất, đặc điểm) A","explanation":"・Mẫu câu khẳng định có vị ngữ là tính từ A<br>・Mẫu câu diễn tả tính chất, đặc điểm của chủ thể ở thì Phi quá khứ.<br>❖Một số tính từ kết thúc là いnhưng được xếp vào nhóm tính từ đuôi A :","brief":"・Mẫu câu khẳng định có vị ngữ là tính từ A","notes":"","examples":[{"jp":"「きれい」、「ていねい」、「<ruby>有名<rt>ゆうめい</rt></ruby>」、「<ruby>嫌<rt>きら</rt></ruby>い」、...","kana":"","vi":"","audio":"「きれい」、「ていねい」、「有名」、「嫌い」、..."},{"jp":"①すずきさん・きれい・<ruby>本当<rt>ほんとう</rt></ruby>に<br>→すずきさんは<ruby>本当<rt>ほんとう</rt></ruby>にきれいです。","kana":"","vi":"","audio":"すずきさん・きれい・本当に すずきさんは本当にきれいです。"},{"jp":"②このレストランはとても<ruby>有名<rt>ゆうめい</rt></ruby>です。","kana":"","vi":"","audio":"このレストランはとても有名です。"},{"jp":"③あの<ruby>人<rt>ひと</rt></ruby>、すごくハンサムですね。","kana":"","vi":"","audio":"あの人、すごくハンサムですね。"}]},{"id":"g3a_4","lesson":"Bài 3A","title":"（ N は） A じゃない です/じゃありません","formula":"（ N は） A じゃない です/じゃありません","meaning":"N không có (tính chất, đặc điểm) A","explanation":"・Mẫu câu phủ định có vị ngữ là tính từ A .Mẫu câu phủ nhận một tính chất, đặc điểm nào đó của chủ thể ở thì Phi quá khứ.<br>❖A có dạng phủ định hoàn toàn tương tự với Danh từ.<br>❖Aじゃないです/Aじゃありませんlà dạng phủ định của A .","brief":"・Mẫu câu phủ định có vị ngữ là tính từ A .Mẫu câu phủ nhận một tính chất, đặc điểm nào đó của chủ thể ở thì Phi quá khứ.","notes":"","examples":[{"jp":"①この<ruby>駅<rt>えき</rt></ruby>はあまり<ruby>便利<rt>べんり</rt></ruby>じゃないです。","kana":"","vi":"","audio":"この駅はあまり便利じゃないです。"},{"jp":"②この<ruby>店<rt>みせ</rt></ruby>の<ruby>店員<rt>てんいん</rt></ruby>・あまり・ていねい・×<br>→この<ruby>店<rt>みせ</rt></ruby>の<ruby>店員<rt>てんいん</rt></ruby>、あまりていねいじゃないですね。","kana":"","vi":"","audio":"この店の店員・あまり・ていねい・× この店の店員、あまりていねいじゃないですね。"},{"jp":"③<ruby>私<rt>わたし</rt></ruby>の<ruby>会社<rt>かいしゃ</rt></ruby>・ぜんぜん・ゆうめい・×<br>→<ruby>私<rt>わたし</rt></ruby>の<ruby>会社<rt>かいしゃ</rt></ruby>はぜんぜんゆうめいじゃないです。","kana":"","vi":"","audio":"私の会社・ぜんぜん・ゆうめい・× 私の会社はぜんぜんゆうめいじゃないです。"}]},{"id":"g3a_5","lesson":"Bài 3A","title":"（Nは）A /A ですか","formula":"（Nは）A /A ですか","meaning":"Mẫu câu nghi vấn có vị ngữ là tính từ, dùng để hỏi xem N trong câu có tính chất, đặc điểm A hay không.","explanation":"Mẫu câu nghi vấn có vị ngữ là tính từ, dùng để hỏi xem N trong câu có tính chất, đặc điểm A hay không.","brief":"Mẫu câu nghi vấn có vị ngữ là tính từ, dùng để hỏi xem N trong câu có tính chất, đặc điểm A hay không.","notes":"","examples":[{"jp":"①A：<ruby>田中<rt>たなか</rt></ruby>さんの<ruby>部屋<rt>へや</rt></ruby>は<ruby>広<rt>ひろ</rt></ruby>いですか。<br>B：そうですね…。まあまあ<ruby>広<rt>ひろ</rt></ruby>いです。","kana":"","vi":"","audio":"田中さんの部屋は広いですか。 そうですね…。まあまあ広いです。"},{"jp":"②A：ベトナムは<ruby>今<rt>いま</rt></ruby>、<ruby>暑<rt>あつ</rt></ruby>いですか。<br>B：ええ、とても<ruby>暑<rt>あつ</rt></ruby>いですよ。","kana":"","vi":"","audio":"ベトナムは今、暑いですか。 ええ、とても暑いですよ。"},{"jp":"③A：ハノイは<ruby>賑<rt>にぎ</rt></ruby>やかですか。<br>B：はい、<ruby>賑<rt>にぎ</rt></ruby>やかですよ。","kana":"","vi":"","audio":"ハノイは賑やかですか。 はい、賑やかですよ。"}]},{"id":"g3b_6","lesson":"Bài 3B","title":"（Nは）A くて＋ A /A です","formula":"（Nは）A くて＋ A /A です","meaning":"N (có tính chất, đặc điểm) A và A /A","explanation":"・Mẫu câu được dùng để nối A và một tính từ khác (tính từ A đứng trước tính từ còn lại)<br>・Tính từ A đứng trước sẽ được biến đổi về dạng「A + くて」<br>❖ Hai tính từ phải cùng chiều đánh giá tích cực hoặc tiêu cực.","brief":"・Mẫu câu được dùng để nối A và một tính từ khác (tính từ A đứng trước tính từ còn lại)","notes":"","examples":[{"jp":"いいな<br>❖「いい」→「よくて」","kana":"","vi":"","audio":"いいな ❖「いい」「よくて」"},{"jp":"①<ruby>安<rt>やす</rt></ruby>いです＋おいしいです→<ruby>安<rt>やす</rt></ruby>くておいしいです。","kana":"","vi":"","audio":"安いです＋おいしいです安くておいしいです。"},{"jp":"②<ruby>新<rt>あたら</rt></ruby>しいです＋<ruby>広<rt>ひろ</rt></ruby>いです→<ruby>新<rt>あたら</rt></ruby>しくて<ruby>広<rt>ひろ</rt></ruby>いです。","kana":"","vi":"","audio":"新しいです＋広いです新しくて広いです。"},{"jp":"③<ruby>私<rt>わたし</rt></ruby>の<ruby>部屋<rt>へや</rt></ruby>は<ruby>新<rt>あたら</rt></ruby>しくて<ruby>広<rt>ひろ</rt></ruby>いです。(A＋A）","kana":"","vi":"","audio":"私の部屋は新しくて広いです。(A＋A）"},{"jp":"④この<ruby>店<rt>みせ</rt></ruby>は、<ruby>新<rt>あたら</rt></ruby>しくてきれいですね。（A＋A）","kana":"","vi":"","audio":"この店は、新しくてきれいですね。（A＋A）"},{"jp":"⑤この<ruby>車<rt>くるま</rt></ruby>・ちいさい・かわいい→この<ruby>車<rt>くるま</rt></ruby>はちいさくてかわいいです。","kana":"","vi":"","audio":"この車・ちいさい・かわいいこの車はちいさくてかわいいです。"}]},{"id":"g3b_7","lesson":"Bài 3B","title":"（Nは）A で＋ A /A です","formula":"（Nは）A で＋ A /A です","meaning":"N (có tính chất, đặc điểm) A và A /A","explanation":"・Mẫu câu được dùng để nối A và một tính từ khác (tính từ A đứng trước tính từ còn lại)<br>・Tính từ A đứng trước sẽ được biến đổi về dạng「A + で」<br>❖ Hai tính từ phải cùng chiều đánh giá tích cực hoặc tiêu cực.","brief":"・Mẫu câu được dùng để nối A và một tính từ khác (tính từ A đứng trước tính từ còn lại)","notes":"","examples":[{"jp":"ないな","kana":"","vi":"","audio":"ないな"},{"jp":"①<ruby>静<rt>しず</rt></ruby>かです＋きれいです→<ruby>静<rt>しず</rt></ruby>かできれいです。","kana":"","vi":"","audio":"静かです＋きれいです静かできれいです。"},{"jp":"②<ruby>便利<rt>べんり</rt></ruby>です＋にぎやかです→<ruby>便利<rt>べんり</rt></ruby>でにぎやかです。","kana":"","vi":"","audio":"便利です＋にぎやかです便利でにぎやかです。"},{"jp":"③この<ruby>町<rt>まち</rt></ruby>は、<ruby>便利<rt>べんり</rt></ruby>でにぎやかです。(A＋A）","kana":"","vi":"","audio":"この町は、便利でにぎやかです。(A＋A）"},{"jp":"④マイさんは、<ruby>親切<rt>しんせつ</rt></ruby>で<ruby>可愛<rt>かわい</rt></ruby>いです。（A＋A）","kana":"","vi":"","audio":"マイさんは、親切で可愛いです。（A＋A）"}]},{"id":"g3b_8","lesson":"Bài 3B","title":"（Nは） どうですか","formula":"（Nは） どうですか","meaning":"N thì thế nào?","explanation":"・Cách hỏi trạng thái, đặc điểm, tính chất của một chủ thể nào đó.<br>・「どう」- từ để hỏi về đặc điểm tính chất của chủ thể: như thế nào?","brief":"・Cách hỏi trạng thái, đặc điểm, tính chất của một chủ thể nào đó.","notes":"","examples":[{"jp":"①A：<ruby>最近<rt>さいきん</rt></ruby>、お<ruby>仕事<rt>しごと</rt></ruby>はどうですか。<br>B：あまり<ruby>忙<rt>いそが</rt></ruby>しくないです。","kana":"","vi":"","audio":"最近、お仕事はどうですか。 あまり忙しくないです。"},{"jp":"②A：<ruby>学校<rt>がっこう</rt></ruby>はどうですか。<br>B：<ruby>楽<rt>たの</rt></ruby>しいです。","kana":"","vi":"","audio":"学校はどうですか。 楽しいです。"},{"jp":"③A：その<ruby>料理<rt>りょうり</rt></ruby>、どうですか。<br>B：ちょっと<ruby>辛<rt>から</rt></ruby>いです。","kana":"","vi":"","audio":"その料理、どうですか。 ちょっと辛いです。"}]},{"id":"g3b_9","lesson":"Bài 3B","title":"(N は)〜 が、〜","formula":"(N は)〜 が、〜","meaning":"N thì～nhưng～","explanation":"・ Cách nói diễn tả hai mệnh đề có sự đánh giá trái ngược「: Aです が Bです」<br>・「が」- dùng để nối 2 mệnh đề có ý nghĩa, sắc thái tương phản nhau.","brief":"・ Cách nói diễn tả hai mệnh đề có sự đánh giá trái ngược「: Aです が Bです」","notes":"","examples":[{"jp":"①この<ruby>店<rt>みせ</rt></ruby>・<ruby>美味<rt>おい</rt></ruby>しいです＋<ruby>安<rt>やす</rt></ruby>くないです<br>→この<ruby>店<rt>みせ</rt></ruby>は<ruby>美味<rt>おい</rt></ruby>しいですが、<ruby>安<rt>やす</rt></ruby>くないです。","kana":"","vi":"","audio":"この店・美味しいです＋安くないです この店は美味しいですが、安くないです。"},{"jp":"②この<ruby>町<rt>まち</rt></ruby>・きれいじゃないです＋<ruby>便利<rt>べんり</rt></ruby>です<br>→この<ruby>町<rt>まち</rt></ruby>はきれいじゃないですが、<ruby>便利<rt>べんり</rt></ruby>です。","kana":"","vi":"","audio":"この町・きれいじゃないです＋便利です この町はきれいじゃないですが、便利です。"},{"jp":"③<ruby>仕事<rt>しごと</rt></ruby>・<ruby>忙<rt>いそが</rt></ruby>しい・<ruby>面白<rt>おもしろ</rt></ruby>い<br>→<ruby>仕事<rt>しごと</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しいですが、<ruby>面白<rt>おもしろ</rt></ruby>いです。","kana":"","vi":"","audio":"仕事・忙しい・面白い 仕事は忙しいですが、面白いです。"}]},{"id":"g3c_10","lesson":"Bài 3C","title":"（Nは） Ａ かったです / （Nは） Ａ くなかったです","formula":"（Nは） Ａ かったです / （Nは） Ａ くなかったです","meaning":"N đã/ đã không (có tính chất, đặc điểm) A","explanation":"・ Ａ です → Ａ かったです (Tính từ A ở quá khứ)<br>・ Ａくないです → Ａ かったです (Phủ định của tính từ A ở quá khứ)","brief":"・ Ａ です → Ａ かったです (Tính từ A ở quá khứ)","notes":"","examples":[{"jp":"い<br>❖いい→(＋)よかった<br>(－)よくなかった","kana":"","vi":"","audio":"い ❖いい(＋)よかった (－)よくなかった"},{"jp":"①バーベキューは<ruby>楽<rt>たの</rt></ruby>しかったです。","kana":"","vi":"","audio":"バーベキューは楽しかったです。"},{"jp":"②<ruby>昨日<rt>きのう</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しくなかったです。","kana":"","vi":"","audio":"昨日は忙しくなかったです。"},{"jp":"③A：そのラーメン、おいしかったですか。<br>B：おいしかったですが、<ruby>辛<rt>から</rt></ruby>かったです。","kana":"","vi":"","audio":"そのラーメン、おいしかったですか。 おいしかったですが、辛かったです。"},{"jp":"④A：<ruby>東京<rt>とうきょう</rt></ruby>はどうでしたか。<br>B：<ruby>楽<rt>たの</rt></ruby>しかったですが、<ruby>人<rt>ひと</rt></ruby>が<ruby>多<rt>おお</rt></ruby>かったです。","kana":"","vi":"","audio":"東京はどうでしたか。 楽しかったですが、人が多かったです。"}]},{"id":"g3c_11","lesson":"Bài 3C","title":"（Nは） Ａ でした / （Nは） Ａ じゃなかったです","formula":"（Nは） Ａ でした / （Nは） Ａ じゃなかったです","meaning":"N đã/ đã không (có tính chất, đặc điểm) A","explanation":"・ Ａ です → Ａ でした (Tính từ A ở quá khứ)<br>・ Ａじゃないです → Ａじゃなかったです (Phủ định của tính từ A ở quá khứ)","brief":"・ Ａ です → Ａ でした (Tính từ A ở quá khứ)","notes":"","examples":[{"jp":"①<ruby>昨日<rt>きのう</rt></ruby>のパーティーはにぎやかでした。","kana":"","vi":"","audio":"昨日のパーティーはにぎやかでした。"},{"jp":"②この<ruby>町<rt>まち</rt></ruby>は<ruby>昔<rt>むかし</rt></ruby><ruby>便利<rt>べんり</rt></ruby>じゃなかったです。","kana":"","vi":"","audio":"この町は昔便利じゃなかったです。"},{"jp":"③<ruby>昔<rt>むかし</rt></ruby>、<ruby>父<rt>ちち</rt></ruby>はとてもハンサムでした。","kana":"","vi":"","audio":"昔、父はとてもハンサムでした。"},{"jp":"④A：<ruby>昨日<rt>きのう</rt></ruby>、<ruby>日本語<rt>にほんご</rt></ruby>のテストでしたよね。どうでしたか。<br>B：とても<ruby>簡単<rt>かんたん</rt></ruby>でした。","kana":"","vi":"","audio":"昨日、日本語のテストでしたよね。どうでしたか。 とても簡単でした。"}]},{"id":"g3c_12","lesson":"Bài 3C","title":"どんな N ですか？ / → A N/ A Nです","formula":"どんな N ですか？ / → A N/ A Nです","meaning":"N như thế nào? N (mà) A /A","explanation":"・Tính từ bổ nghĩa cho danh từ<br>・ 「どんな+N」: dùng để hỏi về đặc trưng, tính chất của một danh từ nào đó.<br>❶Khi tính từ bổ nghĩa cho danh từ, không chia tính từ về dạng quá khứ, mà đưa danh từ đã được bổ nghĩa về dạng quá khứ「A /A ＋Nでした」<br>例 １．(Khi nói về sự thay đổi của thành phố) ２．(Khi hỏi cảm nhận của người đã từng đi du lịch Nhật Bản)<br>❷「どう」có thể kết hợp trực tiếp với「ですか」, còn sau「どんな」 luôn phải kết hợp cùng một danh từ.","brief":"・Tính từ bổ nghĩa cho danh từ","notes":"","examples":[{"jp":"いな","kana":"","vi":"","audio":"いな"},{"jp":"例A：<ruby>山田<rt>やまだ</rt></ruby>さんは、どんな<ruby>人<rt>ひと</rt></ruby>ですか。<br>B：とても<ruby>親切<rt>しんせつ</rt></ruby>な<ruby>人<rt>ひと</rt></ruby>ですよ。<br>C：<ruby>面白<rt>おもしろ</rt></ruby>い<ruby>人<rt>ひと</rt></ruby>ですよ。<br>この<ruby>町<rt>まち</rt></ruby>は<ruby>昔<rt>むかし</rt></ruby>、<ruby>小<rt>ちい</rt></ruby>さくて<ruby>不便<rt>ふべん</rt></ruby>な<ruby>町<rt>まち</rt></ruby>でした。<ruby>今<rt>いま</rt></ruby>は<ruby>大<rt>おお</rt></ruby>きくて<ruby>便利<rt>べんり</rt></ruby>な<ruby>町<rt>まち</rt></ruby>です。<br>×<ruby>小<rt>ちい</rt></ruby>さくて<ruby>不便<rt>ふべん</rt></ruby>だった<ruby>町<rt>まち</rt></ruby>です。<br>Ａ：<ruby>東京<rt>とうきょう</rt></ruby>はどんな<ruby>町<rt>まち</rt></ruby>でしたか。<br>Ｂ：<ruby>大<rt>おお</rt></ruby>きくてにぎやかな<ruby>町<rt>まち</rt></ruby>でした。<br>×<ruby>大<rt>おお</rt></ruby>きくてにぎやかだった<ruby>町<rt>まち</rt></ruby>です。","kana":"","vi":"","audio":"山田さんは、どんな人ですか。 とても親切な人ですよ。 C：面白い人ですよ。 この町は昔、小さくて不便な町でした。今は大きくて便利な町です。 ×小さくて不便だった町です。 東京はどんな町でしたか。 大きくてにぎやかな町でした。 ×大きくてにぎやかだった町です。"},{"jp":"①A：<ruby>田中<rt>たなか</rt></ruby>さんはどんな<ruby>人<rt>ひと</rt></ruby>ですか。<br>B：ハンサムな<ruby>人<rt>ひと</rt></ruby>です。","kana":"","vi":"","audio":"田中さんはどんな人ですか。 ハンサムな人です。"},{"jp":"②A：Bさんの<ruby>部屋<rt>へや</rt></ruby>はどんな<ruby>部屋<rt>へや</rt></ruby>ですか。<br>B：<ruby>広<rt>ひろ</rt></ruby>くて<ruby>明<rt>あか</rt></ruby>るい<ruby>部屋<rt>へや</rt></ruby>です。","kana":"","vi":"","audio":"Bさんの部屋はどんな部屋ですか。 広くて明るい部屋です。"},{"jp":"③<ruby>神戸<rt>こうべ</rt></ruby>は<ruby>日本<rt>にほん</rt></ruby>の<ruby>有名<rt>ゆうめい</rt></ruby>な<ruby>町<rt>まち</rt></ruby>です。","kana":"","vi":"","audio":"神戸は日本の有名な町です。"},{"jp":"④<ruby>鈴木<rt>すずき</rt></ruby>さんは、とても<ruby>元気<rt>げんき</rt></ruby>な<ruby>学生<rt>がくせい</rt></ruby>です。","kana":"","vi":"","audio":"鈴木さんは、とても元気な学生です。"},{"jp":"⑤<ruby>親切<rt>しんせつ</rt></ruby>・<ruby>人<rt>ひと</rt></ruby>→<ruby>親切<rt>しんせつ</rt></ruby>な<ruby>人<rt>ひと</rt></ruby>です。","kana":"","vi":"","audio":"親切・人親切な人です。"},{"jp":"⑥<ruby>親切<rt>しんせつ</rt></ruby>・<ruby>頭<rt>あたま</rt></ruby>がいい・<ruby>人<rt>ひと</rt></ruby>→<ruby>親切<rt>しんせつ</rt></ruby>で<ruby>頭<rt>あたま</rt></ruby>がいい<ruby>人<rt>ひと</rt></ruby>です。","kana":"","vi":"","audio":"親切・頭がいい・人親切で頭がいい人です。"}]},{"id":"g3d_13","lesson":"Bài 3D","title":"Nで từ để hỏi が 一番 Aですか / （Nで） N が 一番 Aです","formula":"Nで từ để hỏi が 一番 Aですか / （Nで） N が 一番 Aです","meaning":"Trong phạm vi N thì (ai, cái gì, ở đâu) là A nhất? Trong phạm vi N thì N là nhất.","explanation":"・ 「～で」trợ từ đứng sau phạm vi hoặc địa điểm so sánh.<br>・ 「～が」 trợ từ đứng sau đối tượng được đánh giá có mức độ cao nhất.<br>❖Từ để hỏi thay đổi theo nhóm đối tượng của N1: Người（誰）； Vật（何/どれ）； Địa điểm（どこ）；Thời gian（いつ、何月、...）","brief":"・ 「～で」trợ từ đứng sau phạm vi hoặc địa điểm so sánh.","notes":"","examples":[{"jp":"例A：クラスで、<ruby>誰<rt>だれ</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby>ハンサムですか。<br>B：ズン<ruby>先生<rt>せんせい</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby>ハンサムです。","kana":"","vi":"","audio":"クラスで、誰が一番ハンサムですか。 ズン先生が一番ハンサムです。"},{"jp":"①A：この<ruby>店<rt>みせ</rt></ruby>で、<ruby>何<rt>なに</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby>おいしいですか。<br>B：このケーキが<ruby>一番<rt>いちばん</rt></ruby>おいしいですよ。","kana":"","vi":"","audio":"この店で、何が一番おいしいですか。 このケーキが一番おいしいですよ。"},{"jp":"②A：<ruby>日本<rt>にほん</rt></ruby>で、どこが<ruby>一番<rt>いちばん</rt></ruby><ruby>寒<rt>さむ</rt></ruby>いですか。<br>B：<ruby>北海道<rt>ほっかいどう</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>寒<rt>さむ</rt></ruby>いです。","kana":"","vi":"","audio":"日本で、どこが一番寒いですか。 北海道が一番寒いです。"},{"jp":"③A：フォーとバインミーとゴイ・クォンはベトナムの<ruby>有名<rt>ゆうめい</rt></ruby>な<ruby>料理<rt>りょうり</rt></ruby>です。<br>B：その<ruby>中<rt>なか</rt></ruby>で、どれが<ruby>一番<rt>いちばん</rt></ruby><ruby>有名<rt>ゆうめい</rt></ruby>ですか。<br>A：フォーが<ruby>一番<rt>いちばん</rt></ruby><ruby>有名<rt>ゆうめい</rt></ruby>です。","kana":"","vi":"","audio":"フォーとバインミーとゴイ・クォンはベトナムの有名な料理です。 その中で、どれが一番有名ですか。 フォーが一番有名です。"},{"jp":"④A：<ruby>日本<rt>にほん</rt></ruby>・どこ・<ruby>人<rt>ひと</rt></ruby>が<ruby>多<rt>おお</rt></ruby>いB：<ruby>東京<rt>とうきょう</rt></ruby><br>→A：<ruby>日本<rt>にほん</rt></ruby>で、どこが<ruby>一番<rt>いちばん</rt></ruby><ruby>人<rt>ひと</rt></ruby>が<ruby>多<rt>おお</rt></ruby>いですか。<br>B：<ruby>東京<rt>とうきょう</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>人<rt>ひと</rt></ruby>が<ruby>多<rt>おお</rt></ruby>いです。","kana":"","vi":"","audio":"日本・どこ・人が多い東京 日本で、どこが一番人が多いですか。 東京が一番人が多いです。"}]},{"id":"g3d_14","lesson":"Bài 3D","title":"Nと N（と）、どっち/どちらが Aですか / N（N）の ほうが Aです","formula":"Nと N（と）、どっち/どちらが Aですか / N（N）の ほうが Aです","meaning":"N và N thì cái nào ～ hơn? → N/ N ～hơn","explanation":"・ Trợ từ「と」thứ 2 có thể được lược bỏ hoặc thay bằng trợ từ「の」.<br>❖Luôn sử dụng từ để hỏi là「どちら」hoặc「どっち」 dù N , N là người, vật, hay địa điểm... .<br>❖Trường hợp không đưa ra lựa chọn nào cả và muốn nói rằng cả hai cái đều được thì chúng ta sẽ dùng「どちらも/どっちも」.","brief":"・ Trợ từ「と」thứ 2 có thể được lược bỏ hoặc thay bằng trợ từ「の」.","notes":"","examples":[{"jp":"①A：この<ruby>店<rt>みせ</rt></ruby>とあの<ruby>店<rt>みせ</rt></ruby>とどちらがおいしいですか。<br>B：あの<ruby>店<rt>みせ</rt></ruby>のほうがおいしいですよ。","kana":"","vi":"","audio":"この店とあの店とどちらがおいしいですか。 あの店のほうがおいしいですよ。"},{"jp":"②A：フォーとバインミー、どちらが<ruby>有名<rt>ゆうめい</rt></ruby>ですか。<br>B：どちらも<ruby>有名<rt>ゆうめい</rt></ruby>です。","kana":"","vi":"","audio":"フォーとバインミー、どちらが有名ですか。 どちらも有名です。"},{"jp":"③A：<ruby>日本<rt>にほん</rt></ruby>・ベトナム・<ruby>暑<rt>あつ</rt></ruby>いB：ベトナム<br>→A：<ruby>日本<rt>にほん</rt></ruby>とベトナムと、どちらが<ruby>暑<rt>あつ</rt></ruby>いですか。<br>B：ベトナムのほうが<ruby>暑<rt>あつ</rt></ruby>いです。","kana":"","vi":"","audio":"日本・ベトナム・暑いベトナム 日本とベトナムと、どちらが暑いですか。 ベトナムのほうが暑いです。"}]},{"id":"g3d_15","lesson":"Bài 3D","title":"N（は） N より A です","formula":"N（は） N より A です","meaning":"N (thì) A hơn N","explanation":"・ Mẫu câu so sánh hơn, trong đó N1 được đưa ra so sánh với N2<br>・Khi giao tiếp với những người có mối quan hệ thân thiết, gần gũi như bạn bè, người thân... người Nhật sẽ sử dụng lối nói có tính suồng sã, thân mật - được gọi là thể thường (普通形)<br>・ Trước hết, chúng ta sẽ cùng tìm hiểu về thể thường của câu danh từ và tính từ đuôi「な」 Thể lịch sự Thể thường Câu khẳng định Phi quá phủ định N/A じゃありません。<br>khứ (hiện tại, N は N/A ですか。 N（は）N/A ？ tương lai) Câu khẳng định Quá khứ","brief":"・ Mẫu câu so sánh hơn, trong đó N1 được đưa ra so sánh với N2","notes":"","examples":[{"jp":"①フォーはバインミーより<ruby>有名<rt>ゆうめい</rt></ruby>です。","kana":"","vi":"","audio":"フォーはバインミーより有名です。"},{"jp":"②ベトナムは<ruby>日本<rt>にほん</rt></ruby>より<ruby>暑<rt>あつ</rt></ruby>いです","kana":"","vi":"","audio":"ベトナムは日本より暑いです"},{"jp":"③<ruby>北海道<rt>ほっかいどう</rt></ruby>は<ruby>東京<rt>とうきょう</rt></ruby>より<ruby>寒<rt>さむ</rt></ruby>いです。<br>NはN/Aです。N（は）N/Aだ。<br>CâuNはN/Aじゃないです。N（は）N/Aじゃない。<br>Câuはい、N/Aです。うん、N/A（だ）。<br>nghivấnいいえ、N/Aじゃないです。ううん、N/Aじゃない。<br>N/Aじゃありません。<br>NはN/Aでした。N（は）N/Aだった。<br>CâuNはN/Aじゃなかったです。N（は）N/Aじゃなかった。<br>phủđịnhN/Aじゃありませんでした。<br>NはN/Aでしたか。N（は）N/Aだった？<br>Câuはい、N/Aでした。うん、N/Aだった。<br>nghivấnいいえ、N/Aじゃなかったです。ううん、N/Aじゃなかった。<br>N/Aじゃありませんでした。","kana":"","vi":"","audio":"北海道は東京より寒いです。 NはN/Aです。N（は）N/Aだ。 CâuNはN/Aじゃないです。N（は）N/Aじゃない。 Câuはい、N/Aです。うん、N/A（だ）。 nghivấnいいえ、N/Aじゃないです。ううん、N/Aじゃない。 N/Aじゃありません。 NはN/Aでした。N（は）N/Aだった。 CâuNはN/Aじゃなかったです。N（は）N/Aじゃなかった。 phủđịnhN/Aじゃありませんでした。 NはN/Aでしたか。N（は）N/Aだった？ Câuはい、N/Aでした。うん、N/Aだった。 nghivấnいいえ、N/Aじゃなかったです。ううん、N/Aじゃなかった。 N/Aじゃありませんでした。"}]},{"id":"g4a_1","lesson":"Bài 4A","title":"N（は）từ để hỏi/ N/ A ですか / →（Nは）từ để hỏi/ N/ A ？","formula":"N（は）từ để hỏi/ N/ A ですか / →（Nは）từ để hỏi/ N/ A ？","meaning":"Câu nghi vấn của N và A được biến đổi sang thể thường như sau:","explanation":"Câu nghi vấn của N và A được biến đổi sang thể thường như sau:<br>「ですか」 được lược đi và lên giọng ở cuối câu.<br>Ngữ điệu của「うん」và「ううん」：<br>・「うん」 : âm「う」là nguyên âm mũi, có trường hợp được phát âm gần giống với<br>・ Tương tự âm「う」trong「ううん」cũng là nguyên âm mũi nên ít khi phát âm là 「ううん」mà thường sẽ được phát âm thành「んんん」","brief":"Câu nghi vấn của N và A được biến đổi sang thể thường như sau:","notes":"","examples":[{"jp":"âm「ん」trong「て『ん』いん」hay「ほ『ん』や」,...","kana":"","vi":"","audio":"âm「ん」trong「て『ん』いん」hay「ほ『ん』や」,..."},{"jp":"①これは<ruby>何<rt>なん</rt></ruby>ですか。→これ（は）<ruby>何<rt>なに</rt></ruby>？","kana":"","vi":"","audio":"これは何ですか。これ（は）何？"},{"jp":"②あの<ruby>人<rt>ひと</rt></ruby>はだれですか。→あの<ruby>人<rt>ひと</rt></ruby>（は）だれ？","kana":"","vi":"","audio":"あの人はだれですか。あの人（は）だれ？"},{"jp":"③<ruby>誕生日<rt>たんじょうび</rt></ruby>はいつですか。→<ruby>誕生日<rt>たんじょうび</rt></ruby>（は）いつ？","kana":"","vi":"","audio":"誕生日はいつですか。誕生日（は）いつ？"},{"jp":"④<ruby>日本人<rt>にほんじん</rt></ruby>ですか。→<ruby>日本人<rt>にほんじん</rt></ruby>？","kana":"","vi":"","audio":"日本人ですか。日本人？"},{"jp":"⑤<ruby>明日<rt>あ し た</rt></ruby>は<ruby>仕事<rt>しごと</rt></ruby>ですか。→<ruby>明日<rt>あ し た</rt></ruby>（は）<ruby>仕事<rt>しごと</rt></ruby>？","kana":"","vi":"","audio":"明日は仕事ですか。明日（は）仕事？"},{"jp":"⑥<ruby>明後日<rt>あさって</rt></ruby>は<ruby>暇<rt>ひま</rt></ruby>ですか。→<ruby>明後日<rt>あさって</rt></ruby>（は）<ruby>暇<rt>ひま</rt></ruby>？","kana":"","vi":"","audio":"明後日は暇ですか。明後日（は）暇？"}]},{"id":"g4a_2","lesson":"Bài 4A","title":"（Nは） N/ A です（よ/ね/よね） / → （ Nは）N/ A （だよ/だね/だよね）","formula":"（Nは） N/ A です（よ/ね/よね） / → （ Nは）N/ A （だよ/だね/だよね）","meaning":"Câu khẳng định của N và Aなđược biến đổi sang thể thường như sau:","explanation":"Câu khẳng định của N và Aなđược biến đổi sang thể thường như sau:<br>・ Thông thường「だ」: thường được lược bỏ. Tuy nhiên,「だ」sẽ được giữ nguyên trong hai trường hợp sau:<br>+ Khi sau「だ」 có các hậu tố như「よ、ね、よね」<br>+ Khi nói về những điều mình mới biết hay mới phát hiện ra","brief":"Câu khẳng định của N và Aなđược biến đổi sang thể thường như sau:","notes":"","examples":[{"jp":"・「です」→「だ」","kana":"","vi":"","audio":"・「です」「だ」"},{"jp":"①ベトナム<ruby>人<rt>じん</rt></ruby>です。→ベトナム<ruby>人<rt>じん</rt></ruby>。","kana":"","vi":"","audio":"ベトナム人です。ベトナム人。"},{"jp":"②ベトナム<ruby>人<rt>じん</rt></ruby>ですよ。→ベトナム<ruby>人<rt>じん</rt></ruby>だよ。","kana":"","vi":"","audio":"ベトナム人ですよ。ベトナム人だよ。"},{"jp":"③ベトナム<ruby>人<rt>じん</rt></ruby>ですね。→ベトナム<ruby>人<rt>じん</rt></ruby>だね。","kana":"","vi":"","audio":"ベトナム人ですね。ベトナム人だね。"},{"jp":"④ベトナム<ruby>人<rt>じん</rt></ruby>ですよね。→ベトナム<ruby>人<rt>じん</rt></ruby>だよね。","kana":"","vi":"","audio":"ベトナム人ですよね。ベトナム人だよね。"},{"jp":"⑤<ruby>田中<rt>たなか</rt></ruby>さんはとても<ruby>親切<rt>しんせつ</rt></ruby>ですよ。→<ruby>田中<rt>たなか</rt></ruby>さんはとても<ruby>親切<rt>しんせつ</rt></ruby>だよ。","kana":"","vi":"","audio":"田中さんはとても親切ですよ。田中さんはとても親切だよ。"},{"jp":"⑥あのレストランはきれいですね。→あのレストラン（は）きれいだね。","kana":"","vi":"","audio":"あのレストランはきれいですね。あのレストラン（は）きれいだね。"}]},{"id":"g4a_3","lesson":"Bài 4A","title":"（Nは） N/ A じゃないですか / → （ Nは）N/ A じゃない？","formula":"（Nは） N/ A じゃないですか / → （ Nは）N/ A じゃない？","meaning":"Chẳng phải～hay sao?","explanation":"Được dùng để xác nhận ý kiến với đối phương với ý nghĩa: “là…. nhỉ?/ Chẳng phải thế hay sao?”. Trong đó, thể thường của cấu trúc được chuyển đổi như sau:<br>Lên giọng ở cuối câu, cụ thể là trong chữ「ない」 sẽ thấp ở âm「な」 và cao ở âm「い」","brief":"Được dùng để xác nhận ý kiến với đối phương với ý nghĩa: “là…. nhỉ?/ Chẳng phải thế hay sao?”. Trong đó, thể thường của cấu trúc được chuyển đổi như s","notes":"","examples":[{"jp":"・「じゃないですか/じゃありませんか。」→「じゃない」<br>・「ではないですか/ではありませんか。」→「ではない」","kana":"","vi":"","audio":"・「じゃないですか/じゃありませんか。」「じゃない」 ・「ではないですか/ではありませんか。」「ではない」"},{"jp":"例ベトナム<ruby>料理<rt>りょうり</rt></ruby>じゃないですか？<br>→ベトナム<ruby>料理<rt>りょうり</rt></ruby>じゃない？","kana":"","vi":"","audio":"ベトナム料理じゃないですか？ ベトナム料理じゃない？"}]},{"id":"g4a_3_2","lesson":"Bài 4A","title":"（Nは） N/ A じゃないです / → （ Nは）N/ A じゃない","formula":"（Nは） N/ A じゃないです / → （ Nは）N/ A じゃない","meaning":"Câu phủ định của N và A ở thể thường được biến đổi như sau:","explanation":"Câu phủ định của N và A ở thể thường được biến đổi như sau:<br>Xuống giọng ở cuối câu, cụ thể là cao ở âm「な」và xuống thấp ở âm「い」 Bảng so sánh ngữ điệu của「じゃない」trong trường hợp phủ định và xác nhận ý kiến:<br>Nghĩa phủ định Nghĩa xác nhận","brief":"Câu phủ định của N và A ở thể thường được biến đổi như sau:","notes":"","examples":[{"jp":"・「じゃないです/じゃありません。」→「じゃない」<br>・「ではないです/ではありません。」→「ではない」","kana":"","vi":"","audio":"・「じゃないです/じゃありません。」「じゃない」 ・「ではないです/ではありません。」「ではない」"},{"jp":"①ベトナム<ruby>料理<rt>りょうり</rt></ruby>じゃないです/じゃありません。<br>→ベトナム<ruby>料理<rt>りょうり</rt></ruby>じゃない。","kana":"","vi":"","audio":"ベトナム料理じゃないです/じゃありません。 ベトナム料理じゃない。"},{"jp":"②ベトナム<ruby>料理<rt>りょうり</rt></ruby>じゃないですよ/じゃありませんよ。<br>→ベトナム<ruby>料理<rt>りょうり</rt></ruby>じゃないよ。<br><ruby>学生<rt>がくせい</rt></ruby>じゃない。<ruby>学生<rt>がくせい</rt></ruby>じゃない？<br>がくせいじゃないがくせいじゃない?<br><ruby>金曜日<rt>きんようび</rt></ruby>じゃない。<ruby>金曜日<rt>きんようび</rt></ruby>じゃない？<br>きんようびじゃないきんようびじゃない?<br>きれいじゃない。きれいじゃない？<br>きれいじゃないきれいじゃない？","kana":"","vi":"","audio":"ベトナム料理じゃないですよ/じゃありませんよ。 ベトナム料理じゃないよ。 学生じゃない。学生じゃない？ がくせいじゃないがくせいじゃない? 金曜日じゃない。金曜日じゃない？ きんようびじゃないきんようびじゃない? きれいじゃない。きれいじゃない？ きれいじゃないきれいじゃない？"}]},{"id":"g4a_4","lesson":"Bài 4A","title":"（Nは）N/A でしたか→ (Nは) N/A だった？ / （Nは）N/A でした → (Nは) N/A だった","formula":"（Nは）N/A でしたか→ (Nは) N/A だった？ / （Nは）N/A でした → (Nは) N/A だった","meaning":"(Riêng cấu trúc số 3 vì là cách nói mới nên mới có thêm phần dịch ngữ pháp)","explanation":"(Riêng cấu trúc số 3 vì là cách nói mới nên mới có thêm phần dịch ngữ pháp)<br>・ Câu nghi vấn ở quá khứ của N và A ở thể thường được biến đổi như sau:<br>「か」được lược bỏ và lên giọng ở âm cuối của「だった」(âm「だ」ở phía sau sẽ lên cao giọng hơn một chút so với âm「だ」phía trước)<br>・ Câu khẳng định ở quá khứ của N và A ở thể thường được biến đổi như sau:","brief":"(Riêng cấu trúc số 3 vì là cách nói mới nên mới có thêm phần dịch ngữ pháp)","notes":"","examples":[{"jp":"「でしたか」→「だった？」<br>「でした」→「だった」","kana":"","vi":"","audio":"「でしたか」「だった？」 「でした」「だった」"},{"jp":"①<ruby>昨日<rt>きのう</rt></ruby>は<ruby>雨<rt>あめ</rt></ruby>でした。→<ruby>昨日<rt>きのう</rt></ruby>はあめだった。","kana":"","vi":"","audio":"昨日は雨でした。昨日はあめだった。"},{"jp":"②パーティーはにぎやかでした。→パーティーはにぎやかだった。","kana":"","vi":"","audio":"パーティーはにぎやかでした。パーティーはにぎやかだった。"},{"jp":"③A：テスト、どうでしたか。→テスト、どうだった？<br>B：<ruby>簡単<rt>かんたん</rt></ruby>でした。→<ruby>簡単<rt>かんたん</rt></ruby>だった。","kana":"","vi":"","audio":"テスト、どうでしたか。テスト、どうだった？ 簡単でした。簡単だった。"}]},{"id":"g4a_5","lesson":"Bài 4A","title":"（Nは）N/A じゃなかったです / （Nは）N/A じゃなかった","formula":"（Nは）N/A じゃなかったです / （Nは）N/A じゃなかった","meaning":"Câu phủ định ở quá khứ của N và A được biến đổi về thể thường như sau:","explanation":"Câu phủ định ở quá khứ của N và A được biến đổi về thể thường như sau:<br>① (Đang kể lại câu chuyện khi nhìn thấy một người giống Mai, nhưng sau khi tới gần thì mới biết không phải là Mai) Thể lịch sự Thể thường Câu Nは A です N（は）A khẳng định Câu Phi quá Nは A くないです N（は）A くない phủ định khứ (Hiện tại, Nは A ですか N（は）A ？ tương lai) Câu nghi vấn Câu khẳng định Câu phủ định Quá khứ Câu nghi vấn","brief":"Câu phủ định ở quá khứ của N và A được biến đổi về thể thường như sau:","notes":"","examples":[{"jp":"・「じゃなかったです/じゃありませんでした」→「じゃなかった」<br>・「ではなかったです/ではありませんでした」→「ではなかった」<br>あの<ruby>人<rt>ひと</rt></ruby>、マインさんじゃなかった。","kana":"","vi":"","audio":"・「じゃなかったです/じゃありませんでした」「じゃなかった」 ・「ではなかったです/ではありませんでした」「ではなかった」 あの人、マインさんじゃなかった。"},{"jp":"②<ruby>昨日<rt>きのう</rt></ruby>、<ruby>暇<rt>ひま</rt></ruby>じゃなかった。<br>はい、Aですうん、A<br>いいえ、Aくないですううん、Aくない<br>NはAかったですN（は）Aかった<br>NはAくなかったですN（は）Aくなかった<br>NはAかったですかN（は）Aかった？<br>はい、Aかったですうん、Aかった<br>いいえ、Aくなかったですううん、Aくなかった","kana":"","vi":"","audio":"昨日、暇じゃなかった。 はい、Aですうん、A いいえ、Aくないですううん、Aくない NはAかったですN（は）Aかった NはAくなかったですN（は）Aくなかった NはAかったですかN（は）Aかった？ はい、Aかったですうん、Aかった いいえ、Aくなかったですううん、Aくなかった"}]},{"id":"g4b_6","lesson":"Bài 4B","title":"（Nは）A ですか / →（Nは）A ？","formula":"（Nは）A ですか / →（Nは）A ？","meaning":"Câu nghi vấn của A được biến đổi sang thể thường như sau:","explanation":"Câu nghi vấn của A được biến đổi sang thể thường như sau:<br>bỏ「ですか」ở cuối câu.<br>・ Lên giọng ở cuối câu, trọng âm của tính từ trong câu nghi vấn của A ở thể thường không thay đổi.<br>・ Bảng so sánh ngữ điệu (trang sau) Bảng so sánh ngữ điệu:<br>１． ２． ３． ４． ５． ６． ７．","brief":"Câu nghi vấn của A được biến đổi sang thể thường như sau:","notes":"","examples":[{"jp":"い","kana":"","vi":"","audio":"い"},{"jp":"①これはおいしいですか。<br>→これ、おいしい？","kana":"","vi":"","audio":"これはおいしいですか。 これ、おいしい？"},{"jp":"②<ruby>仕事<rt>しごと</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しいですか。<br>→<ruby>仕事<rt>しごと</rt></ruby>は<ruby>忙<rt>いそが</rt></ruby>しい？<br>たかいたかい?<br>おいしいおいしい?<br>おいしいおいしい?<br>たのしいたのしい?<br>どう？<br>たのしかったたのしかった?<br>たかかったたかかった?","kana":"","vi":"","audio":"仕事は忙しいですか。 仕事は忙しい？ たかいたかい? おいしいおいしい? おいしいおいしい? たのしいたのしい? どう？ たのしかったたのしかった? たかかったたかかった?"}]},{"id":"g4b_7","lesson":"Bài 4B","title":"（Nは）A です →（Nは）A","formula":"（Nは）A です →（Nは）A","meaning":"Câu khẳng định của A được biến đổi sang thể thường như sau:","explanation":"Câu khẳng định của A được biến đổi sang thể thường như sau:<br>bỏ「です」ở cuối câu.","brief":"Câu khẳng định của A được biến đổi sang thể thường như sau:","notes":"","examples":[{"jp":"①ベトナム<ruby>料理<rt>りょうり</rt></ruby>はおいしいです。<br>→ベトナム<ruby>料理<rt>りょうり</rt></ruby>はおいしい。","kana":"","vi":"","audio":"ベトナム料理はおいしいです。 ベトナム料理はおいしい。"},{"jp":"②この<ruby>本<rt>ほん</rt></ruby>は<ruby>面白<rt>おもしろ</rt></ruby>いです。<br>→この<ruby>本<rt>ほん</rt></ruby>は<ruby>面白<rt>おもしろ</rt></ruby>い。","kana":"","vi":"","audio":"この本は面白いです。 この本は面白い。"},{"jp":"③A：<ruby>東京<rt>とうきょう</rt></ruby>は<ruby>今日<rt>きょう</rt></ruby>、<ruby>暑<rt>あつ</rt></ruby>い？<br><ruby>今日<rt>きょう</rt></ruby><br>B：うん、<ruby>暑<rt>あつ</rt></ruby>いよ。","kana":"","vi":"","audio":"東京は今日、暑い？ 今日 うん、暑いよ。"}]},{"id":"g4b_8","lesson":"Bài 4B","title":"Nは）～が、～ → （Nは）～けど～","formula":"Nは）～が、～ → （Nは）～けど～","meaning":"「けど」là thể thường của「が」 Các loại từ đứng trước「けど」cũng sẽ được đưa về thể thường.","explanation":"「けど」là thể thường của「が」 Các loại từ đứng trước「けど」cũng sẽ được đưa về thể thường.<br>・A /N → A /N だけど","brief":"「けど」là thể thường của「が」 Các loại từ đứng trước「けど」cũng sẽ được đưa về thể thường.","notes":"","examples":[{"jp":"・A→Aけど","kana":"","vi":"","audio":"・AAけど"},{"jp":"①この<ruby>店<rt>みせ</rt></ruby>はおいしいですが、<ruby>高<rt>たか</rt></ruby>いですね。<br>→この<ruby>店<rt>みせ</rt></ruby>、おいしいけど、<ruby>高<rt>たか</rt></ruby>いね。","kana":"","vi":"","audio":"この店はおいしいですが、高いですね。 この店、おいしいけど、高いね。"},{"jp":"②この<ruby>町<rt>まち</rt></ruby>は<ruby>便利<rt>べんり</rt></ruby>ですが、きれいじゃないですね。<br>→この<ruby>町<rt>まち</rt></ruby>は<ruby>便利<rt>べんり</rt></ruby>だけど、きれいじゃないね。","kana":"","vi":"","audio":"この町は便利ですが、きれいじゃないですね。 この町は便利だけど、きれいじゃないね。"},{"jp":"③この<ruby>店<rt>みせ</rt></ruby>の<ruby>料理<rt>りょうり</rt></ruby>（おいしい・<ruby>高<rt>たか</rt></ruby>い）<br>A：この<ruby>店<rt>みせ</rt></ruby>の<ruby>料理<rt>りょうり</rt></ruby>はどう？<br>B：おいしいけど、<ruby>高<rt>たか</rt></ruby>いよ。","kana":"","vi":"","audio":"この店の料理（おいしい・高い） この店の料理はどう？ おいしいけど、高いよ。"}]},{"id":"g4b_9","lesson":"Bài 4B","title":"（Nは）A かったです / （Nは）A かった","formula":"（Nは）A かったです / （Nは）A かった","meaning":"Câu khẳng định ở quá khứ của A được biến đổi về thể thường như sau:","explanation":"Câu khẳng định ở quá khứ của A được biến đổi về thể thường như sau:<br>bỏ「です」ở cuối câu.","brief":"Câu khẳng định ở quá khứ của A được biến đổi về thể thường như sau:","notes":"","examples":[{"jp":"い","kana":"","vi":"","audio":"い"},{"jp":"①<ruby>高<rt>たか</rt></ruby>かったです。→<ruby>高<rt>たか</rt></ruby>かった。","kana":"","vi":"","audio":"高かったです。高かった。"},{"jp":"②<ruby>高<rt>たか</rt></ruby>かったですよ。→<ruby>高<rt>たか</rt></ruby>かったよ。","kana":"","vi":"","audio":"高かったですよ。高かったよ。"}]},{"id":"g4b_10","lesson":"Bài 4B","title":"Nは）A くないです。 →（ Nは）A くない / Nは）A くなかったです。 →（ Nは） A くなかった","formula":"Nは）A くないです。 →（ Nは）A くない / Nは）A くなかったです。 →（ Nは） A くなかった","meaning":"Câu phủ định ở phi quá khứ (hiện tại, tương lai) và quá khứ của A được biến đổi sang thể thường như sau:","explanation":"Câu phủ định ở phi quá khứ (hiện tại, tương lai) và quá khứ của A được biến đổi sang thể thường như sau:<br>・ Bỏ「です」ở cuối câu.<br>・ Khác với thể thường của Danh từ hay Tính từ đuô「i な」, thể thường của tính từ đuôi「い」 ở dạng khẳng định, phủ định, quá khứ, hiện tại, sẽ kết hợp trực tiếp với những vĩ tố như「よ」「ね」...","brief":"Câu phủ định ở phi quá khứ (hiện tại, tương lai) và quá khứ của A được biến đổi sang thể thường như sau:","notes":"","examples":[{"jp":"いい<br>×おいしいだね→〇おいしいね<br>×おいしいだよ→〇おいしいよ<br>×おいしくないだね→〇おいしくないね<br>×おいしくなかっただね→〇おいしくなかったね","kana":"","vi":"","audio":"いい ×おいしいだね〇おいしいね ×おいしいだよ〇おいしいよ ×おいしくないだね〇おいしくないね ×おいしくなかっただね〇おいしくなかったね"},{"jp":"①<ruby>日本語<rt>にほんご</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しくないですね。<br>→<ruby>日本語<rt>にほんご</rt></ruby>は<ruby>難<rt>むずか</rt></ruby>しくないね。","kana":"","vi":"","audio":"日本語は難しくないですね。 日本語は難しくないね。"},{"jp":"②あのレストランはおいしくなかったですね。<br>→あのレストラン、おいしくなかったね。","kana":"","vi":"","audio":"あのレストランはおいしくなかったですね。 あのレストラン、おいしくなかったね。"}]},{"id":"g5a_1","lesson":"Bài 5A","title":"N (は) ありますか / はい、あります / いいえ、ないです/ありません","formula":"N (は) ありますか / はい、あります / いいえ、ないです/ありません","meaning":"Có N không? Vâng, có ạ.","explanation":"(đồ vật) Mẫu câu dùng để hỏi khi tìm kiếm một đồ vật hay muốn hỏi ở cửa hàng có bán sản phẩm nào đó hay không.<br>★ Phân tích thành phần câu:<br>・ 「あります」thể hiện sự tồn tại của đồ vật.<br>・ Phủ định của「あります」có 2 dạng là「ありません」và「ないです」. Trong giao tiếp có thể dùng cả hai cách nói, tuy nhiên trong ngữ cảnh lịch sự, trang trọng thì nên sử dụng「ありません」.<br>・ Trợ từ 「は」 thể hiện chủ đề của câu có thể được lược đi.<br>Để câu nói được mềm mại hoặc khi bày tỏ cảm xúc đáng tiếc, áy náy, hậu tố 「ね」thường được thêm vào cuối câu.<br>* Khi chỉ trả lời là「いいえ」、「ないです」thì câu nói nghe có vẻ trống không, cụt ngủn nên người Nhật thường nói đầy đủ cả「こちらの 本は」như phía trên, và thêm hậu tố「ね」 vào phía cuối câu để câu nói trở nên mềm mỏng, nhẹ nhàng hơn.","brief":"(đồ vật) Mẫu câu dùng để hỏi khi tìm kiếm một đồ vật hay muốn hỏi ở cửa hàng có bán sản phẩm nào đó hay không.","notes":"","examples":[{"jp":"①A：あのー、MoriPhoneのスマホケース、ありますか。<br>B：はい、あります。こちらです*。","kana":"","vi":"","audio":"あのー、MoriPhoneのスマホケース、ありますか。 はい、あります。こちらです*。"},{"jp":"②A：あのー、この<ruby>本<rt>ほん</rt></ruby>はありますか。<br>B：すみません、こちらの<ruby>本<rt>ほん</rt></ruby>はありません（ね）/ないです（ね）…。","kana":"","vi":"","audio":"あのー、この本はありますか。 すみません、こちらの本はありません（ね）/ないです（ね）…。"},{"jp":"③A：あのー、はさみ（は）ありますか。<br>B：はい、あります。こちらです。","kana":"","vi":"","audio":"あのー、はさみ（は）ありますか。 はい、あります。こちらです。"}]},{"id":"g5a_2","lesson":"Bài 5A","title":"Nは N です / Nは N に あります","formula":"Nは N です / Nは N に あります","meaning":"N có ở N","explanation":"★ Phân tích thành phần câu:<br>・ 「に」đứng sau danh từ chỉ vị trí, địa điểm.<br>・ Khi hỏi về vị trí, địa điểm của đồ vật N, ta có 2 cách hỏi như sau:<br>Khi lấy một đồ vật, địa điểm nào đó làm mốc, làm dấu để nói rõ hơn về vị trí tồn tại của một đồ vật khác, chúng ta có thể sử dụng cách kết hợp sau:<br>【Địa điểm/ vật làm mốc】 の 【Từ chỉ mối quan hệ về vị trí】 ↓ ↓ ↓ ↓ Khi muốn nói đến vị trí ở giữa, ta có cách nói: A と B の 間<br>例 銀行と 学校の 間 (Giữa ngân hàng và trường học) ① (Tại 1 hiệu sách) ② (Trong nhà vệ sinh của gia đình mà A đến thăm)","brief":"★ Phân tích thành phần câu:","notes":"","examples":[{"jp":"❶Nはどこですか。<br>❷Nはどこにありますか。<br>となり、<ruby>横<rt>よこ</rt></ruby>、<ruby>上<rt>うえ</rt></ruby>、<ruby>下<rt>した</rt></ruby>、<ruby>中<rt>なか</rt></ruby>、<ruby>近<rt>ちか</rt></ruby>く","kana":"","vi":"","audio":"❶Nはどこですか。 ❷Nはどこにありますか。 となり、横、上、下、中、近く"},{"jp":"例1．<ruby>公園<rt>こうえん</rt></ruby>は<ruby>銀行<rt>ぎんこう</rt></ruby>の<ruby>隣<rt>となり</rt></ruby>です。<br>2.ノートは<ruby>机<rt>つくえ</rt></ruby>の<ruby>上<rt>うえ</rt></ruby>にあります。<br>3．スマホはかばんの<ruby>中<rt>なか</rt></ruby>にあります。<br>A：オートバイの<ruby>雑誌<rt>ざっし</rt></ruby>（は）、ありますか。<br>B：はい。<ruby>雑誌<rt>ざっし</rt></ruby>は2<ruby>階<rt>かい</rt></ruby>にあります。<br>A：すみません、タオルはどこですか。<br>B：あ、タオルはごみ<ruby>箱<rt>ばこ</rt></ruby>の<ruby>横<rt>よこ</rt></ruby>にあります。","kana":"","vi":"","audio":"1．公園は銀行の隣です。 2.ノートは机の上にあります。 3．スマホはかばんの中にあります。 オートバイの雑誌（は）、ありますか。 はい。雑誌は2階にあります。 すみません、タオルはどこですか。 あ、タオルはごみ箱の横にあります。"},{"jp":"③<ruby>電子辞書<rt>でんしじしょ</rt></ruby><br>A：<ruby>電子辞書<rt>でんしじしょ</rt></ruby>はどこですか。<br>B：<ruby>机<rt>つくえ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>です。","kana":"","vi":"","audio":"電子辞書 電子辞書はどこですか。 机の中です。"}]},{"id":"g5a_3","lesson":"Bài 5A","title":"N に N が あります","formula":"N に N が あります","meaning":"Ở N có N/ Có N (nằm) ở N","explanation":"Mẫu câu diễn tả vị trí tồn tại của đồ vật, tòa nhà, cây cối…<br>★ Phân tích thành phần câu:<br>・ 「に」là trợ từ đứng sau danh từ chỉ vị trí, địa điểm.<br>・ 「が」là trợ từ đứng sau danh từ chỉ chủ thể.","brief":"Mẫu câu diễn tả vị trí tồn tại của đồ vật, tòa nhà, cây cối…","notes":"","examples":[{"jp":"①<ruby>庭<rt>にわ</rt></ruby>にオートバイがあります。","kana":"","vi":"","audio":"庭にオートバイがあります。"},{"jp":"②ベッドの<ruby>上<rt>うえ</rt></ruby>にかばんがあります。","kana":"","vi":"","audio":"ベッドの上にかばんがあります。"},{"jp":"③ここに<ruby>辞書<rt>じしょ</rt></ruby>があります。","kana":"","vi":"","audio":"ここに辞書があります。"},{"jp":"④<ruby>庭<rt>にわ</rt></ruby>・<ruby>車<rt>くるま</rt></ruby>→<ruby>庭<rt>にわ</rt></ruby>に<ruby>車<rt>くるま</rt></ruby>があります。","kana":"","vi":"","audio":"庭・車庭に車があります。"}]},{"id":"g5b_4","lesson":"Bài 5B","title":"N (は) いますか / はい、います / いいえ、いないです/いません","formula":"N (は) いますか / はい、います / いいえ、いないです/いません","meaning":"Có N không? Vâng, có ạ.","explanation":"(người, động vật) Mẫu câu hỏi về sự tồn tại của người và động vật.<br>★ Phân tích thành phần câu:<br>・ 「います」thể hiện sự tồn tại của người và động vật.<br>・ Phủ định của「います」có 2 dạng là「いません」và「いないです」. Trong giao tiếp có thể dùng cả hai cách nói, tuy nhiên trong ngữ cảnh lịch sự, trang trọng thì nên sử dụng「いません」.","brief":"(người, động vật) Mẫu câu hỏi về sự tồn tại của người và động vật.","notes":"","examples":[{"jp":"①A：すみません、<ruby>山田<rt>やまだ</rt></ruby>さん（は）いますか。<br>B：はい、いますよ。<ruby>山田<rt>やまだ</rt></ruby>さん！<br><ruby>山田<rt>やまだ</rt></ruby>：はーい。","kana":"","vi":"","audio":"すみません、山田さん（は）いますか。 はい、いますよ。山田さん！ 山田：はーい。"},{"jp":"②A：あのー、<ruby>田中<rt>たなか</rt></ruby>さん（は）、いますか。<br>B：あー、<ruby>田中<rt>たなか</rt></ruby>さんは、<ruby>今<rt>いま</rt></ruby>いないですよ。<br>A：そうですか。","kana":"","vi":"","audio":"あのー、田中さん（は）、いますか。 あー、田中さんは、今いないですよ。 そうですか。"},{"jp":"③ナムさん・〇<br>A：ナムさんはいますか。<br>B：はい、います。","kana":"","vi":"","audio":"ナムさん・〇 ナムさんはいますか。 はい、います。"}]},{"id":"g5b_5","lesson":"Bài 5B","title":"N はN です / N はN に います","formula":"N はN です / N はN に います","meaning":"N có ở N","explanation":"1(người, động vật) 2 Có 2 cách khi hỏi về vị trí, địa điểm của người/ động vật:<br>Khi nói về sự tồn tại của người bề trên (khách hàng, cấp trên…) người Nhật thường sử dụng「いらっしゃいます」thay cho「います」 .","brief":"1(người, động vật) 2 Có 2 cách khi hỏi về vị trí, địa điểm của người/ động vật:","notes":"","examples":[{"jp":"❶Nはどこですか。<br>❷Nはどこにいますか。","kana":"","vi":"","audio":"❶Nはどこですか。 ❷Nはどこにいますか。"},{"jp":"例ナム<ruby>社長<rt>しゃちょう</rt></ruby>は<ruby>今<rt>いま</rt></ruby>、<ruby>事務所<rt>じむしょ</rt></ruby>にいらっしゃいます。","kana":"","vi":"","audio":"ナム社長は今、事務所にいらっしゃいます。"},{"jp":"①<ruby>鈴木<rt>すずき</rt></ruby>さんは<ruby>部屋<rt>へや</rt></ruby>にいます。","kana":"","vi":"","audio":"鈴木さんは部屋にいます。"},{"jp":"②ミンさんは<ruby>教室<rt>きょうしつ</rt></ruby>にいます。","kana":"","vi":"","audio":"ミンさんは教室にいます。"},{"jp":"③ミンさん・<ruby>病院<rt>びょういん</rt></ruby><br>→A：ミンさんはどこですか。<br>B：ミンさんは<ruby>病院<rt>びょういん</rt></ruby>にいます。","kana":"","vi":"","audio":"ミンさん・病院 ミンさんはどこですか。 ミンさんは病院にいます。"}]},{"id":"g5b_6","lesson":"Bài 5B","title":"N に N が います","formula":"N に N が います","meaning":"Ở N có N","explanation":"1 (địa điểm) 2 (người, động vật) Mẫu câu diễn tả sự tồn tại của người, động vật tại một địa điểm cụ thể.<br>★ Phân tích thành phần câu:<br>・ Khi hỏi về sự tồn tại của ai đó, ta dùng nghi vấn từ: 誰<br>・ Khi hỏi về sự tồn tại của động vật, ta dùng nghi vấn từ: 何","brief":"1 (địa điểm) 2 (người, động vật) Mẫu câu diễn tả sự tồn tại của người, động vật tại một địa điểm cụ thể.","notes":"","examples":[{"jp":"①<ruby>窓<rt>まど</rt></ruby>の<ruby>外<rt>そと</rt></ruby>に<ruby>何<rt>なに</rt></ruby>がありますか。<br><ruby>窓<rt>まど</rt></ruby>の<ruby>外<rt>そと</rt></ruby>に<ruby>何<rt>なに</rt></ruby>がいますか。<br><ruby>窓<rt>まど</rt></ruby>の<ruby>外<rt>そと</rt></ruby>に<ruby>誰<rt>だれ</rt></ruby>がいますか。","kana":"","vi":"","audio":"窓の外に何がありますか。 窓の外に何がいますか。 窓の外に誰がいますか。"},{"jp":"②<ruby>会社<rt>かいしゃ</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に<ruby>誰<rt>だれ</rt></ruby>かがいます。","kana":"","vi":"","audio":"会社の前に誰かがいます。"},{"jp":"③<ruby>公園<rt>こうえん</rt></ruby>に<ruby>犬<rt>いぬ</rt></ruby>がいます。","kana":"","vi":"","audio":"公園に犬がいます。"},{"jp":"④A：<ruby>誰<rt>だれ</rt></ruby>がいますか。<br>B：<ruby>田中<rt>たなか</rt></ruby>さんがいます。<br><ruby>田中<rt>たなか</rt></ruby>さん","kana":"","vi":"","audio":"誰がいますか。 田中さんがいます。 田中さん"}]},{"id":"g5c_7","lesson":"Bài 5C","title":"Nには/にも～","formula":"Nには/にも～","meaning":"Ở N có/ cũng có ～","explanation":"★ Phân tích thành phần câu:<br>・「に」： Trợ từ biểu thị địa điểm tồn tại.<br>・「は」： Đứng sau trợ từ「に」, nhấn mạnh chủ đề của câu.<br>・「も」：Đứng sau trợ từ「に」để thể hiện một chủ thể có ở địa điểm A và cũng có ở địa điểm B.<br>Cấu trúc tương tự cấu trúc「N も N です」 (Bài 1).","brief":"★ Phân tích thành phần câu:","notes":"","examples":[{"jp":"①<ruby>会社<rt>かいしゃ</rt></ruby>には<ruby>食堂<rt>しょくどう</rt></ruby>があります。<ruby>学校<rt>がっこう</rt></ruby>にも<ruby>食堂<rt>しょくどう</rt></ruby>がありますか。","kana":"","vi":"","audio":"会社には食堂があります。学校にも食堂がありますか。"},{"jp":"②<ruby>日本<rt>にほん</rt></ruby>にはラーメンの<ruby>店<rt>みせ</rt></ruby>がたくさんあります。ベトナムにもあります。","kana":"","vi":"","audio":"日本にはラーメンの店がたくさんあります。ベトナムにもあります。"},{"jp":"③ミンさんのうちには<ruby>猫<rt>ねこ</rt></ruby>がいます。<br>ゆいさんのうちにも<ruby>猫<rt>ねこ</rt></ruby>がいますか。","kana":"","vi":"","audio":"ミンさんのうちには猫がいます。 ゆいさんのうちにも猫がいますか。"},{"jp":"④<ruby>日本<rt>にほん</rt></ruby>・<ruby>地下鉄<rt>ちかてつ</rt></ruby>/ベトナム？（×）<br>→A：<ruby>日本<rt>にほん</rt></ruby>には<ruby>地下鉄<rt>ちかてつ</rt></ruby>がありますが、ベトナムにもありますか。<br>B：いいえ、ベトナムにはありません。","kana":"","vi":"","audio":"日本・地下鉄/ベトナム？（×） 日本には地下鉄がありますが、ベトナムにもありますか。 いいえ、ベトナムにはありません。"}]},{"id":"g5c_8","lesson":"Bài 5C","title":"Nと N","formula":"Nと N","meaning":"N và N","explanation":"★ Phân tích thành phần câu:<br>・「と」：là trợ từ nối giữa hai danh từ có cùng chủng loại .<br>Không dùng trợ từ「と」trong 2 trường hợp sau:<br>❶ Khi nói về một người hay một vật nào đó đồng thời giữ vai trò vừa là N và là N.<br>❷ Khi nối những từ loại không phải Danh từ.<br>Cách đếm số lượng người Cách đếm số lượng động vật nhỏ Cách đếm đồ vật chung 1 người 1 con 1 cái 2 người 2 con 2 cái 3 người 3 con 3 cái 4 người 4 con 4 cái 5 người 5 con 5 cái 6 người 6 con 6 cái （ななにん・ 7 người 7 con 7 cái 8 người 8 con 8 cái （きゅうにん・ 9 người 9 con 9 cái 10 người 10 con 10 cái 11 người 11 con 11 cái mấy người? mấy con? （？）いくつ mấy cái?","brief":"★ Phân tích thành phần câu:","notes":"","examples":[{"jp":"①×<ruby>田中<rt>たなか</rt></ruby>さんはABCカンパニーの<ruby>社員<rt>しゃいん</rt></ruby>とエンジニアです。<br>→〇ABCカンパニーの<ruby>社員<rt>しゃいん</rt></ruby>でエンジニアです。","kana":"","vi":"","audio":"×田中さんはABCカンパニーの社員とエンジニアです。 〇ABCカンパニーの社員でエンジニアです。"},{"jp":"②×この<ruby>店<rt>みせ</rt></ruby>の<ruby>料理<rt>りょうり</rt></ruby>はおいしいと<ruby>安<rt>やす</rt></ruby>いです。<br>→〇この<ruby>店<rt>みせ</rt></ruby>の<ruby>料理<rt>りょうり</rt></ruby>はおいしくて<ruby>安<rt>やす</rt></ruby>いです。","kana":"","vi":"","audio":"×この店の料理はおいしいと安いです。 〇この店の料理はおいしくて安いです。"},{"jp":"③×この<ruby>町<rt>まち</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かときれいです。<br>→〇この<ruby>町<rt>まち</rt></ruby>は<ruby>静<rt>しず</rt></ruby>かできれいです。","kana":"","vi":"","audio":"×この町は静かときれいです。 〇この町は静かできれいです。"},{"jp":"④<ruby>部屋<rt>へや</rt></ruby>に<ruby>田中<rt>たなか</rt></ruby>さんとナムさんがいます。","kana":"","vi":"","audio":"部屋に田中さんとナムさんがいます。"},{"jp":"⑤<ruby>休<rt>やす</rt></ruby>みは<ruby>土曜日<rt>どようび</rt></ruby>と<ruby>日曜日<rt>にちようび</rt></ruby>です。<br>1人1匹1つ<br>（ひとり）（いっぴき）（ひとつ）<br>2人2匹2つ<br>（ふたり）（にひき）（ふたつ）<br>３人3匹３つ<br>（さんにん）（さんびき）（みっつ）<br>４人4匹４つ<br>（よにん）（よんひき）（よっつ）<br>５人5匹５つ<br>（ごにん）（ごひき）（いつつ）<br>６人6匹６つ<br>（ろくにん）（ろっぴき）（むっつ）<br>7人<br>7匹7つ<br>（ななひき）（ななつ）<br>しちにん）<br>８人8匹８つ<br>（はちにん）（はっぴき）（やっつ）<br>9人<br>9匹9つ<br>（きゅうひき）（ここのつ）<br>くにん）<br>10人10匹10<br>（じゅうにん）（じゅっぴき）（とお）<br>11人11匹11<br>（じゅういちにん）（じゅういっぴき）（じゅういち）<br>（？）何人（？）何匹<br>（なんにん）（なんびき）","kana":"","vi":"","audio":"休みは土曜日と日曜日です。 1人1匹1つ （ひとり）（いっぴき）（ひとつ） 2人2匹2つ （ふたり）（にひき）（ふたつ） ３人3匹３つ （さんにん）（さんびき）（みっつ） ４人4匹４つ （よにん）（よんひき）（よっつ） ５人5匹５つ （ごにん）（ごひき）（いつつ） ６人6匹６つ （ろくにん）（ろっぴき）（むっつ） 7人 7匹7つ （ななひき）（ななつ） しちにん） ８人8匹８つ （はちにん）（はっぴき）（やっつ） 9人 9匹9つ （きゅうひき）（ここのつ） くにん） 10人10匹10 （じゅうにん）（じゅっぴき）（とお） 11人11匹11 （じゅういちにん）（じゅういっぴき）（じゅういち） （？）何人（？）何匹 （なんにん）（なんびき）"}]},{"id":"g5c_9","lesson":"Bài 5C","title":"Số lượng từ ＋います/あります","formula":"Số lượng từ ＋います/あります","meaning":"Có người/ động vật/ đồ vật","explanation":"(số lượng)<br>・ Khi muốn nói cụ thể số lượng của người hay vật (có bao nhiêu cái, bao nhiêu người hay bao nhiêu con vật,..) thì chúng ta thêm lượng từ vào trước「います/<br>・ Trong cấu trúc này, lượng từ không phải là danh từ, mà đóng vai trò làm phó từ.<br>Vì vậy sẽ không thêm「が」sau số lượng từ. Vì「が」、「は」chỉ đứng sau danh từ.<br>・ Trong tiếng Nhật,「います」 và「あります」ngoài thể hiện sự tồn tại của con người, động vật, đồ vật thì còn được dùng để diễn tả sự sở hữu. Khi đó chủ sở hữu sẽ được biểu thị bở「i （に）は」.<br>Trợ từ「に」trong「～には」 hay「～にも」 có thể được lược bỏ.","brief":"(số lượng)","notes":"","examples":[{"jp":"あります」.","kana":"","vi":"","audio":"あります」."},{"jp":"①<ruby>田中<rt>たなか</rt></ruby>さんには<ruby>車<rt>くるま</rt></ruby>がありません。","kana":"","vi":"","audio":"田中さんには車がありません。"},{"jp":"②<ruby>私<rt>わたし</rt></ruby>には<ruby>子供<rt>こども</rt></ruby>が2<ruby>人<rt>たり</rt></ruby>います。","kana":"","vi":"","audio":"私には子供が2人います。"},{"jp":"③<ruby>私<rt>わたし</rt></ruby>の<ruby>学校<rt>がっこう</rt></ruby>に<ruby>中国人<rt>ちゅうごくじん</rt></ruby>が6<ruby>人<rt>にん</rt></ruby>います。","kana":"","vi":"","audio":"私の学校に中国人が6人います。"},{"jp":"④テーブルの<ruby>上<rt>うえ</rt></ruby>にコップが2つあります。","kana":"","vi":"","audio":"テーブルの上にコップが2つあります。"},{"jp":"⑤<ruby>公園<rt>こうえん</rt></ruby>・<ruby>犬<rt>いぬ</rt></ruby><br>→<ruby>公園<rt>こうえん</rt></ruby>に<ruby>犬<rt>いぬ</rt></ruby>が3<ruby>匹<rt>びき</rt></ruby>います。","kana":"","vi":"","audio":"公園・犬 公園に犬が3匹います。"}]},{"id":"g6a_1","lesson":"Bài 6A","title":"Vます Vました","formula":"Vます Vました","meaning":"Thì hiện tại và tương lai, Thì quá khứ, của động từ:","explanation":"Thì hiện tại và tương lai, Thì quá khứ, của động từ:<br>・「Vます」： dùng để nói về một thói quen, hành động, động tác diễn ra ở hiện tại hoặc tương lai.<br>・「Vました」： dùng để nói về hành động, động tác diễn ra trong quá khứ.<br>(Hiện tại và tương lai) (Quá khứ)","brief":"Thì hiện tại và tương lai, Thì quá khứ, của động từ:","notes":"","examples":[{"jp":"VますVました","kana":"","vi":"","audio":"VますVました"},{"jp":"例<ruby>寝<rt>ね</rt></ruby>ます<ruby>寝<rt>ね</rt></ruby>ました<br><ruby>起<rt>お</rt></ruby>きます<ruby>起<rt>お</rt></ruby>きました<br><ruby>働<rt>はたら</rt></ruby>きます<ruby>働<rt>はたら</rt></ruby>きました","kana":"","vi":"","audio":"寝ます寝ました 起きます起きました 働きます働きました"}]},{"id":"g6a_2","lesson":"Bài 6A","title":"～時に ＋ V / ?)何時に ＋ Vか","formula":"～時に ＋ V / ?)何時に ＋ Vか","meaning":"V vào lúc ～ giờ","explanation":"・ Mẫu câu được dùng để diễn tả thời điểm xảy ra hành động.<br>・「に」：trợ từ đứng sau thời điểm xảy ra hành động.<br>・ Khi hỏi về thời điểm diễn ra hành động nào đó, chúng ta dùng:「何時にVか?」 hoặc「いつVか？」.<br>❖Không dùng「に」với các trạng từ chỉ thời gian chung chung (không phải thời điểm cụ thể) như:","brief":"・ Mẫu câu được dùng để diễn tả thời điểm xảy ra hành động.","notes":"","examples":[{"jp":"<ruby>昨日<rt>きのう</rt></ruby>、<ruby>今日<rt>きょう</rt></ruby>、<ruby>明日<rt>あした</rt></ruby>、<ruby>先週<rt>せんしゅう</rt></ruby>、<ruby>今週<rt>こんしゅう</rt></ruby>、<ruby>来週<rt>らいしゅう</rt></ruby>、<ruby>今月<rt>こんげつ</rt></ruby>、<ruby>先月<rt>せんげつ</rt></ruby>、<ruby>来月<rt>らいげつ</rt></ruby>、<ruby>去年<rt>きょねん</rt></ruby>、<ruby>今年<rt>ことし</rt></ruby>、<ruby>来年<rt>らいねん</rt></ruby>...","kana":"","vi":"","audio":"昨日、今日、明日、先週、今週、来週、今月、先月、来月、去年、今年、来年..."},{"jp":"①<ruby>今朝<rt>けさ</rt></ruby>11<ruby>時<rt>じ</rt></ruby>に<ruby>出<rt>で</rt></ruby>かけました。","kana":"","vi":"","audio":"今朝11時に出かけました。"},{"jp":"②<ruby>昨日<rt>きのう</rt></ruby>の<ruby>夜<rt>よる</rt></ruby>、<ruby>何時<rt>なんじ</rt></ruby>に<ruby>寝<rt>ね</rt></ruby>ましたか。","kana":"","vi":"","audio":"昨日の夜、何時に寝ましたか。"},{"jp":"③A：<ruby>毎朝<rt>まいあさ</rt></ruby>、<ruby>何時<rt>なんじ</rt></ruby>に<ruby>起<rt>お</rt></ruby>きますか。<br>B：5<ruby>時<rt>じ</rt></ruby>50<ruby>分<rt>ぷん</rt></ruby>に<ruby>起<rt>お</rt></ruby>きます。","kana":"","vi":"","audio":"毎朝、何時に起きますか。 5時50分に起きます。"},{"jp":"④A：<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>何時<rt>なんじ</rt></ruby>に<ruby>休<rt>やす</rt></ruby>みますか。<br>B：12<ruby>時<rt>じ</rt></ruby>に<ruby>休<rt>やす</rt></ruby>みます。","kana":"","vi":"","audio":"毎日、何時に休みますか。 12時に休みます。"}]},{"id":"g6a_3","lesson":"Bài 6A","title":"～時間/分 ＋V / (?)何時間/何分 ＋Vか","formula":"～時間/分 ＋V / (?)何時間/何分 ＋Vか","meaning":"V (trong) ～ tiếng/ ～ phút","explanation":"・ Mẫu câu diễn tả hành động được thực hiện trong bao nhiêu tiếng/ bao nhiêu phút.<br>❖Không thêm trợ từ vào sau lượng từ chỉ thời gian xảy ra hành động.","brief":"・ Mẫu câu diễn tả hành động được thực hiện trong bao nhiêu tiếng/ bao nhiêu phút.","notes":"","examples":[{"jp":"例X<ruby>私<rt>わたし</rt></ruby>は<ruby>毎日<rt>まいにち</rt></ruby>８<ruby>時間<rt>じかん</rt></ruby>に<ruby>寝<rt>ね</rt></ruby>ます。<br>O<ruby>私<rt>わたし</rt></ruby>は<ruby>毎日<rt>まいにち</rt></ruby>８<ruby>時間<rt>じかん</rt></ruby><ruby>寝<rt>ね</rt></ruby>ます。","kana":"","vi":"","audio":"X私は毎日８時間に寝ます。 O私は毎日８時間寝ます。"},{"jp":"①<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>今朝<rt>けさ</rt></ruby>30<ruby>分<rt>ぷん</rt></ruby><ruby>歩<rt>ある</rt></ruby>きました。","kana":"","vi":"","audio":"田中さんは今朝30分歩きました。"},{"jp":"②<ruby>私<rt>わたし</rt></ruby>は<ruby>昨日<rt>きのう</rt></ruby>4<ruby>時間<rt>じかん</rt></ruby>くらい<ruby>勉強<rt>べんきょう</rt></ruby>しました。","kana":"","vi":"","audio":"私は昨日4時間くらい勉強しました。"},{"jp":"③マイさんは<ruby>毎日<rt>まいにち</rt></ruby>8<ruby>時間<rt>じかん</rt></ruby><ruby>働<rt>はたら</rt></ruby>きます。","kana":"","vi":"","audio":"マイさんは毎日8時間働きます。"}]},{"id":"g6a_4","lesson":"Bài 6A","title":"～から ～ まで ＋V / (?)～から～ まで ＋ Vか","formula":"～から ～ まで ＋V / (?)～から～ まで ＋ Vか","meaning":"V từ ～ giờ đến ～ giờ.","explanation":"Mẫu câu dùng để diễn tả thời điểm bắt đầu và kết thúc của
