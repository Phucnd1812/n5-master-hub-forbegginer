 hành động, sự việc<br>・「から」： biểu thị thời điểm bắt đầu<br>・「まで」： biểu thị thời điểm kết thúc<br>❖Có thể sử dụng độc lập「から」hoặc「まで」","brief":"Mẫu câu dùng để diễn tả thời điểm bắt đầu và kết thúc của hành động, sự việc","notes":"","examples":[{"jp":"①<ruby>月曜日<rt>げつようび</rt></ruby>から、<ruby>金曜日<rt>きんようび</rt></ruby>まで<ruby>働<rt>はたら</rt></ruby>きます。","kana":"","vi":"","audio":"月曜日から、金曜日まで働きます。"},{"jp":"②<ruby>私<rt>わたし</rt></ruby>は<ruby>一昨日<rt>おととい</rt></ruby>、10<ruby>時<rt>じ</rt></ruby>まで<ruby>遊<rt>あそ</rt></ruby>びました。","kana":"","vi":"","audio":"私は一昨日、10時まで遊びました。"},{"jp":"③<ruby>私<rt>わたし</rt></ruby>は<ruby>毎日<rt>まいにち</rt></ruby>9<ruby>時<rt>じ</rt></ruby>から6<ruby>時<rt>じ</rt></ruby>まで<ruby>働<rt>はたら</rt></ruby>きます。","kana":"","vi":"","audio":"私は毎日9時から6時まで働きます。"},{"jp":"④<ruby>昨日<rt>きのう</rt></ruby>、７<ruby>時半<rt>じはん</rt></ruby>から<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しました。","kana":"","vi":"","audio":"昨日、７時半から日本語を勉強しました。"}]},{"id":"g6a_5","lesson":"Bài 6A","title":"Vません Vませんでした","formula":"Vません Vませんでした","meaning":"Không V Đã không V","explanation":"・「Vません」： là dạng phủ định của「Vます」 , diễn tả hành động, sự việc, thói quen không xảy ra trong hiện tại hoặc trong tương lai.<br>・「Vませんでした」： là dạng phủ định của「Vました」, diễn tả những việc đã không làm, đã không xảy ra trong quá khứ.<br>(Hiện tại và tương lai) (Quá khứ)","brief":"・「Vません」： là dạng phủ định của「Vます」 , diễn tả hành động, sự việc, thói quen không xảy ra trong hiện tại hoặc trong tương lai.","notes":"","examples":[{"jp":"VませんVませんでした","kana":"","vi":"","audio":"VませんVませんでした"},{"jp":"例<ruby>働<rt>はたら</rt></ruby>きません<ruby>働<rt>はたら</rt></ruby>きませんでした<br><ruby>休<rt>やす</rt></ruby>みません<ruby>休<rt>やす</rt></ruby>みませんでした<br><ruby>出<rt>で</rt></ruby>かけません<ruby>出<rt>で</rt></ruby>かけませんでした","kana":"","vi":"","audio":"働きません働きませんでした 休みません休みませんでした 出かけません出かけませんでした"},{"jp":"①<ruby>私<rt>わたし</rt></ruby>は<ruby>土曜日<rt>どようび</rt></ruby>と<ruby>日曜日<rt>にちようび</rt></ruby><ruby>働<rt>はたら</rt></ruby>きません。","kana":"","vi":"","audio":"私は土曜日と日曜日働きません。"},{"jp":"②<ruby>私<rt>わたし</rt></ruby>は<ruby>今日<rt>きょう</rt></ruby>、<ruby>出<rt>で</rt></ruby>かけません。","kana":"","vi":"","audio":"私は今日、出かけません。"},{"jp":"③A：（Bさんは）<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>勉強<rt>べんきょう</rt></ruby>しますか。<br>→Ｂ：はい、<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>勉強<rt>べんきょう</rt></ruby>します。<br>Ｂ：いいえ、<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>勉強<rt>べんきょう</rt></ruby>しません。ときどき<ruby>勉強<rt>べんきょう</rt></ruby>します。","kana":"","vi":"","audio":"（Bさんは）毎日、勉強しますか。 はい、毎日、勉強します。 いいえ、毎日、勉強しません。ときどき勉強します。"},{"jp":"④<ruby>田中<rt>たなか</rt></ruby>さん・<ruby>昨日<rt>きのう</rt></ruby><br>→<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>昨日<rt>きのう</rt></ruby>、<ruby>働<rt>はたら</rt></ruby>きませんでした。","kana":"","vi":"","audio":"田中さん・昨日 田中さんは昨日、働きませんでした。"}]},{"id":"g6b_6","lesson":"Bài 6B","title":"N へ /に 帰ります","formula":"N へ /に 帰ります","meaning":"Về/ trở về N","explanation":"・Mẫu câu được dùng để diễn tả việc trở về địa điểm N (N phải là địa điểm gần gũi, thân thuộc với người nói như: nhà, quê hương, đất nước,...)<br>・「へ」： là trợ từ biểu thị phương hướng, địa điểm di chuyển, đọc là「え」 .<br>「に」： trợ từ biểu thị phương hướng, địa điểm di chuyển,...<br>→trong mẫu câu này「に」 hoàn toàn có thể thay thế cho「へ」.<br>Tuy nhiên, trong văn nói thì trợ từ「に」 thường được sử dụng nhiều hơn.","brief":"・Mẫu câu được dùng để diễn tả việc trở về địa điểm N (N phải là địa điểm gần gũi, thân thuộc với người nói như: nhà, quê hương, đất nước,...)","notes":"","examples":[{"jp":"①<ruby>今週<rt>こんしゅう</rt></ruby>の<ruby>金曜日<rt>きんようび</rt></ruby>（に）、<ruby>実家<rt>じっか</rt></ruby>へ<ruby>帰<rt>かえ</rt></ruby>ります。","kana":"","vi":"","audio":"今週の金曜日（に）、実家へ帰ります。"},{"jp":"②<ruby>今日<rt>きょう</rt></ruby>は8<ruby>時<rt>じ</rt></ruby>にうちに<ruby>帰<rt>かえ</rt></ruby>ります。","kana":"","vi":"","audio":"今日は8時にうちに帰ります。"},{"jp":"③<ruby>今晩<rt>こんばん</rt></ruby>・<ruby>寮<rt>りょう</rt></ruby>（はい）<br>→A：<ruby>今晩<rt>こんばん</rt></ruby><ruby>寮<rt>りょう</rt></ruby>へ/に<ruby>帰<rt>かえ</rt></ruby>りますか。<br>B：はい、<ruby>帰<rt>かえ</rt></ruby>ります。","kana":"","vi":"","audio":"今晩・寮（はい） 今晩寮へ/に帰りますか。 はい、帰ります。"}]},{"id":"g6b_7","lesson":"Bài 6B","title":"N へ /に 行きます","formula":"N へ /に 行きます","meaning":"Đi tới/ đi đến N","explanation":"・ Mẫu câu dùng để diễn tả hành động di chuyển đến một địa điểm nào đó.<br>・「行きます」là động từ thể hiện việc di chuyển, được sử dụng trong 2 trường hợp sau:<br>❶Diễn tả việc di chuyển ra xa địa điểm ❷Diễn tả đối tượng B di chuyển từ địa của người nói. Dù chủ ngữ là bản thân điểm này sang địa điểm khác, mà không hay người khác thì trong trường hợp liên quan đến địa điểm đối tượng B.<br>này đều sử dụng「行きます」","brief":"・ Mẫu câu dùng để diễn tả hành động di chuyển đến một địa điểm nào đó.","notes":"","examples":[{"jp":"私/〇〇さんは〇〇さんは<br>Ｂへ/に行きます。Cへ/に行きます。","kana":"","vi":"","audio":"私/〇〇さんは〇〇さんは Ｂへ/に行きます。Cへ/に行きます。"},{"jp":"①A：<ruby>日曜日<rt>にちようび</rt></ruby>はどこへ/に<ruby>行<rt>い</rt></ruby>きますか。<br>B：<ruby>図書館<rt>としょかん</rt></ruby>へ/に<ruby>行<rt>い</rt></ruby>きます。","kana":"","vi":"","audio":"日曜日はどこへ/に行きますか。 図書館へ/に行きます。"},{"jp":"②<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>昨日<rt>きのう</rt></ruby>、<ruby>郵便局<rt>ゆうびんきょく</rt></ruby>へ/に<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"田中さんは昨日、郵便局へ/に行きました。"},{"jp":"③<ruby>一昨日<rt>おととい</rt></ruby><ruby>学校<rt>がっこう</rt></ruby>へ/に<ruby>行<rt>い</rt></ruby>きませんでした。","kana":"","vi":"","audio":"一昨日学校へ/に行きませんでした。"}]},{"id":"g6b_8","lesson":"Bài 6B","title":"N へ /に 来ます","formula":"N へ /に 来ます","meaning":"Đến N","explanation":"・ Mẫu câu được dùng để diễn tả việc di chuyển tới địa điểm N (N là địa điểm mà người nói đang ở đó).<br>・「来ます」được sử dụng khi bản thân người nói hoặc người khác di chuyển, tiến gần về phía địa điểm mà người nói đang ở.<br>A B","brief":"・ Mẫu câu được dùng để diễn tả việc di chuyển tới địa điểm N (N là địa điểm mà người nói đang ở đó).","notes":"","examples":[{"jp":"私/〇〇さんは<br>Bへ/に来ます。","kana":"","vi":"","audio":"私/〇〇さんは Bへ/に来ます。"},{"jp":"①<ruby>私<rt>わたし</rt></ruby>はいつも8<ruby>時<rt>じ</rt></ruby>50<ruby>分<rt>ぷん</rt></ruby>に<ruby>会社<rt>かいしゃ</rt></ruby>に/へ<ruby>来<rt>き</rt></ruby>ます。","kana":"","vi":"","audio":"私はいつも8時50分に会社に/へ来ます。"},{"jp":"②<ruby>私<rt>わたし</rt></ruby>は<ruby>一昨年<rt>おととし</rt></ruby>に<ruby>日本<rt>にほん</rt></ruby>に<ruby>来<rt>き</rt></ruby>ました。","kana":"","vi":"","audio":"私は一昨年に日本に来ました。"},{"jp":"③A：Bさん、いつベトナムに<ruby>来<rt>き</rt></ruby>ますか。<br>B：<ruby>来週<rt>らいしゅう</rt></ruby><ruby>行<rt>い</rt></ruby>きますよ！<br>A：<ruby>本当<rt>ほんとう</rt></ruby>ですか!<ruby>楽<rt>たの</rt></ruby>しみです！","kana":"","vi":"","audio":"Bさん、いつベトナムに来ますか。 来週行きますよ！ 本当ですか!楽しみです！"}]},{"id":"g6c_9","lesson":"Bài 6C","title":"Nを V / (?)何を Vか","formula":"Nを V / (?)何を Vか","meaning":"V (tác động đến) N","explanation":"・ Mẫu câu được dùng để diễn tả một hành động có tác động lên một đối tượng khác.<br>・「を」： trợ từ đứng sau đối tượng chịu tác động, ảnh hưởng của hành động.<br>❖Trong tiếng Nhật sẽ có những động từ đi được vớ「i を」và những động từ không kết hợp được vớ「i を」 (học ở các bài sau).","brief":"・ Mẫu câu được dùng để diễn tả một hành động có tác động lên một đối tượng khác.","notes":"","examples":[{"jp":"①<ruby>昨日<rt>きのう</rt></ruby>、<ruby>本<rt>ほん</rt></ruby>を<ruby>買<rt>か</rt></ruby>いました。","kana":"","vi":"","audio":"昨日、本を買いました。"},{"jp":"②テレビを<ruby>見<rt>み</rt></ruby>ました。","kana":"","vi":"","audio":"テレビを見ました。"},{"jp":"③A：<ruby>今晩<rt>こんばん</rt></ruby><ruby>何<rt>なに</rt></ruby>を<ruby>食<rt>た</rt></ruby>べますか。<br>B：すしとラーメンを<ruby>食<rt>た</rt></ruby>べます。","kana":"","vi":"","audio":"今晩何を食べますか。 すしとラーメンを食べます。"},{"jp":"④<ruby>毎朝<rt>まいあさ</rt></ruby>お<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みます。","kana":"","vi":"","audio":"毎朝お茶を飲みます。"},{"jp":"⑤A：<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しますか。<br>B：いいえ、<ruby>毎日<rt>まいにち</rt></ruby>、<ruby>勉強<rt>べんきょう</rt></ruby>しません。ときどき<ruby>勉強<rt>べんきょう</rt></ruby>します。","kana":"","vi":"","audio":"毎日、日本語を勉強しますか。 いいえ、毎日、勉強しません。ときどき勉強します。"}]},{"id":"g6c_10","lesson":"Bài 6C","title":"N で V / (?)どこで Vか","formula":"N で V / (?)どこで Vか","meaning":"V ở/ tại N","explanation":"・ Mẫu câu dùng để diễn tả hành động V xảy ra tại địa điểm N.<br>・「で」là trợ từ đứng sau danh từ chỉ địa điểm.<br>❖Cách sử dụng của các trợ từ đứng sau danh từ chỉ địa điểm:<br>・「へ」： biểu thị phương hướng và địa điểm di chuyển (có thể thay thế bởi「に」).<br>・「に」： biểu thị địa điểm tồn tại của người, vật.<br>・「で」： biểu thị địa điểm xảy ra hành động.","brief":"・ Mẫu câu dùng để diễn tả hành động V xảy ra tại địa điểm N.","notes":"","examples":[{"jp":"①ベトナム<ruby>料理<rt>りょうり</rt></ruby>の<ruby>店<rt>みせ</rt></ruby>でフォーを<ruby>食<rt>た</rt></ruby>べます。","kana":"","vi":"","audio":"ベトナム料理の店でフォーを食べます。"},{"jp":"②<ruby>日本<rt>にほん</rt></ruby>で<ruby>富士山<rt>ふじさん</rt></ruby>を<ruby>見<rt>み</rt></ruby>ました。","kana":"","vi":"","audio":"日本で富士山を見ました。"},{"jp":"③A：いつもどこで<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みますか。<br>B：<ruby>図書館<rt>としょかん</rt></ruby>で<ruby>読<rt>よ</rt></ruby>みます。","kana":"","vi":"","audio":"いつもどこで本を読みますか。 図書館で読みます。"}]},{"id":"g6c_11","lesson":"Bài 6C","title":"N と V / (?) 誰と Vか？","formula":"N と V / (?) 誰と Vか？","meaning":"V cùng với N","explanation":"・ Mẫu câu được dùng để diễn tả việc thực hiện hành động V cùng với N.<br>・「と」： là trợ từ biểu thị đối tượng cùng thực hiện hành động.<br>❖Trong trường hợp muốn nói thực hiện hành động gì một mình →「一人で」＋ V","brief":"・ Mẫu câu được dùng để diễn tả việc thực hiện hành động V cùng với N.","notes":"","examples":[{"jp":"①<ruby>友達<rt>ともだち</rt></ruby>とお<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みます。","kana":"","vi":"","audio":"友達とお酒を飲みます。"},{"jp":"②<ruby>妹<rt>いもうと</rt></ruby>と<ruby>日本<rt>にほん</rt></ruby>に<ruby>来<rt>き</rt></ruby>ました。","kana":"","vi":"","audio":"妹と日本に来ました。"},{"jp":"③<ruby>今朝<rt>けさ</rt></ruby><ruby>一人<rt>ひとり</rt></ruby>で<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>きました。","kana":"","vi":"","audio":"今朝一人で音楽を聞きました。"}]},{"id":"g6c_12","lesson":"Bài 6C","title":"Nとか N（とか） ～ / ～Nや N（など） ～","formula":"Nとか N（とか） ～ / ～Nや N（など） ～","meaning":"Nào là N , nào là N / Ví dụ như N, N...","explanation":"・Mẫu câu được dùng khi muốn liệt kê từ 2 danh từ trở lên và lấy N1 , N2 là các danh từ tiêu biểu làm đại diện.<br>・「とか」： thường được dùng trong văn nói và「とか」sau N2 có thể lược bỏ.<br>「や～など」： thường được dùng trong văn viết và「など」có thể lược bỏ.<br>❖Khi sử dụng cấu trúc này cần chú ý không tùy tiện kết hợp「や」 với「とか」","brief":"・Mẫu câu được dùng khi muốn liệt kê từ 2 danh từ trở lên và lấy N1 , N2 là các danh từ tiêu biểu làm đại diện.","notes":"","examples":[{"jp":"hay「とか」vớ「iなど」","kana":"","vi":"","audio":"hay「とか」vớ「iなど」"},{"jp":"例〇NやNなど〇NとかNとか<br>×NやNとか×NとかNなど","kana":"","vi":"","audio":"〇NやNなど〇NとかNとか ×NやNとか×NとかNなど"},{"jp":"①<ruby>東京<rt>とうきょう</rt></ruby>で<ruby>本<rt>ほん</rt></ruby>とかお<ruby>菓子<rt>かし</rt></ruby>（とか）を<ruby>買<rt>か</rt></ruby>いました。","kana":"","vi":"","audio":"東京で本とかお菓子（とか）を買いました。"},{"jp":"②<ruby>家族<rt>かぞく</rt></ruby>とハノイやダナンに<ruby>行<rt>い</rt></ruby>きます。","kana":"","vi":"","audio":"家族とハノイやダナンに行きます。"},{"jp":"③ハノイ・ホーチミン・<ruby>行<rt>い</rt></ruby>きます<br>→ハノイとかホーチミン（とか）に<ruby>行<rt>い</rt></ruby>きました。<br>ハノイやホーチミン（など）に<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"ハノイ・ホーチミン・行きます ハノイとかホーチミン（とか）に行きました。 ハノイやホーチミン（など）に行きました。"}]},{"id":"g7a_1","lesson":"Bài 7A","title":"どこ/だれ/何 ＋ か（Trợ từ）＋ Vか","formula":"どこ/だれ/何 ＋ か（Trợ từ）＋ Vか","meaning":"Có V đâu đó/ ai đó/ cái gì đó không?","explanation":"・ Khi không chắc một hành động có xảy ra hay không, ta thêm「か」vào sau từ để hỏi, để xác nhận phỏng đoán với người nghe.<br>❖Khi thêm「か」 vào sau từ nghi vấn, các trợ từ đi kèm như「へ」「を」「が」có thể được lược bỏ, còn trợ từ「と」「で」thì không.<br>❖Câu trả lời: 「はい、～Vます／Vました」","brief":"・ Khi không chắc một hành động có xảy ra hay không, ta thêm「か」vào sau từ để hỏi, để xác nhận phỏng đoán với người nghe.","notes":"","examples":[{"jp":"「いいえ、từđểhỏi+も〜Vません/Vませんでした」","kana":"","vi":"","audio":"「いいえ、từđểhỏi+も〜Vません/Vませんでした」"},{"jp":"①<ruby>何<rt>なに</rt></ruby>を<ruby>食<rt>た</rt></ruby>べますか。→<ruby>何<rt>なに</rt></ruby>か（を）<ruby>食<rt>た</rt></ruby>べますか。","kana":"","vi":"","audio":"何を食べますか。何か（を）食べますか。"},{"jp":"②<ruby>誰<rt>だれ</rt></ruby>がいますか。→<ruby>誰<rt>だれ</rt></ruby>か（が）いますか。","kana":"","vi":"","audio":"誰がいますか。誰か（が）いますか。"},{"jp":"③<ruby>昨日<rt>きのう</rt></ruby>・<ruby>行<rt>い</rt></ruby>きます<br>→A：<ruby>昨日<rt>きのう</rt></ruby>どこかへ<ruby>行<rt>い</rt></ruby>きましたか。<br>Ｂ：はい、<ruby>東京<rt>とうきょう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"昨日・行きます 昨日どこかへ行きましたか。 はい、東京へ行きました。"}]},{"id":"g7a_2","lesson":"Bài 7A","title":"どこ/だれ/何 ＋（Trợ từ）も ＋ V","formula":"どこ/だれ/何 ＋（Trợ từ）も ＋ V","meaning":"Chẳng (V)～","explanation":"・ 「も」đứng sau các từ để hỏi và đi kèm với V phủ định, để phủ định hoàn toàn mọi đối tượng trong phạm vi từ để hỏi.","brief":"・ 「も」đứng sau các từ để hỏi và đi kèm với V phủ định, để phủ định hoàn toàn mọi đối tượng trong phạm vi từ để hỏi.","notes":"","examples":[{"jp":"①<ruby>今朝<rt>けさ</rt></ruby><ruby>何<rt>なに</rt></ruby>も<ruby>食<rt>た</rt></ruby>べませんでした。","kana":"","vi":"","audio":"今朝何も食べませんでした。"},{"jp":"②<ruby>誰<rt>だれ</rt></ruby>とも<ruby>行<rt>い</rt></ruby>きません。","kana":"","vi":"","audio":"誰とも行きません。"},{"jp":"③<ruby>昨日<rt>きのう</rt></ruby>どこかに<ruby>行<rt>い</rt></ruby>きましたか。<br>→はい、<ruby>郵便局<rt>ゆうびんきょく</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"昨日どこかに行きましたか。 はい、郵便局に行きました。"}]},{"id":"g7b_3","lesson":"Bài 7B","title":"N を (Số lượng từ)ください/お願いします","formula":"N を (Số lượng từ)ください/お願いします","meaning":"Hãy cho tôi ～(số lượng) N","explanation":"・ Mẫu câu được dùng để trình bày mong muốn của người nói khi muốn có hoặc muốn mua một đồ vật gì đó (với số lượng cụ thể bao nhiêu) .<br>・ Khi đếm đồ vật, chúng ta sẽ thêm đơn vị đếm vào sau số lượng từ.<br>・ Một số đơn vị đếm thường gặp:<br>- ～冊 : đếm sách, vở, tạp chí ,..<br>- ～枚 : đếm các vật mỏng, dẹt như giấy, quần áo, CD - ～本 : đếm các vật có hình dạng thon dài như bút, ô, chai, lọ, ...<br>- ～杯 : đếm các đồ vật dùng để đựng như cốc bia, bát cơm,..」 - ～個、～つ : đếm các đồ vật nhỏ như quả trứng, cốc, khoanh bánh/ chiếc bánh nhỏ,...<br>❖Vị trí của số từ trong câu: thường số từ sẽ đứng trước động từ.<br>❖Khi liệt kê đồng thời nhiều đối tượng, đồ vật, có thể thêm「と」 vào ngay sau lượng từ của đồ vật trước đó.","brief":"・ Mẫu câu được dùng để trình bày mong muốn của người nói khi muốn có hoặc muốn mua một đồ vật gì đó (với số lượng cụ thể bao nhiêu) .","notes":"","examples":[{"jp":"①×１つケーキをください。<br>〇ケーキを１つください。","kana":"","vi":"","audio":"×１つケーキをください。 〇ケーキを１つください。"},{"jp":"②×2<ruby>人<rt>たり</rt></ruby><ruby>子供<rt>こども</rt></ruby>がいます。<br>〇<ruby>子供<rt>こども</rt></ruby>が2<ruby>人<rt>たり</rt></ruby>います。","kana":"","vi":"","audio":"×2人子供がいます。 〇子供が2人います。"},{"jp":"③すみません、ペンを3<ruby>本<rt>ぼん</rt></ruby>と<ruby>消<rt>け</rt></ruby>しゴムをお<ruby>願<rt>ねが</rt></ruby>いします。","kana":"","vi":"","audio":"すみません、ペンを3本と消しゴムをお願いします。"},{"jp":"④<ruby>公園<rt>こうえん</rt></ruby>に<ruby>男<rt>おとこ</rt></ruby>の<ruby>子<rt>こ</rt></ruby>が1<ruby>人<rt>とり</rt></ruby>と<ruby>女<rt>おんな</rt></ruby>の<ruby>子<rt>こ</rt></ruby>が2<ruby>人<rt>たり</rt></ruby>います。","kana":"","vi":"","audio":"公園に男の子が1人と女の子が2人います。"}]},{"id":"g7b_4","lesson":"Bài 7B","title":"(Khoảng thời gian＋に ) tần suất/ số lượng＋V","formula":"(Khoảng thời gian＋に ) tần suất/ số lượng＋V","meaning":"V～lần","explanation":"(hoặc số lượng cụ thể khác) Mẫu câu được dùng để diễn tả tần suất/ số lần thực hiện V trong một khoảng thời gian nào đó.<br>❖Một số phó từ tần suất thường dùng trong tiếng Nhật như:<br>❖「よく」còn thường được dùng trong câu nghi vấn để xác nhận đối phương có thường xuyên làm hành động nào đó không.","brief":"(hoặc số lượng cụ thể khác) Mẫu câu được dùng để diễn tả tần suất/ số lần thực hiện V trong một khoảng thời gian nào đó.","notes":"","examples":[{"jp":"「よく」「ときどき」「あまり」...","kana":"","vi":"","audio":"「よく」「ときどき」「あまり」..."},{"jp":"例A:<ruby>田中<rt>たなか</rt></ruby>さんは<ruby>本<rt>ほん</rt></ruby>をよく<ruby>読<rt>よ</rt></ruby>みますか。<br>B:よく<ruby>読<rt>よ</rt></ruby>みますよ。","kana":"","vi":"","audio":"田中さんは本をよく読みますか。 よく読みますよ。"},{"jp":"①1か<ruby>月<rt>げつ</rt></ruby>に1<ruby>回<rt>かい</rt></ruby>、ラーメンを<ruby>食<rt>た</rt></ruby>べます。","kana":"","vi":"","audio":"1か月に1回、ラーメンを食べます。"},{"jp":"②1<ruby>週間<rt>しゅうかん</rt></ruby>に4<ruby>日<rt>か</rt></ruby>、<ruby>働<rt>はたら</rt></ruby>きます。","kana":"","vi":"","audio":"1週間に4日、働きます。"},{"jp":"③1<ruby>日<rt>にち</rt></ruby>に3、４<ruby>杯<rt>んはい</rt></ruby>、お<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みます。","kana":"","vi":"","audio":"1日に3、４杯、お酒を飲みます。"},{"jp":"④<ruby>映画<rt>えいが</rt></ruby>をあまり<ruby>見<rt>み</rt></ruby>ません。<br>あまり<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ません。","kana":"","vi":"","audio":"映画をあまり見ません。 あまり映画を見ません。"}]},{"id":"g7c_5","lesson":"Bài 7C","title":"V ませんか / V ましょう / V ましょうか","formula":"V ませんか / V ましょう / V ましょうか","meaning":"Vませんか ： Có cùng làm V không? Vましょう ： Cùng làm V nhé. Vましょうか：Cùng V nhỉ?","explanation":"Phân biệt cơ bản 3 cách nói mời rủ, đối đáp thường gặp trong tiếng Nhật.<br>・Cách rủ khi chưa biết đối phương có đồng ý với lời mời hay không.<br>・Cách rủ khi cảm thấy có cơ sở rằng đối phương sẽ đồng ý.<br>・Dùng để trả lời khi đồng ý với lời mời, lời rủ của ai đó.<br>・Ngoài ra đây còn là cách nói mang tính chất hô hào mọi người cùng nhau làm<br>・Sau khi đã quyết định cùng nhau làm một việc gì đó, người Nhật thường dùng「Vましょうか」 để trao đổi cụ thể về thời gian, địa điểm,... để tiến hành sự việc đó.<br>・Khi đưa ra đề xuất, chúng ta có thể sử dụng câu「Nは どうですか」 ♦ Trong phạm vi bài học này, chúng ta sẽ chỉ tập từ chối lời mời bằng cách nói:","brief":"Phân biệt cơ bản 3 cách nói mời rủ, đối đáp thường gặp trong tiếng Nhật.","notes":"","examples":[{"jp":"Vませんか例A:<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きませんか。<br>B:いいですね。<ruby>行<rt>い</rt></ruby>きましょう。<br>Vましょうgì.<br><ruby>行<rt>い</rt></ruby>きましょう、<ruby>帰<rt>かえ</rt></ruby>りましょう、<ruby>休<rt>やす</rt></ruby>みましょう...","kana":"","vi":"","audio":"Vませんか一緒に行きませんか。 いいですね。行きましょう。 Vましょうgì. 行きましょう、帰りましょう、休みましょう..."},{"jp":"例<ruby>田中<rt>たなか</rt></ruby>さん、6<ruby>時<rt>じ</rt></ruby>ですよ。<ruby>帰<rt>かえ</rt></ruby>りましょう。<br>Vましょうか例A：<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ませんか。<br>B：いいですね。<ruby>見<rt>み</rt></ruby>ましょう。どこで<ruby>見<rt>み</rt></ruby>ましょうか。<br>A：「サンライズシアター」はどうですか。<br>B：いいですね。<br>「すみません、〜はちょっと...」","kana":"","vi":"","audio":"田中さん、6時ですよ。帰りましょう。 Vましょうか一緒に映画を見ませんか。 いいですね。見ましょう。どこで見ましょうか。 「サンライズシアター」はどうですか。 いいですね。 「すみません、〜はちょっと...」"},{"jp":"①A：<ruby>一緒<rt>いっしょ</rt></ruby>にコーヒーを<ruby>飲<rt>の</rt></ruby>みませんか。<br>B：すみません、<ruby>今日<rt>きょう</rt></ruby>はちょっと…","kana":"","vi":"","audio":"一緒にコーヒーを飲みませんか。 すみません、今日はちょっと…"},{"jp":"②A：<ruby>明日<rt>あした</rt></ruby>、<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>公園<rt>こうえん</rt></ruby>に<ruby>行<rt>い</rt></ruby>きませんか。<br>B：いいですね。<ruby>行<rt>い</rt></ruby>きましょう。","kana":"","vi":"","audio":"明日、一緒に公園に行きませんか。 いいですね。行きましょう。"}]},{"id":"g7c_6","lesson":"Bài 7C","title":"N が 欲しいです","formula":"N が 欲しいです","meaning":"Muốn có N","explanation":"・「欲しい」sử dụng trong trường hợp nói về mong muốn của bản thân, hoặc dùng để hỏi về mong muốn của ai đó.<br>❖Không sử dụng「欲しい」để nói về mong muốn của người khác.","brief":"・「欲しい」sử dụng trong trường hợp nói về mong muốn của bản thân, hoặc dùng để hỏi về mong muốn của ai đó.","notes":"","examples":[{"jp":"①<ruby>時計<rt>とけい</rt></ruby>が<ruby>欲<rt>ほ</rt></ruby>しいです。","kana":"","vi":"","audio":"時計が欲しいです。"},{"jp":"②テレビが<ruby>欲<rt>ほ</rt></ruby>しいです。","kana":"","vi":"","audio":"テレビが欲しいです。"},{"jp":"③A：<ruby>今<rt>いま</rt></ruby>、<ruby>何<rt>なに</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>欲<rt>ほ</rt></ruby>しいですか。<br>B：スマホが<ruby>一番<rt>いちばん</rt></ruby><ruby>欲<rt>ほ</rt></ruby>しいです。<br>A：どんなスマホが<ruby>欲<rt>ほ</rt></ruby>しいですか。<br>B：MORIPHONEのスマホが<ruby>欲<rt>ほ</rt></ruby>しいです。","kana":"","vi":"","audio":"今、何が一番欲しいですか。 スマホが一番欲しいです。 どんなスマホが欲しいですか。 MORIPHONEのスマホが欲しいです。"}]},{"id":"g7d_7","lesson":"Bài 7D","title":"（Nへ/に） ＋ V /Nに","formula":"（Nへ/に） ＋ V /Nに","meaning":"Đi/ đến/ về địa điểm N để V/ N","explanation":"・「に」： là trợ từ đứng sau N, chỉ mục đích di chuyển.","brief":"・「に」： là trợ từ đứng sau N, chỉ mục đích di chuyển.","notes":"","examples":[{"jp":"・Nlàdanhtừ:<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>、<ruby>留学<rt>りゅうがく</rt></ruby>、<ruby>食事<rt>しょくじ</rt></ruby>、<ruby>散歩<rt>さんぽ</rt></ruby>、<ruby>旅行<rt>りょこう</rt></ruby>、...","kana":"","vi":"","audio":"・Nlàdanhtừ:買い物、留学、食事、散歩、旅行、..."},{"jp":"例①<ruby>来年<rt>らいねん</rt></ruby>、<ruby>日本<rt>にほん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きます。<ruby>留学<rt>りゅうがく</rt></ruby>します。<br>→<ruby>来年<rt>らいねん</rt></ruby>、<ruby>日本<rt>にほん</rt></ruby>へ<ruby>留学<rt>りゅうがく</rt></ruby>に<ruby>行<rt>い</rt></ruby>きます。","kana":"","vi":"","audio":"来年、日本へ行きます。留学します。 来年、日本へ留学に行きます。"},{"jp":"②<ruby>昨日<rt>きのう</rt></ruby>、<ruby>公園<rt>こうえん</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きました。<ruby>散歩<rt>さんぽ</rt></ruby>しました。<br>→<ruby>昨日<rt>きのう</rt></ruby>、<ruby>公園<rt>こうえん</rt></ruby>へ<ruby>散歩<rt>さんぽ</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"昨日、公園へ行きました。散歩しました。 昨日、公園へ散歩に行きました。"},{"jp":"①スーパーへ/に<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>に<ruby>来<rt>き</rt></ruby>ました。","kana":"","vi":"","audio":"スーパーへ/に買い物に来ました。"},{"jp":"②<ruby>東京<rt>とうきょう</rt></ruby>へ/にコンサートに<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"東京へ/にコンサートに行きました。"},{"jp":"③ベトナム<ruby>料理<rt>りょうり</rt></ruby>の<ruby>店<rt>みせ</rt></ruby>へ/にフォーを<ruby>食<rt>た</rt></ruby>べに<ruby>行<rt>い</rt></ruby>きます。","kana":"","vi":"","audio":"ベトナム料理の店へ/にフォーを食べに行きます。"},{"jp":"④<ruby>国<rt>くに</rt></ruby>へ/にベトナム<ruby>料理<rt>りょうり</rt></ruby>を<ruby>食<rt>た</rt></ruby>べに<ruby>帰<rt>かえ</rt></ruby>ります。","kana":"","vi":"","audio":"国へ/にベトナム料理を食べに帰ります。"}]},{"id":"g7d_8","lesson":"Bài 7D","title":"Nが V たいです","formula":"Nが V たいです","meaning":"Muốn V","explanation":"・ Mẫu câu được dùng để diễn tả mong muốn thực hiện hành động nào đó.<br>・ Dùng「が」 thay cho「を」<br>・ Dạng phủ định: Vたい ＋ くない<br>❖Tương tự với 欲しい chúng ta cũng sẽ không dùng cách nói này khi chủ ngữ là người khác. Tuy nhiên có thể dùng Vたい khi muốn hỏi hay xác nhận lại mong muốn của người khác.","brief":"・ Mẫu câu được dùng để diễn tả mong muốn thực hiện hành động nào đó.","notes":"","examples":[{"jp":"①<ruby>食<rt>た</rt></ruby>べます→<ruby>食<rt>た</rt></ruby>べたいです。→フォーが<ruby>食<rt>た</rt></ruby>べたいです。","kana":"","vi":"","audio":"食べます食べたいです。フォーが食べたいです。"},{"jp":"②<ruby>行<rt>い</rt></ruby>きます→<ruby>行<rt>い</rt></ruby>きたいです→<ruby>行<rt>い</rt></ruby>きたくないです<br>→<ruby>会社<rt>かいしゃ</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きたくないです。","kana":"","vi":"","audio":"行きます行きたいです行きたくないです 会社へ行きたくないです。"},{"jp":"③A：<ruby>日本<rt>にほん</rt></ruby>で<ruby>何<rt>なに</rt></ruby>が<ruby>買<rt>か</rt></ruby>いたいですか。<br>B：CDが<ruby>買<rt>か</rt></ruby>いたいです。","kana":"","vi":"","audio":"日本で何が買いたいですか。 CDが買いたいです。"},{"jp":"④<ruby>子供<rt>こども</rt></ruby>のころ・<ruby>毎日<rt>まいにち</rt></ruby>・<ruby>勉強<rt>べんきょう</rt></ruby>します<br>→<ruby>子供<rt>こども</rt></ruby>のころ、<ruby>毎日<rt>まいにち</rt></ruby><ruby>勉強<rt>べんきょう</rt></ruby>したくなかったです。<br><ruby>勉強<rt>べんきょう</rt></ruby>したくありませんでした。","kana":"","vi":"","audio":"子供のころ・毎日・勉強します 子供のころ、毎日勉強したくなかったです。 勉強したくありませんでした。"}]},{"id":"g7d_9","lesson":"Bài 7D","title":"V ＋ 方 Cách V","formula":"動詞の 可能形","meaning":"Cách V","explanation":"・ Mẫu câu dùng để diễn tả cách thức thực hiện một hành động nào đó.<br>・ V 方 được coi như một cụm Danh từ.<br>◆Các loại từ trong tiếng Nhật<br>・Danh từ: N<br>・Tính Từ: A ・A ◆Các nhóm Động từ trong tiếng Nhật<br>・Nhóm 1: Những động từ thuộc hàng「い」「「「<br>・Nhóm 2: Những động từ thuộc hàng「え」*<br>* Có một số động từ đặc biệt thuộc hàng「い」nhưng vẫn thuộc nhóm 2<br>** Danh từ tính động như: 散歩、買い物、勉強、...<br>Nhóm 1 Nhóm 2 Nhóm 3 (＿imasu) (＿emasu) (THỂ KHẢ NĂNG CỦA ĐỘNG TỪ) Nhóm 1 Nhóm 2 Nhóm 3 _ imasu → _ emasu _ masu → _ raremasu<br>❖Một số động từ thể hiện sự tồn tại hay nhận thức thì không chia về thể Khả năng:","brief":"・ Mẫu câu dùng để diễn tả cách thức thực hiện một hành động nào đó.","notes":"","examples":[{"jp":"ます","kana":"","vi":"","audio":"ます"},{"jp":"①<ruby>行<rt>い</rt></ruby>きます→<ruby>行<rt>い</rt></ruby>き<ruby>方<rt>かた</rt></ruby>","kana":"","vi":"","audio":"行きます行き方"},{"jp":"②<ruby>読<rt>よ</rt></ruby>みます→<ruby>読<rt>よ</rt></ruby>み<ruby>方<rt>かた</rt></ruby>","kana":"","vi":"","audio":"読みます読み方"},{"jp":"③<ruby>食<rt>た</rt></ruby>べます→<ruby>食<rt>た</rt></ruby>べ<ruby>方<rt>かた</rt></ruby>","kana":"","vi":"","audio":"食べます食べ方"},{"jp":"④<ruby>電子辞書<rt>でんしじしょ</rt></ruby>の<ruby>使<rt>つか</rt></ruby>い<ruby>方<rt>かた</rt></ruby>","kana":"","vi":"","audio":"電子辞書の使い方"},{"jp":"⑤これは<ruby>漢字<rt>かんじ</rt></ruby>の<ruby>書<rt>か</rt></ruby>き<ruby>方<rt>かた</rt></ruby>の<ruby>説明<rt>せつめい</rt></ruby>です。<br>・Độngtừ:Vます、Vません、Vました、Vませんでした<br>・Nhóm3:Baogồm「します」、「<ruby>来<rt>き</rt></ruby>ます」vàN**します<br><ruby>運<rt>はこ</rt></ruby>びます<ruby>食<rt>た</rt></ruby>べます<ruby>来<rt>き</rt></ruby>ます<br><ruby>持<rt>も</rt></ruby>ちます<ruby>寝<rt>ね</rt></ruby>ますします<br><ruby>泳<rt>およ</rt></ruby>ぎます<ruby>疲<rt>つか</rt></ruby>れます<ruby>散歩<rt>さんぽ</rt></ruby>します<br><ruby>弾<rt>ひ</rt></ruby>きます<ruby>見<rt>み</rt></ruby>ます*<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>します<br><ruby>行<rt>い</rt></ruby>きます→<ruby>行<rt>い</rt></ruby>けます<ruby>寝<rt>ね</rt></ruby>ます→<ruby>寝<rt>ね</rt></ruby>られますします→できます<br><ruby>帰<rt>かえ</rt></ruby>ります→<ruby>帰<rt>かえ</rt></ruby>れます<ruby>食<rt>た</rt></ruby>べます→<ruby>食<rt>た</rt></ruby>べられます<ruby>来<rt>き</rt></ruby>ます→<ruby>来<rt>こ</rt></ruby>られます<br><ruby>買<rt>か</rt></ruby>います→<ruby>買<rt>か</rt></ruby>えます*<ruby>起<rt>お</rt></ruby>きます→<ruby>起<rt>お</rt></ruby>きられます<ruby>旅行<rt>りょこう</rt></ruby>します→<ruby>旅行<rt>りょこう</rt></ruby>できます<br><ruby>読<rt>よ</rt></ruby>みます→<ruby>読<rt>よ</rt></ruby>めます*<ruby>見<rt>み</rt></ruby>ます→<ruby>見<rt>み</rt></ruby>られます<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>します→<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>できます<br>あります/います(có,ở);<ruby>知<rt>し</rt></ruby>ります(biết);<ruby>分<rt>わ</rt></ruby>かります(hiểu)","kana":"","vi":"","audio":"これは漢字の書き方の説明です。 ・Độngtừ:Vます、Vません、Vました、Vませんでした ・Nhóm3:Baogồm「します」、「来ます」vàN**します 運びます食べます来ます 持ちます寝ますします 泳ぎます疲れます散歩します 弾きます見ます*買い物します 行きます行けます寝ます寝られますしますできます 帰ります帰れます食べます食べられます来ます来られます 買います買えます*起きます起きられます旅行します旅行できます 読みます読めます*見ます見られます買い物します買い物できます あります/います(có,ở);知ります(biết);分かります(hiểu)"}]},{"id":"g8a_1","lesson":"Bài 8A","title":"(N は)~ が V(thể Khả năng)","formula":"(N は)~ が V(thể Khả năng)","meaning":"N (có thể) làm được V","explanation":"❶Diễn tả khả năng, năng lực của chủ thể.<br>❷Diễn tả khả năng thực hiện một sự việc, hành động nhờ có điều kiện, hoàn cảnh cụ thể nào đó.<br>❖Trợ từ「を」được thay bởi trợ từ「が」<br>❖Hai mặt ý nghĩa của thể khả năng:<br>⑤ A: Chào (buổi sáng). Đêm qua em có ngủ được không?<br>B: Vâng, em ngủ được. Anh ơi, bánh ngọt này ăn được không?<br>A: Được. Hôm qua anh mua ở siêu thị đó.<br>→ A: .............................................................................................................................<br>B: .............................................................................................................................<br>A: .............................................................................................................................","brief":"❶Diễn tả khả năng, năng lực của chủ thể.","notes":"","examples":[{"jp":"例・マイさんは<ruby>日本<rt>にほん</rt></ruby>の<ruby>新聞<rt>しんぶん</rt></ruby>が<ruby>読<rt>よ</rt></ruby>めます。<br>・ナムさんはお<ruby>酒<rt>さけ</rt></ruby>が<ruby>飲<rt>の</rt></ruby>めますか。","kana":"","vi":"","audio":"・マイさんは日本の新聞が読めます。 ・ナムさんはお酒が飲めますか。"},{"jp":"例・いい<ruby>天気<rt>てんき</rt></ruby>の<ruby>日<rt>ひ</rt></ruby>は、BBQができます。<br>・Youtubeでその<ruby>映画<rt>えいが</rt></ruby>が<ruby>見<rt>み</rt></ruby>られます。<br>❶Aさんは<ruby>沖縄<rt>おきなわ</rt></ruby>の<ruby>人<rt>ひと</rt></ruby>だから、<ruby>泳<rt>およ</rt></ruby>げます。<br>❷<ruby>今日<rt>きょう</rt></ruby>は<ruby>泳<rt>およ</rt></ruby>げますね。","kana":"","vi":"","audio":"・いい天気の日は、BBQができます。 ・Youtubeでその映画が見られます。 ❶Aさんは沖縄の人だから、泳げます。 ❷今日は泳げますね。"},{"jp":"①<ruby>今朝<rt>けさ</rt></ruby>、<ruby>起<rt>お</rt></ruby>きられませんでした。","kana":"","vi":"","audio":"今朝、起きられませんでした。"},{"jp":"②ナムさんはギターが<ruby>弾<rt>ひ</rt></ruby>けます。","kana":"","vi":"","audio":"ナムさんはギターが弾けます。"},{"jp":"③A：<ruby>写真<rt>しゃしん</rt></ruby>、<ruby>撮<rt>と</rt></ruby>れましたか？<br>B：はい、<ruby>撮<rt>と</rt></ruby>れました。","kana":"","vi":"","audio":"写真、撮れましたか？ はい、撮れました。"},{"jp":"④A：Bさんは<ruby>土曜日<rt>どようび</rt></ruby>と<ruby>日曜日<rt>にちようび</rt></ruby>、<ruby>休<rt>やす</rt></ruby>めますか。<br>B：いいえ、<ruby>休<rt>やす</rt></ruby>めません。","kana":"","vi":"","audio":"Bさんは土曜日と日曜日、休めますか。 いいえ、休めません。"}]},{"id":"g8a_2","lesson":"Bài 8A","title":"N で ＋ V / ？） 何 で ＋ V か","formula":"N で ＋ V / ？） 何 で ＋ V か","meaning":"Làm V bằng N (?) Làm V bằng gì thế?","explanation":"・「で」： là trợ từ biểu thị phương thức, phương tiện, công cụ.<br>❖Trường hợp「歩いて V」không có trợ từ「で」đi kèm.","brief":"・「で」： là trợ từ biểu thị phương thức, phương tiện, công cụ.","notes":"","examples":[{"jp":"①<ruby>車<rt>くるま</rt></ruby>で<ruby>東京<rt>とうきょう</rt></ruby>に<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"車で東京に行きました。"},{"jp":"②スプーンでプリンを<ruby>食<rt>た</rt></ruby>べます。","kana":"","vi":"","audio":"スプーンでプリンを食べます。"},{"jp":"③ベトナム<ruby>語<rt>ご</rt></ruby>で<ruby>説明<rt>せつめい</rt></ruby>します。","kana":"","vi":"","audio":"ベトナム語で説明します。"},{"jp":"④A：<ruby>学校<rt>がっこう</rt></ruby>には<ruby>何<rt>なに</rt></ruby>で<ruby>行<rt>い</rt></ruby>きますか。<br>B：<ruby>歩<rt>ある</rt></ruby>いて<ruby>行<rt>い</rt></ruby>きます。","kana":"","vi":"","audio":"学校には何で行きますか。 歩いて行きます。"}]},{"id":"g8a_3","lesson":"Bài 8A","title":"くらいです / Số tiền/khoảng thời gian＋ / かかります","formula":"くらいです / Số tiền/khoảng thời gian＋ / かかります","meaning":"(Làm V) bằng N tốn/ mất (Số tiền/ khoảng thời gian)","explanation":"・ Khi muốn hỏi đối phương làm việc gì đó tốn bao nhiêu tiền/ thời gian, thường","brief":"・ Khi muốn hỏi đối phương làm việc gì đó tốn bao nhiêu tiền/ thời gian, thường","notes":"","examples":[{"jp":"～<br>sửdụng2cáchhỏisau:「どのくらいですか」、「どのくらいかかりますか」","kana":"","vi":"","audio":"～ sửdụng2cáchhỏisau:「どのくらいですか」、「どのくらいかかりますか」"},{"jp":"①<ruby>日本<rt>にほん</rt></ruby>からベトナムまで、<ruby>飛行機<rt>ひこうき</rt></ruby>で5<ruby>時間<rt>じかん</rt></ruby>くらいです。","kana":"","vi":"","audio":"日本からベトナムまで、飛行機で5時間くらいです。"},{"jp":"②<ruby>東京駅<rt>とうきょうえき</rt></ruby>まで６５００<ruby>円<rt>えん</rt></ruby>くらいかかります。","kana":"","vi":"","audio":"東京駅まで６５００円くらいかかります。"}]},{"id":"g8a_4","lesson":"Bài 8A","title":"Số tiền/khoảng thời gianで ＋ V / ？）いくらで/どのくらいで ＋ Vか","formula":"Số tiền/khoảng thời gianで ＋ V / ？）いくらで/どのくらいで ＋ Vか","meaning":"・「で」biểu thị số tiền hoặc thời gian để có thể thực hiện V.","explanation":"・「で」biểu thị số tiền hoặc thời gian để ,"vi":"","audio":"山田さんは歌があまり上手じゃないです。"},{"jp":"⑤A：Ｂさんは<ruby>勉強<rt>べんきょう</rt></ruby>が<ruby>好<rt>す</rt></ruby>きですか。<br>B：いいえ、<ruby>好<rt>す</rt></ruby>きじゃないです。","kana":"","vi":"","audio":"Ｂさんは勉強が好きですか。 いいえ、好きじゃないです。"}]},{"id":"g8b_6","lesson":"Bài 8B","title":"～から～","formula":"～から～","meaning":"Vì nên","explanation":"・「どうして」 : dùng để hỏi nguyên nhân, lý do<br>❖Trước「～から」có thể là thể thường hoặc thể lịch sự.<br>Tuy nhiên, cách nói「thể thường ＋～から」thường được sử dụng phổ biến hơn.<br>Thể lịch sự +「から」 Thể thường +「から」","brief":"・「どうして」 : dùng để hỏi nguyên nhân, lý do","notes":"","examples":[{"jp":"～～<br>・Nですから〜ます。<br>Aだから〜ます。<br>Aから〜です。","kana":"","vi":"","audio":"～～ ・Nですから〜ます。 Aだから〜ます。 Aから〜です。"},{"jp":"①<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みですから、カラオケに①<ruby>明日<rt>あした</rt></ruby>は<ruby>休<rt>やす</rt></ruby>みだから、カラオケに<br><ruby>行<rt>い</rt></ruby>きます。<ruby>行<rt>い</rt></ruby>きます。","kana":"","vi":"","audio":"明日は休みですから、カラオケに明日は休みだから、カラオケに 行きます。行きます。"},{"jp":"②<ruby>暇<rt>ひま</rt></ruby>でしたから、<ruby>家<rt>いえ</rt></ruby>で<ruby>映画<rt>えいが</rt></ruby>を②<ruby>暇<rt>ひま</rt></ruby>だったから、<ruby>家<rt>いえ</rt></ruby>で<ruby>映画<rt>えいが</rt></ruby>を<br><ruby>見<rt>み</rt></ruby>ました。<ruby>見<rt>み</rt></ruby>ました。","kana":"","vi":"","audio":"暇でしたから、家で映画を暇だったから、家で映画を 見ました。見ました。"},{"jp":"③<ruby>安<rt>やす</rt></ruby>いですから、<ruby>買<rt>か</rt></ruby>います。③<ruby>安<rt>やす</rt></ruby>いから、<ruby>買<rt>か</rt></ruby>います。","kana":"","vi":"","audio":"安いですから、買います。安いから、買います。"},{"jp":"④<ruby>映画<rt>えいが</rt></ruby>が<ruby>見<rt>み</rt></ruby>られますから、④<ruby>映画<rt>えいが</rt></ruby>が<ruby>見<rt>み</rt></ruby>られるから、<br>ショッピングモールに<ruby>行<rt>い</rt></ruby>きました。ショッピングモールに<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"映画が見られますから、映画が見られるから、 ショッピングモールに行きました。ショッピングモールに行きました。"},{"jp":"⑤Ａ：<ruby>私<rt>わたし</rt></ruby>はカラオケより、<ruby>映画<rt>えいが</rt></ruby>のほうが<ruby>好<rt>す</rt></ruby>きです。<br>Ｂ：どうしてですか。<br>Ａ：<ruby>歌<rt>うた</rt></ruby>があまり<ruby>上手<rt>じょうず</rt></ruby>じゃありませんから。","kana":"","vi":"","audio":"私はカラオケより、映画のほうが好きです。 どうしてですか。 歌が  muốn Thông tin mới hay nội dung người nói muốn nhấn mạnh ở sau 「は」 nhấn mạnh ở tr","notes":"","examples":[{"jp":"例A:<ruby>誰<rt>だれ</rt></ruby>が<ruby>好<rt>す</rt></ruby>きですか。<br>B:ミンさんが<ruby>好<rt>す</rt></ruby>きです。","kana":"","vi":"","audio":"誰が好きですか。 ミンさんが好きです。"},{"jp":"例ミンさんは<ruby>東京<rt>とうきょう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きました。<br>ミンさんが<ruby>東京<rt>とうきょう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きました。<br>「は」「が」","kana":"","vi":"","audio":"ミンさんは東京へ行きました。 ミンさんが東京へ行きました。 「は」「が」"},{"jp":"例マイさんはパーティーに<ruby>来<rt>き</rt></ruby>ました。例パーティーに<ruby>誰<rt>だれ</rt></ruby>が<ruby>来<rt>き</rt></ruby>ましたか。<br>Thôngtinmớilà:<ruby>来<rt>き</rt></ruby>ました。→マイさんが<ruby>来<rt>き</rt></ruby>ました。","kana":"","vi":"","audio":"マイさんはパーティーに来ました。パーティーに誰が来ましたか。 Thôngtinmớilà:来ました。マイさんが来ました。"},{"jp":"例あの<ruby>人<rt>ひと</rt></ruby>はどなたですか。例どの<ruby>人<rt>ひと</rt></ruby>が<ruby>田中<rt>たなか</rt></ruby>さんですか。","kana":"","vi":"","audio":"あの人はどなたですか。どの人が田中さんですか。"},{"jp":"①A：<ruby>日本<rt>にほん</rt></ruby>のアニメで、<ruby>何<rt>なに</rt></ruby>が<ruby>一番<rt>いちばん</rt></ruby><ruby>好<rt>す</rt></ruby>きですか。<br>B：〇〇が<ruby>一番<rt>いちばん</rt></ruby><ruby>好<rt>す</rt></ruby>きです。","kana":"","vi":"","audio":"日本のアニメで、何が一番好きですか。 〇〇が一番好きです。"},{"jp":"②A：<ruby>明日<rt>あした</rt></ruby>は<ruby>飲<rt>の</rt></ruby>み<ruby>会<rt>かい</rt></ruby>ですよね。<br>B：<ruby>明後日<rt>あさって</rt></ruby>が<ruby>飲<rt>の</rt></ruby>み<ruby>会<rt>かい</rt></ruby>ですよ。","kana":"","vi":"","audio":"明日は飲み会ですよね。 明後日が飲み会ですよ。"},{"jp":"③A：<ruby>今日<rt>きょう</rt></ruby>は（Bさんの）<ruby>誕生日<rt>たんじょうび</rt></ruby>ですよね。<br>B：いいえ、<ruby>今日<rt>きょう</rt></ruby>は<ruby>誕生日<rt>たんじょうび</rt></ruby>じゃありません。<br><ruby>誕生日<rt>たんじょうび</rt></ruby>は<ruby>明日<rt>あした</rt></ruby>です。<br><ruby>明日<rt>あした</rt></ruby>が<ruby>誕生日<rt>たんじょうび</rt></ruby>ですよ。<br>N/Aじゃないです<br>N/Aじゃありません<br>N/Aじゃなかったです<br>N/Aじゃありませんでした","kana":"","vi":"","audio":"今日は（Bさんの）誕生日ですよね。 いいえ、今日は誕生日じゃありません。 誕生日は明日です。 明日が誕生日ですよ。 N/Aじゃないです N/Aじゃありません N/Aじゃなかったです N/Aじゃありませんでした"}]},{"id":"g9a_1","lesson":"Bài 9A","title":"Vます → Vる","formula":"Vます → Vる","meaning":"・ Thể Từ điển của「V :"Vます、Vた、Vたい、Vよう、..."},{"jp":"例<br>いつも、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べる<ruby>前<rt>まえ</rt></ruby>に、<ruby>今晩<rt>こんばん</rt></ruby>コンサートの<ruby>前<rt>まえ</rt></ruby>に、<br><ruby>恋人<rt>こい　びと</rt></ruby>と<ruby>電話<rt>でんわ</rt></ruby>をします。<ruby>食事<rt>しょくじ</rt></ruby>をしましょう。<br><ruby>今朝<rt>けさ</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べる<ruby>前<rt>まえ</rt></ruby>に、<ruby>電話<rt>でんわ</rt></ruby>をしました。<ruby>昨日<rt>きのう</rt></ruby>コンサートの<ruby>前<rt>まえ</rt></ruby>に、<ruby>食事<rt>しょくじ</rt></ruby>をしました。","kana":"","vi":"","audio":"いつも、ご飯を食べる前に、今晩コンサートの前に、 恋人と電話をします。食事をしましょう。 今朝ご飯を食べる前に、電話をしました。昨日コンサートの前に、食事をしました。"},{"jp":"①<ruby>昨日<rt>きのう</rt></ruby><ruby>寝<rt>ね</rt></ruby>る<ruby>前<rt>まえ</rt></ruby>に<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みました。","kana":"","vi":"","audio":"昨日寝る前に本を読みました。"},{"jp":"②<ruby>旅行<rt>りょこう</rt></ruby>→<ruby>荷物<rt>にもつ</rt></ruby>・<ruby>準備<rt>じゅんび</rt></ruby>します。<br>→<ruby>旅行<rt>りょこう</rt></ruby>の<ruby>前<rt>まえ</rt></ruby>に<ruby>荷物<rt>にもつ</rt></ruby>を<ruby>準備<rt>じゅんび</rt></ruby>します。","kana":"","vi":"","audio":"旅行荷物・準備します。 旅行の前に荷物を準備します。"}]},{"id":"g10a_3","lesson":"Bài 10A","title":"Vた/ Nの ＋ 後で、V","formula":"Vた/ Nの ＋ 後で、V","meaning":"Sau khi V / N thì V","explanation":"・ Thì của câu sẽ được chia ở cuối câu: Vます、Vた、Vたい、Vよう、...<br>・ Trước「後で」động từ luôn ở dạng「Vた」<br>❖Chúng ta sẽ sử dụng「後で」 mà không phải là「後に」, v「ì 後で」 là một cấu trúc có hình thức cố định được sử dụng trong sách giáo khoa và kỳ thi năng lực tiếng Nhật.<br>例 1. Sau khi dùng bữa tôi sẽ đi dạo.<br>→ ................................................................................................................................<br>2. Sau buổi họp thì cùng dọn vệ sinh nhé.<br>→ ................................................................................................................................<br>3. Sau khi học xong thì đi uống cà phê với tớ nhé?<br>→ ................................................................................................................................","brief":"・ Thì của câu sẽ được chia ở cuối câu: Vます、Vた、Vたい、Vよう、...","notes":"","examples":[{"jp":"例<br>いつも、<ruby>恋人<rt>こいびと</rt></ruby>と<ruby>電話<rt>でんわ</rt></ruby>をした<ruby>後<rt>あと</rt></ruby>で、<ruby>今晩<rt>こんばん</rt></ruby><ruby>食事<rt>しょくじ</rt></ruby>の<ruby>後<rt>あと</rt></ruby>で、コンサートに<br>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べます。<ruby>行<rt>い</rt></ruby>きましょう。<br><ruby>昨日<rt>きのう</rt></ruby><ruby>電話<rt>でんわ</rt></ruby>をした<ruby>後<rt>あと</rt></ruby>で、おととい<ruby>食事<rt>しょくじ</rt></ruby>の<ruby>後<rt>あと</rt></ruby>で、<br>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べました。コンサートに<ruby>行<rt>い</rt></ruby>きました。","kana":"","vi":"","audio":"いつも、恋人と電話をした後で、今晩食事の後で、コンサートに ご飯を食べます。行きましょう。 昨日電話をした後で、おととい食事の後で、 ご飯を食べました。コンサートに行きました。"},{"jp":"①<ruby>毎日<rt>まいにち</rt></ruby><ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>った<ruby>後<rt>あと</rt></ruby>で、テレビを<ruby>見<rt>み</rt></ruby>ます。","kana":"","vi":"","audio":"毎日家に帰った後で、テレビを見ます。"},{"jp":"②<ruby>会議<rt>かいぎ</rt></ruby>→<ruby>会議室<rt>かいぎしつ</rt></ruby>・<ruby>掃除<rt>そうじ</rt></ruby>します。<br>→<ruby>会議<rt>かいぎ</rt></ruby>の<ruby>後<rt>あと</rt></ruby>で<ruby>会議室<rt>かいぎしつ</rt></ruby>を<ruby>掃除<rt>そうじ</rt></ruby>します。","kana":"","vi":"","audio":"会議会議室・掃除します。 会議の後で会議室を掃除します。"},{"jp":"③いつも<ruby>晩<rt>ばん</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べた<ruby>後<rt>あと</rt></ruby>で.................................................................","kana":"","vi":"","audio":"いつも晩ご飯を食べた後で................................................................."}]},{"id":"g10b_4","lesson":"Bài 10B","title":"Vたら、V","formula":"Vたら、V","meaning":"Sau khi V thì V","explanation":"❖V chắc chắn xảy ra trong tương lai và là điều kiện để xảy ra V<br>❖V là ở tương lai:」Vる、Vたい、Vよう<br>❖Khác với後で<br>❖Cách kết hợp: Vた後で、Nの後で<br>❖V không kết thúc bằng quá khứ<br>例 1. Sau khi dùng bữa tôi sẽ đi dạo.<br>→ ................................................................................................................................<br>2. Sau buổi họp thì cùng dọn vệ sinh nhé.<br>→ ................................................................................................................................<br>3. (Đang đi tàu về nhà) Về đến nhà, tôi sẽ điện nhé.<br>→ ................................................................................................................................","brief":"❖V chắc chắn xảy ra trong tương lai và là điều kiện để xảy ra V","notes":"","examples":[{"jp":"例A：<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったらラーメンを<ruby>食<rt>た</rt></ruby>べる/<ruby>食<rt>た</rt></ruby>べたい。<br>B：じゃ、<ruby>日本<rt>にほん</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったら<ruby>食<rt>た</rt></ruby>べよう。","kana":"","vi":"","audio":"日本に行ったらラーメンを食べる/食べたい。 じゃ、日本に行ったら食べよう。"},{"jp":"例<ruby>実家<rt>じっか</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ったら、ゆっくり<ruby>休<rt>やす</rt></ruby>みます。（○）<br><ruby>実家<rt>じっか</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ったら、ゆっくり<ruby>休<rt>やす</rt></ruby>みました。（×）","kana":"","vi":"","audio":"実家に帰ったら、ゆっくり休みます。（○） 実家に帰ったら、ゆっくり休みました。（×）"},{"jp":"①ベトナムへ<ruby>行<rt>い</rt></ruby>ったら、ミーケビーチへ<ruby>行<rt>い</rt></ruby>きたいです。","kana":"","vi":"","audio":"ベトナムへ行ったら、ミーケビーチへ行きたいです。"},{"jp":"②<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んだら、<ruby>寝<rt>ね</rt></ruby>ます。","kana":"","vi":"","audio":"本を読んだら、寝ます。"},{"jp":"③ピザが<ruby>来<rt>き</rt></ruby>たら、<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>食<rt>た</rt></ruby>べましょう。","kana":"","vi":"","audio":"ピザが来たら、一緒に食べましょう。"},{"jp":"④<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ったら、シャワーを<ruby>浴<rt>あ</rt></ruby>びます。","kana":"","vi":"","audio":"家に帰ったら、シャワーを浴びます。"}]},{"id":"g10b_5","lesson":"Bài 10B","title":"Vたばかりだ","formula":"Vたばかりだ","meaning":"Vừa mới V","explanation":"・「ばかり」 được xem như một danh từ → ばかりだから、ばかりの<br>・ Khoảng thời gian hành động vừa kết thúc có tính chủ quan: 昨日、去年、...","brief":"・「ばかり」 được xem như một danh từ → ばかりだから、ばかりの","notes":"","examples":[{"jp":"①<ruby>今<rt>いま</rt></ruby>、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べたばかりですから、<ruby>食<rt>た</rt></ruby>べたくないです。","kana":"","vi":"","audio":"今、ご飯を食べたばかりですから、食べたくないです。"},{"jp":"②このかばんは、<ruby>昨日<rt>きのう</rt></ruby><ruby>買<rt>か</rt></ruby>ったばかりだから、きれいです。","kana":"","vi":"","audio":"このかばんは、昨日買ったばかりだから、きれいです。"},{"jp":"③マイさんは、<ruby>去年<rt>きょねん</rt></ruby><ruby>会社<rt>かいしゃ</rt></ruby>に<ruby>入<rt>はい</rt></ruby>ったばかりの<ruby>人<rt>ひと</rt></ruby>です。","kana":"","vi":"","audio":"マイさんは、去年会社に入ったばかりの人です。"},{"jp":"④<ruby>日本<rt>にほん</rt></ruby>に<ruby>来<rt>き</rt></ruby>たばかりですから、<ruby>日本語<rt>にほんご</rt></ruby>が<ruby>話<rt>はな</rt></ruby>せません。","kana":"","vi":"","audio":"日本に来たばかりですから、日本語が話せません。"}]},{"id":"g10b_5_2","lesson":"Bài 10B","title":"Vたことが あります","formula":"ば形( ば)","meaning":"Đã từng V","explanation":"・ Thường kết hợp với các phó từ như: 前に、一度、一回....<br>・「Vたことがない」：Chưa từng làm V<br>・Dạng phủ định thường kết hợp với phó từ 一度も<br>・Khi giao tiếp thân mật, trợ từ「が」có thể lược bỏ ĐỘNG TỪ Nhóm 1 Nhóm 2 Nhóm 3 _imasu → _eba _masu → _reba TÍNH TỪ ĐUÔI い","brief":"・ Thường kết hợp với các phó từ như: 前に、一度、一回....","notes":"","examples":[{"jp":"例A：<ruby>海外<rt>かいがい</rt></ruby>で<ruby>一人暮<rt>ひとりぐ</rt></ruby>らしをしたことある？<br>B：うん、あるよ。<ruby>楽<rt>たの</rt></ruby>しかったけど、<ruby>大変<rt>たいへん</rt></ruby>だった。","kana":"","vi":"","audio":"海外で一人暮らしをしたことある？ うん、あるよ。楽しかったけど、大変だった。"},{"jp":"①<ruby>私<rt>わたし</rt></ruby>の<ruby>母<rt>はは</rt></ruby>は<ruby>一度<rt>いち。ど</rt></ruby>も<ruby>海外<rt>かい。がい</rt></ruby>に<ruby>行<rt>い</rt></ruby>ったことがありません。","kana":"","vi":"","audio":"私の母は一度も海外に行ったことがありません。"},{"jp":"②この<ruby>映画<rt>えいが</rt></ruby>、<ruby>前<rt>まえ</rt></ruby>に<ruby>見<rt>み</rt></ruby>たこと（が）ある。<ruby>面白<rt>おもしろ</rt></ruby>かったよ。","kana":"","vi":"","audio":"この映画、前に見たこと（が）ある。面白かったよ。"},{"jp":"③<ruby>富士山<rt>ふじさん</rt></ruby>に<ruby>登<rt>のぼ</rt></ruby>ったことがあります。","kana":"","vi":"","audio":"富士山に登ったことがあります。"},{"jp":"④ダナンに<ruby>行<rt>い</rt></ruby>く（１<ruby>回<rt>っかい</rt></ruby>）<br>→A：ダナンに<ruby>行<rt>い</rt></ruby>ったことがありますか。<br>B：はい、１<ruby>回<rt>っかい</rt></ruby>あります。<br><ruby>行<rt>い</rt></ruby>きます→<ruby>行<rt>い</rt></ruby>けば<ruby>寝<rt>ね</rt></ruby>ます→<ruby>寝<rt>ね</rt></ruby>ればします→すれば<br><ruby>読<rt>よ</rt></ruby>みます→<ruby>読<rt>よ</rt></ruby>めば*います→いれば<ruby>来<rt>き</rt></ruby>ます→<ruby>来<rt>く</rt></ruby>れば<br><ruby>書<rt>か</rt></ruby>きます→<ruby>書<rt>か</rt></ruby>けば*<ruby>起<rt>お</rt></ruby>きます→<ruby>起<rt>お</rt></ruby>きれば<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>します→<ruby>買<rt>か</rt></ruby>い<ruby>物<rt>もの</rt></ruby>すれば<br>AA＋ければAくなければ<br><ruby>大<rt>おお</rt></ruby>きい<ruby>大<rt>おお</rt></ruby>きければ<ruby>大<rt>おお</rt></ruby>きくなければ<br><ruby>高<rt>たか</rt></ruby>い<ruby>高<rt>たか</rt></ruby>ければ<ruby>高<rt>たか</rt></ruby>くなければ<br>いい*よければよくなければ","kana":"","vi":"","audio":"ダナンに行く（１回） ダナンに行ったことがありますか。 はい、１回あります。 行きます行けば寝ます寝ればしますすれば 読みます読めば*いますいれば来ます来れば 書きます書けば*起きます起きれば買い物します買い物すれば AA＋ければAくなければ 大きい大きければ大きくなければ 高い高ければ高くなければ いい*よければよくなければ"}]},{"id":"g11a_1","lesson":"Bài 11A","title":"V ば/ A ければ ～","formula":"V ば/ A ければ ～","meaning":"Nếu～ thì","explanation":"① Vế trước là: Động từ mang tính ý chí 行く、見る、 食べる、買うvế sau là:<br>② ・ Nếu vế trước là:<br>+ Động từ biểu thị khả năng: できる、読める…..<br>+ trạng thái : ある、いる<br>+ tính từ đuô「i い」：安い、 高い ...","brief":"① Vế trước là: Động từ mang tính ý chí 行く、見る、 食べる、買うvế sau là:","notes":"","examples":[{"jp":"いい、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>、わかる、Vkhảnăng.<br>・Vếsaulà:「Vます」「Vましょう」「Vたい」「Vkhảnăng」「Vてください」...","kana":"","vi":"","audio":"いい、大丈夫、わかる、Vkhảnăng. ・Vếsaulà:「Vます」「Vましょう」「Vたい」「Vkhảnăng」「Vてください」..."},{"jp":"①お<ruby>金<rt>かね</rt></ruby>があれば、<ruby>旅行<rt>りょうこう</rt></ruby>に<ruby>行<rt>い</rt></ruby>けます。","kana":"","vi":"","audio":"お金があれば、旅行に行けます。"},{"jp":"②A：<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>ですか？<br>B：ええ、<ruby>少<rt>すこ</rt></ruby>し<ruby>寝<rt>ね</rt></ruby>れば、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。","kana":"","vi":"","audio":"大丈夫ですか？ ええ、少し寝れば、大丈夫です。"},{"jp":"③<ruby>高<rt>たか</rt></ruby>ければ、<ruby>買<rt>か</rt></ruby>いません。","kana":"","vi":"","audio":"高ければ、買いません。"},{"jp":"④<ruby>君<rt>きみ</rt></ruby>がいれば<ruby>幸<rt>しあわ</rt></ruby>せだ。","kana":"","vi":"","audio":"君がいれば幸せだ。"}]},{"id":"g11a_2","lesson":"Bài 11A","title":"Từ nghi vấn ＋ Vば、～か","formula":"Từ nghi vấn ＋ Vば、～か","meaning":"Nên V (như thế nào...) thì ～","explanation":"・ Vế trước「～ば」có thể kết hợp với các từ nghi vấn:<br>・ Vế sau「～ば」thường sẽ kết hợp cùng「いい」hoặc là một kết quả mà bản thân mong đợi.<br>❖Trả lờ「i V ば + いい」「 ～Vたら どうですか。(V thì thế nào?)","brief":"・ Vế trước「～ば」có thể kết hợp với các từ nghi vấn:","notes":"","examples":[{"jp":"いつ、どこ、誰、何、どう、どのくらい...<br>❖「どうすればいいですか。」？→～Vるといいですよ。(Vlàđượcđấy)","kana":"","vi":"","audio":"いつ、どこ、誰、何、どう、どのくらい... ❖「どうすればいいですか。」？～Vるといいですよ。(Vlàđượcđấy)"},{"jp":"①どうすれば、<ruby>日本<rt>にほん</rt></ruby>の<ruby>大学<rt>だいがく</rt></ruby>に<ruby>行<rt>い</rt></ruby>けますか。","kana":"","vi":"","audio":"どうすれば、日本の大学に行けますか。"},{"jp":"②A：お<ruby>金<rt>かね</rt></ruby>がありません。どうすればいいですか。<br>B：アルバイトをしたらどうですか。","kana":"","vi":"","audio":"お金がありません。どうすればいいですか。 アルバイトをしたらどうですか。"},{"jp":"③A：どこに<ruby>行<rt>い</rt></ruby>けば、きれいな<ruby>海<rt>うみ</rt></ruby>で<ruby>泳<rt>およ</rt></ruby>げますか。<br>B：ダナンに<ruby>行<rt>い</rt></ruby>けば、<ruby>泳<rt>およ</rt></ruby>げます。","kana":"","vi":"","audio":"どこに行けば、きれいな海で泳げますか。 ダナンに行けば、泳げます。"}]},{"id":"g11b_3","lesson":"Bài 11B","title":"Vなければ、～","formula":"Vなければ、～","meaning":"Nếu không～thì không～(Câu điều kiện phủ định)","explanation":"・ Khi không có điều kiện ở vế trước「ば」 xảy ra thì kết quả mà người nói mong đợi ở vế sau cũng sẽ không xảy ra.<br>・ Hoặc ngược lại, một sự việc, một điều người nói không mong muốn sẽ xảy ra.","brief":"・ Khi không có điều kiện ở vế trước「ば」 xảy ra thì kết quả mà người nói mong đợi ở vế sau cũng sẽ không xảy ra.","notes":"","examples":[{"jp":"れい：<ruby>野菜<rt>やさい</rt></ruby>も<ruby>食<rt>た</rt></ruby>べなければ、<ruby>病気<rt>びょうき</rt></ruby>になりますよ。<br>Vない→Vなければ<br><ruby>行<rt>い</rt></ruby>かない→<ruby>行<rt>い</rt></ruby>かなければ<br><ruby>読<rt>よ</rt></ruby>まない→<ruby>読<rt>よ</rt></ruby>まなければ<br><ruby>書<rt>か</rt></ruby>かない→<ruby>書<rt>か</rt></ruby>かなければ","kana":"","vi":"","audio":"れい：野菜も食べなければ、病気になりますよ。 VないVなければ 行かない行かなければ 読まない読まなければ 書かない書かなければ"},{"jp":"①<ruby>家族<rt>か ぞく</rt></ruby>がいなければ、<ruby>仕事<rt>し ごと</rt></ruby>を<ruby>頑張<rt>がん ば</rt></ruby>れません。","kana":"","vi":"","audio":"家族がいなければ、仕事を頑張れません。"},{"jp":"②お<ruby>酒<rt>さけ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>まなければ、<ruby>寝<rt>ね</rt></ruby>られません。","kana":"","vi":"","audio":"お酒を飲まなければ、寝られません。"},{"jp":"③<ruby>働<rt>はたら</rt></ruby>かなければ、<ruby>生活<rt>せいかつ</rt></ruby>できません。","kana":"","vi":"","audio":"働かなければ、生活できません。"}]},{"id":"g11b_4","lesson":"Bài 11B","title":"Vなければ なりません / Vないと いけません","formula":"Vなければ なりません / Vないと いけません","meaning":"Phải làm V","explanation":"♦ Mẫu câu được sử dụng trong 2 trường hợp sau:<br>・ Diễn tả hành động mà một cá nhân tự cảm thấy cần thiết, có trách nhiệm, nghĩa vụ phải thực hiện.<br>・ Diễn tả nghĩa vụ, việc cần phải làm theo quy định của công ty, trường học, quốc gia,...<br>・ 「～ないと いけません」là cách nói thân mật, suồng sã của「～なければ なりません」, thường được dùng trong giao tiếp hàng ngày.<br>・ Ngoài ra trong giao tiếp còn thường sử dụng các cách nói sau:","brief":"♦ Mẫu câu được sử dụng trong 2 trường hợp sau:","notes":"","examples":[{"jp":"「〜なければならない」/「〜ないといけない」/「〜ないと」","kana":"","vi":"","audio":"「〜なければならない」/「〜ないといけない」/「〜ないと」"},{"jp":"①<ruby>学生<rt>がくせい</rt></ruby>は<ruby>毎日<rt>まいにち</rt></ruby><ruby>授業<rt>じゅぎょう</rt></ruby>に<ruby>来<rt>こ</rt></ruby>なければなりません。","kana":"","vi":"","audio":"学生は毎日授業に来なければなりません。"},{"jp":"②<ruby>店<rt>みせ</rt></ruby>に<ruby>行<rt>い</rt></ruby>く<ruby>前<rt>まえ</rt></ruby>に、<ruby>予約<rt>よやく</rt></ruby>しないといけない。","kana":"","vi":"","audio":"店に行く前に、予約しないといけない。"},{"jp":"③あ、6<ruby>時<rt>じ</rt></ruby>だ。<ruby>帰<rt>かえ</rt></ruby>らないと。","kana":"","vi":"","audio":"あ、6時だ。帰らないと。"}]},{"id":"g11b_5","lesson":"Bài 11B","title":"Vなきゃ、～","formula":"Vなきゃ、～","meaning":"Nếu không～thì không～(Câu điều kiện phủ định)","explanation":"・「～なきゃ」là cách nói ngắn của「～なければ」 thường được dùng trong văn nói.","brief":"・「～なきゃ」là cách nói ngắn của「～なければ」 thường được dùng trong văn nói.","notes":"","examples":[{"jp":"Vない→Vなきゃ<br><ruby>行<rt>い</rt></ruby>かない→<ruby>行<rt>い</rt></ruby>かなければ／<ruby>行<rt>い</rt></ruby>かなきゃ<br><ruby>見<rt>み</rt></ruby rt>ね</rt></ruby>ます。","kana":"","vi":"","audio":"テレビを見て、シャワーを浴びて、寝ます。"},{"jp":"②<ruby>病院<rt>びょういん</rt></ruby>に<ruby>行<rt>い</rt></ruby>って、<ruby>薬<rt>くすり</rt></ruby>を<ruby>買<rt>か</rt></ruby>って、<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>りました。","kana":"","vi":"","audio":"病院に行って、薬を買って、家に帰りました。"},{"jp":"③A：<ruby>昨日<rt>きのう</rt></ruby>、<ruby>何<rt>なに</rt></ruby>をしましたか。<br>B：<ruby>昨日<rt>きのう</rt></ruby><ruby>友達<rt>ともだち</rt></ruby>のうちに<ruby>行<rt>い</rt></ruby>って、ケーキを<ruby>食<rt>た</rt></ruby>べて、<br>それからコーヒーを<ruby>飲<rt>の</rt></ruby>みました。","kana":"","vi":"","audio":"昨日、何をしましたか。 昨日友達のうちに行って、ケーキを食べて、 それからコーヒーを飲みました。"}]},{"id":"g12a_2","lesson":"Bài 12A","title":"Vてから V","formula":"Vてから V","meaning":"Sau khi V thì V","explanation":"Sự khác nhau giữa「Vて、Vて～」và「V てから」 ♦ Liệt kê các hành động liên tiếp của một chủ thể. ♦ Hành động vế trước và vế sau có thể là cùng một hoặc hai chủ thể.<br>♦ Trong 1 câu「, Vて」 có thể xuất hiện nhiều lần. ♦ Trong 1 câu chỉ dùng「Vてから」 1 lần.","brief":"Sự khác nhau giữa「Vて、Vて～」và「V てから」 ♦ Liệt kê các hành động liên tiếp của một chủ thể. ♦ Hành động vế trước và vế sau có thể là cùng một hoặc hai chủ t","notes":"","examples":[{"jp":"「Vて、Vて～」「Vてから」","kana":"","vi":"","audio":"「Vて、Vて～」「Vてから」"},{"jp":"例✕お<ruby>父<rt>とう</rt></ruby>さんが<ruby>帰<rt>かえ</rt></ruby>ってきて、<ruby>一緒<rt>いっしょ</rt></ruby>にご<ruby>飯<rt>はん</rt></ruby>を例〇いつも、お<ruby>父<rt>とう</rt></ruby>さんが<ruby>帰<rt>かえ</rt></ruby>ってきてから、<br><ruby>食<rt>た</rt></ruby>べます。<ruby>一緒<rt>いっしょ</rt></ruby>にご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べています。","kana":"","vi":"","audio":"✕お父さんが帰ってきて、一緒にご飯を〇いつも、お父さんが帰ってきてから、 食べます。一緒にご飯を食べています。"},{"jp":"例(<ruby>私<rt>わたし</rt></ruby>は)<ruby>昨日<rt>きのう</rt></ruby>、<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>って、ご<ruby>飯<rt>はん</rt></ruby>を例（<ruby>私<rt>わたし</rt></ruby>は）いつも、<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>んでから、<ruby>寝<rt>ね</rt></ruby>ます。<br><ruby>食<rt>た</rt></ruby>べて、シャワーを<ruby>浴<rt>あ</rt></ruby>びて<ruby>寝<rt>ね</rt></ruby>ました。","kana":"","vi":"","audio":"(私は)昨日、家に帰って、ご飯を（私は）いつも、薬を飲んでから、寝ます。 食べて、シャワーを浴びて寝ました。"},{"jp":"①<ruby>朝<rt>あさ</rt></ruby>、<ruby>新聞<rt>しんぶん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでから<ruby>会社<rt>かいしゃ</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きます。","kana":"","vi":"","audio":"朝、新聞を読んでから会社へ行きます。"},{"jp":"②A：ベトナム<ruby>料理<rt>りょうり</rt></ruby><ruby>食<rt>た</rt></ruby>べたいな。<ruby>食<rt>た</rt></ruby>べに<ruby>行<rt>い</rt></ruby>こうよ。<br>B：いいね。あ、でも<ruby>土曜日<rt>どようび</rt></ruby>だから、<ruby>予約<rt>よやく</rt></ruby>してから<ruby>行<rt>い</rt></ruby>こう。","kana":"","vi":"","audio":"ベトナム料理食べたいな。食べに行こうよ。 いいね。あ、でも土曜日だから、予約してから行こう。"},{"jp":"③A：<ruby>今<rt>いま</rt></ruby>からゲームをしますか。<br>B：いいえ、<ruby>宿題<rt>しゅくだい</rt></ruby>をしてからゲームをします。","kana":"","vi":"","audio":"今からゲームをしますか。 いいえ、宿題をしてからゲームをします。"}]},{"id":"g12b_3","lesson":"Bài 12B","title":"（N は）Vて ＋ います","formula":"（N は）Vて ＋ います","meaning":"N đang V","explanation":"・ Diễn tả hành động V đang xảy ra ngay tại thời điểm nói.<br>・ Trong văn nói suồng sã, thân mật, có nhiều trường hợp「い」của「ている」 có thể được lược bỏ.","brief":"・ Diễn tả hành động V đang xảy ra ngay tại thời điểm nói.","notes":"","examples":[{"jp":"①A：<ruby>田中<rt>たなか</rt></ruby>さんはどこですか。<br>B：<ruby>今<rt>いま</rt></ruby>、<ruby>休憩室<rt>きゅうけいしつ</rt></ruby>で<ruby>休<rt>やす</rt></ruby>んでいますよ。","kana":"","vi":"","audio":"田中さんはどこですか。 今、休憩室で休んでいますよ。"},{"jp":"②A：もしもし、<ruby>今<rt>いま</rt></ruby><ruby>何<rt>なに</rt></ruby>をしていますか。<br>→もしもし、<ruby>今<rt>いま</rt></ruby><ruby>何<rt>なに</rt></ruby>（を）して（い）る？<br>B：<ruby>今<rt>いま</rt></ruby>、カフェでコーヒーを<ruby>飲<rt>の</rt></ruby>んでいますよ。<br>→<ruby>今<rt>いま</rt></ruby>、カフェでコーヒーを<ruby>飲<rt>の</rt></ruby>んで（い）るよ。","kana":"","vi":"","audio":"もしもし、今何をしていますか。 もしもし、今何（を）して（い）る？ 今、カフェでコーヒーを飲んでいますよ。 今、カフェでコーヒーを飲んで（い）るよ。"},{"jp":"③A：<ruby>何<rt>なに</rt></ruby>をしていますか。<br>B：<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しています。<br>A：どこで<ruby>勉強<rt>べんきょう</rt></ruby>していますか。<br>B：<ruby>教室<rt>きょうしつ</rt></ruby>で<ruby>勉強<rt>べんきょう</rt></ruby>しています。","kana":"","vi":"","audio":"何をしていますか。 日本語を勉強しています。 どこで勉強していますか。 教室で勉強しています。"}]},{"id":"g12b_4","lesson":"Bài 12B","title":"Nが Vて ＋ います","formula":"Nが Vて ＋ います","meaning":"N đang V","explanation":"・ Diễn tả sự việc, hiện tượng đang xảy ra ngay trước mắt mà đối phương không nhìn thấy hoặc không để ý đến.<br>・ Chủ thể N sẽ được biểu thị bởi trợ từ「が」.","brief":"・ Diễn tả sự việc, hiện tượng đang xảy ra ngay trước mắt mà đối phương không nhìn thấy hoặc không để ý đến.","notes":"","examples":[{"jp":"①あ、<ruby>見<rt>み</rt></ruby>て。あそこで<ruby>猫<rt>ねこ</rt></ruby>が<ruby>寝<rt>ね</rt></ruby>ているよ。かわいいね。","kana":"","vi":"","audio":"あ、見て。あそこで猫が寝ているよ。かわいいね。"},{"jp":"②あれ、<ruby>田中<rt>たなか</rt></ruby>さんが<ruby>何<rt>なに</rt></ruby>か<ruby>食<rt>た</rt></ruby>べていますね。","kana":"","vi":"","audio":"あれ、田中さんが何か食べていますね。"},{"jp":"③<ruby>犬<rt>いぬ</rt></ruby>が<ruby>遊<rt>あそ</rt></ruby>んで（い）ます（よ）。","kana":"","vi":"","audio":"犬が遊んで（い）ます（よ）。"}]},{"id":"g12b_5","lesson":"Bài 12B","title":"（N は）Vて ＋ います","formula":"（N は）Vて ＋ います","meaning":"N thường V","explanation":"・ Diễn tả thói quen, lối sống","brief":"・ Diễn tả thói quen, lối sống","notes":"","examples":[{"jp":"①<ruby>最近<rt>さいきん</rt></ruby>は、<ruby>毎日<rt>まいにち</rt></ruby>スポーツジムに<ruby>行<rt>い</rt></ruby>っています。","kana":"","vi":"","audio":"最近は、毎日スポーツジムに行っています。"},{"jp":"②<ruby>毎朝<rt>まいあさ</rt></ruby>、<ruby>新聞<rt>しんぶん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでいます。","kana":"","vi":"","audio":"毎朝、新聞を読んでいます。"},{"jp":"③<ruby>休<rt>やす</rt></ruby>みの<ruby>日<rt>ひ</rt></ruby>・<ruby>何<rt>なに</rt></ruby>・します<br>A：<ruby>休<rt>やす</rt></ruby>みの<ruby>日<rt>ひ</rt></ruby>は（いつも）<ruby>何<rt>なに</rt></ruby>をしていますか。<br>B：<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>んでいます。Aさんは、<ruby>休<rt>やす</rt></ruby>みの<ruby>日<rt>ひ</rt></ruby>は（いつも）<ruby>何<rt>なに</rt></ruby>をしていますか。<br>A：<ruby>私<rt>わたし</rt></ruby>は<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>ています。","kana":"","vi":"","audio":"休みの日・何・します 休みの日は（いつも）何をしていますか。 本を読んでいます。Aさんは、休みの日は（いつも）何をしていますか。 私は映画を見ています。"}]},{"id":"g12c_6","lesson":"Bài 12C","title":"Nが Vて ＋ います","formula":"Nが Vて ＋ います","meaning":"・ Diễn tả trạng thái, kết quả của hành động.","explanation":"・ Diễn tả trạng thái, kết quả của hành động.<br>・ Động từ thể hiện trạng thái như「ある」、「いる」... không có dạng「Vている」 .","brief":"・ Diễn tả trạng thái, kết quả của hành động.","notes":"","examples":[{"jp":"①A：この<ruby>部屋<rt>へや</rt></ruby>、<ruby>寒<rt>さむ</rt></ruby>いですね。<br>B：あ、<ruby>窓<rt>まど</rt></ruby>が<ruby>開<rt>あ</rt></ruby>いていますよ。","kana":"","vi":"","audio":"この部屋、寒いですね。 あ、窓が開いていますよ。"},{"jp":"②あ、<ruby>桜<rt>さくら</rt></ruby>が<ruby>咲<rt>さ</rt></ruby>いていますよ。きれいですね。","kana":"","vi":"","audio":"あ、桜が咲いていますよ。きれいですね。"},{"jp":"③A：あ、<ruby>服<rt>ふく</rt></ruby>が<ruby>汚<rt>よご</rt></ruby>れていますよ。<br>B：あ、<ruby>本当<rt>ほんとう</rt></ruby>だ。ありがとうございます。","kana":"","vi":"","audio":"あ、服が汚れていますよ。 あ、本当だ。ありがとうございます。"}]},{"id":"g12c_7","lesson":"Bài 12C","title":"Vて ＋ います","formula":"Vて ＋ います","meaning":"・ Diễn tả trạng thái, hành động duy trì trong một thời gian dài","explanation":"・ Diễn tả trạng thái, hành động duy trì trong một thời gian dài","brief":"・ Diễn tả trạng thái, hành động duy trì trong một thời gian dài","notes":"","examples":[{"jp":"「<ruby>住<rt>す</rt></ruby>む」、「<ruby>結婚<rt>けっこん</rt></ruby>する」、「<ruby>習<rt>なら</rt></ruby>う」、「<ruby>持<rt>も</rt></ruby>つ」、「<ruby>働<rt>はたら</rt></ruby>く」、「<ruby>勉強<rt>べんきょう</rt></ruby>する」","kana":"","vi":"","audio":"「住む」、「結婚する」、「習う」、「持つ」、「働く」、「勉強する」"},{"jp":"①<ruby>鈴木<rt>すずき</rt></ruby>さんはその<ruby>会社<rt>かいしゃ</rt></ruby>で<ruby>働<rt>はたら</rt></ruby>いていますね。","kana":"","vi":"","audio":"鈴木さんはその会社で働いていますね。"},{"jp":"②ABC<ruby>日本語学校<rt>にほんごがっこう</rt></ruby>で3<ruby>年<rt>ねん</rt></ruby>、<ruby>日本語<rt>にほんご</rt></ruby>を<ruby>勉強<rt>べんきょう</rt></ruby>しています。","kana":"","vi":"","audio":"ABC日本語学校で3年、日本語を勉強しています。"},{"jp":"③<ruby>車<rt>くるま</rt></ruby>を<ruby>持<rt>も</rt></ruby>っていますか。<br>→はい、<ruby>持<rt>も</rt></ruby>っています。<br>いいえ、<ruby>持<rt>も</rt></ruby>っていません。","kana":"","vi":"","audio":"車を持っていますか。 はい、持っています。 いいえ、持っていません。"}]},{"id":"g12c_8","lesson":"Bài 12C","title":"Nを 知っていますか。","formula":"Nを 知っていますか。","meaning":"Bạn có biết N không?","explanation":"—","brief":"","notes":"","examples":[{"jp":"・Nを<ruby>知<rt>し</rt></ruby>っていますか。<br>→はい、<ruby>知<rt>し</rt></ruby>っています。<br>いいえ、<ruby>知<rt>し</rt></ruby>りません／<ruby>知<rt>し</rt></ruby>りませんでした。","kana":"","vi":"","audio":"・Nを知っていますか。 はい、知っています。 いいえ、知りません、知りませんでした。"},{"jp":"①この<ruby>会社<rt>かいしゃ</rt></ruby>を<ruby>知<rt>し</rt></ruby>っていますか。","kana":"","vi":"","audio":"この会社を知っていますか。"},{"jp":"②<ruby>私<rt>わたし</rt></ruby>は「<ruby>東京<rt>とうきょう</rt></ruby>タワー」を<ruby>知<rt>し</rt></ruby>りませんでした。","kana":"","vi":"","audio":"私は「東京タワー」を知りませんでした。"},{"jp":"③A：Bさんは、<ruby>面白<rt>おもしろ</rt></ruby>いドラマを<ruby>知<rt>し</rt></ruby>っていますか。<br>B：はい、<ruby>知<rt>し</rt></ruby>っています。『<ruby>田中<rt>たなか</rt></ruby>くんの<ruby>恋人<rt>こいびと</rt></ruby>』は<ruby>面白<rt>おもしろ</rt></ruby>いですよ。<br>A：へえ。『<ruby>田中<rt>たなか</rt></ruby>くんの<ruby>恋人<rt>こいびと</rt></ruby>』ですね。ありがとうございます。","kana":"","vi":"","audio":"Bさんは、面白いドラマを知っていますか。 はい、知っています。『田中くんの恋人』は面白いですよ。 へえ。『田中くんの恋人』ですね。ありがとうございます。"}]},{"id":"g13a_1","lesson":"Bài 13A","title":"Nでも いいです （か）","formula":"Nでも いいです （か）","meaning":"N (hoặc N) có được không?/ có ổn không?","explanation":"・ Một số cách nói khác có thể thay cho「いいです」:<br>❖Khi không cần đưa ra lựa chọn về thời gian, con người, địa điểm hay đồ vật nào thì chúng ta có thể thay Danh từ bằng từ để hỏi rồi kết hợp với「でも」:","brief":"・ Một số cách nói khác có thể thay cho「いいです」:","notes":"","examples":[{"jp":"「<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です」「かまわないです／かまいません」<br>「いつでも」「<ruby>誰<rt>だれ</rt></ruby>でも」「どこでも」「<ruby>何<rt>なん</rt></ruby>でも」","kana":"","vi":"","audio":"「大丈夫です」「かまわないです、かまいません」 「いつでも」「誰でも」「どこでも」「何でも」"},{"jp":"①<ruby>明日<rt>あした</rt></ruby>の<ruby>会議<rt>かいぎ</rt></ruby>、２<ruby>時<rt>じ</rt></ruby>からでもかまわないですか。","kana":"","vi":"","audio":"明日の会議、２時からでもかまわないですか。"},{"jp":"②この<ruby>店<rt>みせ</rt></ruby>は<ruby>学生<rt>がくせい</rt></ruby>でも<ruby>働<rt>はたら</rt></ruby>けます。","kana":"","vi":"","audio":"この店は学生でも働けます。"},{"jp":"③Ａ：<ruby>何<rt>なに</rt></ruby>か<ruby>飲<rt>の</rt></ruby>みますか。<br>Ｂ：はい、お<ruby>願<rt>ねが</rt></ruby>いします。<br>Ａ：あ、コーヒーがない。ジュースでもいいですか。<br>Ｂ：<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。","kana":"","vi":"","audio":"何か飲みますか。 はい、お願いします。 あ、コーヒーがない。ジュースでもいいですか。 大丈夫です。"},{"jp":"④Ａ：<ruby>来週<rt>らいしゅう</rt></ruby>の<ruby>会議<rt>かいぎ</rt></ruby>は<ruby>何時<rt>なんじ</rt></ruby>がいいでしょうか。<br>Ｂ：<ruby>私<rt>わたし</rt></ruby>は2<ruby>時<rt>じ</rt></ruby>でも3<ruby>時<rt>じ</rt></ruby>でも<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>ですよ。","kana":"","vi":"","audio":"来週の会議は何時がいいでしょうか。 私は2時でも3時でも大丈夫ですよ。"},{"jp":"⑤Ａ：<ruby>昼<rt>ひる</rt></ruby>ご<ruby>飯<rt>はん</rt></ruby>、<ruby>何食<rt>なにた</rt></ruby>べようか。あそこにカレー<ruby>屋<rt>や</rt></ruby>さんと、ラーメン<ruby>屋<rt>や</rt></ruby>さんが<br>あるけど。<br>Ｂ：カレーでもラーメンでもどっちでもかまわないよ。","kana":"","vi":"","audio":"昼ご飯、何食べようか。あそこにカレー屋さんと、ラーメン屋さんが あるけど。 カレーでもラーメンでもどっちでもかまわないよ。"}]},{"id":"g13a_2","lesson":"Bài 13A","title":"はい、大丈夫です/どうぞ / Vても いいですか。 → / すみません、（～は）ちょっと…","formula":"はい、大丈夫です/どうぞ / Vても いいですか。 → / すみません、（～は）ちょっと…","meaning":"❖Trường hợp không thể đồng ý với câu xin phép :","explanation":"❖Trường hợp không thể đồng ý với câu xin phép :<br>+「いいえ、だめです。」 (Không, không được.)<br>+「いいえ、Vてはいけません。」 (Không, không được V.) ① (Tại nhà ăn) ② (Nhìn vào tủ lạnh)","brief":"❖Trường hợp không thể đồng ý với câu xin phép :","notes":"","examples":[{"jp":"A：このいすを<ruby>使<rt>つか</rt></ruby>ってもいいですか。<br>B：はい、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。<br>A：このケーキ、<ruby>食<rt>た</rt></ruby>べてもいい？<br>B：ええ、どうぞ。","kana":"","vi":"","audio":"このいすを使ってもいいですか。 はい、大丈夫です。 このケーキ、食べてもいい？ ええ、どうぞ。"},{"jp":"③<ruby>宿題<rt>しゅくだい</rt></ruby>をしたら、ゲームをしてもいいですか。","kana":"","vi":"","audio":"宿題をしたら、ゲームをしてもいいですか。"},{"jp":"④A：ここで<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってもいいですか。<br>B：はい、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。<br>すみません、（<ruby>写真<rt>しゃしん</rt></ruby>は）ちょっと…","kana":"","vi":"","audio":"ここで写真を撮ってもいいですか。 はい、大丈夫です。 すみません、（写真は）ちょっと…"}]},{"id":"g13a_3","lesson":"Bài 13A","title":"Vても いいです","formula":"Vても いいです","meaning":"V cũng được/ V cũng không sao","explanation":"・ Mẫu câu này được dùng trong 2 trường hợp sau:<br>❶Chủ động cho phép đối phương làm gì đó.<br>Thường kết hợp cùng vớ「i よかったら」.<br>❷Khi truyền đạt những việc được phép làm dựa trên pháp luật hay nhận thức chung của xã hội.","brief":"・ Mẫu câu này được dùng trong 2 trường hợp sau:","notes":"","examples":[{"jp":"①Ａ：これが、<ruby>国会議事堂<rt>こっかいぎじどう</rt></ruby>*ですか。<br>Ｂ：はい。よかったら、<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってもいいですよ。","kana":"","vi":"","audio":"これが、国会議事堂*ですか。 はい。よかったら、写真を撮ってもいいですよ。"},{"jp":"②Ａ：これ、おいしいですね！<br>Ｂ：<ruby>全部<rt>ぜんぶ</rt></ruby><ruby>食<rt>た</rt></ruby>べてもいいですよ。","kana":"","vi":"","audio":"これ、おいしいですね！ 全部食べてもいいですよ。"},{"jp":"③ここでたばこを<ruby>吸<rt>す</rt></ruby>ってもいいです。","kana":"","vi":"","audio":"ここでたばこを吸ってもいいです。"},{"jp":"④<ruby>日本<rt>にほん</rt></ruby>で20<ruby>歳<rt>たち</rt></ruby>からビールを<ruby>飲<rt>の</rt></ruby>んでもいいです。","kana":"","vi":"","audio":"日本で20歳からビールを飲んでもいいです。"}]},{"id":"g13a_4","lesson":"Bài 13A","title":"Vなくても いいです","formula":"Vなくても いいです","meaning":"Không cần V cũng được/ cũng không sao","explanation":"・ Có thể sử dụng「大丈夫です」、「かまいません」hoặc thể khả năng thay cho","brief":"・ Có thể sử dụng「大丈夫です」、「かまいません」hoặc thể khả năng thay cho","notes":"","examples":[{"jp":"「いいです」.","kana":"","vi":"","audio":"「いいです」."},{"jp":"①<ruby>予約<rt>よやく</rt></ruby>しなくてもいいです。","kana":"","vi":"","audio":"予約しなくてもいいです。"},{"jp":"②<ruby>授業<rt>じゅぎょう</rt></ruby>はオンラインですから、<ruby>学校<rt>がっこう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>かなくてもいいです。","kana":"","vi":"","audio":"授業はオンラインですから、学校へ行かなくてもいいです。"},{"jp":"③<ruby>薬<rt>くすり</rt></ruby>を<ruby>飲<rt>の</rt></ruby>まなくても<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。","kana":"","vi":"","audio":"薬を飲まなくても大丈夫です。"},{"jp":"④お<ruby>金<rt>かね</rt></ruby>がたくさんあるから、<ruby>働<rt>はたら</rt></ruby>かなくても<ruby>生活<rt>せいかつ</rt></ruby>できます。","kana":"","vi":"","audio":"お金がたくさんあるから、働かなくても生活できます。"}]},{"id":"g13b_5","lesson":"Bài 13B","title":"Vて ＋ ください (→ Vて)","formula":"Vて ＋ ください (→ Vて)","meaning":"Hãy V / Xin vui lòng V","explanation":"・ Yêu cầu, chỉ thị, ra lệnh,… ai đó làm gì.<br>・ Khuyến khích hay mời ai làm gì như:「座る」、「食べる」、「入る」、...<br>・「Vて」là thể thường của「Vてください」.","brief":"・ Yêu cầu, chỉ thị, ra lệnh,… ai đó làm gì.","notes":"","examples":[]},{"id":"g13b_5_2","lesson":"Bài 13B","title":"Vない＋で＋ください (→ Vないで)","formula":"Vない＋で＋ください (→ Vないで)","meaning":"Xin đừng V","explanation":"・ Khi muốn đối phương không thực hiện V nào đó.<br>・ Nhắc nhở, chú ý với đối phương không được làm V.」 ⑥ （Giáo viên nói với học sinh）教室で スマホを 使わないでください。<br>⑦ （(Bố mẹ nói với con）ここには 入らないでね。","brief":"・ Khi muốn đối phương không thực hiện V nào đó.","notes":"","examples":[{"jp":"①どうぞ、<ruby>入<rt>はい</rt></ruby>ってください。","kana":"","vi":"","audio":"どうぞ、入ってください。"},{"jp":"②これ、<ruby>食<rt>た</rt></ruby>べないで。","kana":"","vi":"","audio":"これ、食べないで。"},{"jp":"③ちょっと<ruby>待<rt>ま</rt></ruby>って。","kana":"","vi":"","audio":"ちょっと待って。"},{"jp":"④<ruby>田中<rt>たなか</rt></ruby>さん、ちょっと<ruby>来<rt>き</rt></ruby>てください。","kana":"","vi":"","audio":"田中さん、ちょっと来てください。"},{"jp":"⑤この<ruby>薬<rt>くすり</rt></ruby>を、ご<ruby>飯<rt>はん</rt></ruby>を<ruby>食<rt>た</rt></ruby>べる<ruby>前<rt>まえ</rt></ruby>に<ruby>飲<rt>の</rt></ruby>んでください。","kana":"","vi":"","audio":"この薬を、ご飯を食べる前に飲んでください。"}]},{"id":"g13b_6","lesson":"Bài 13B","title":"Vて ＋ くれますか ( → Vてくれる？)","formula":"Vて ＋ くれますか ( → Vてくれる？)","meaning":"Bạn có thể V cho tôi không?","explanation":"・ So với「～てください」, thì「～てくれますか」có cảm giác ép buộc ít hơn.<br>・「V てくれる ?」: là thể thường của「V てくれますか」.","brief":"・ So với「～てください」, thì「～てくれますか」có cảm giác ép buộc ít hơn.","notes":"","examples":[{"jp":"①(Khinhờđồngnghiệp)<ruby>山田<rt>やまだ</rt></ruby>さん、ちょっと<ruby>来<rt>き</rt></ruby>てくれませんか。","kana":"","vi":"","audio":"(Khinhờđồngnghiệp)山田さん、ちょっと来てくれませんか。"},{"jp":"②すみません、これを<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>運<rt>はこ</rt></ruby>んでくれませんか。","kana":"","vi":"","audio":"すみません、これを一緒に運んでくれませんか。"},{"jp":"③ちょっと<ruby>来<rt>き</rt></ruby>てくれる？","kana":"","vi":"","audio":"ちょっと来てくれる？"},{"jp":"④すみません、<ruby>写真<rt>しゃしん</rt></ruby>を<ruby>撮<rt>と</rt></ruby>ってくれますか。","kana":"","vi":"","audio":"すみません、写真を撮ってくれますか。"}]},{"id":"g13b_7","lesson":"Bài 13B","title":"Vて ＋ くれませんか / Vて ＋ くださいませんか","formula":"Vて ＋ くれませんか / Vて ＋ くださいませんか","meaning":"Bạn có thể V cho tôi không?","explanation":"① (Hỏi bạn trên mạng) LINEの IDを 教えてくれませんか。<br>② (Hỏi người quen là người Nhật) 日本語を 教えてくださいませんか。<br>③ (Hỏi chủ nhà chung cư)","brief":"① (Hỏi bạn trên mạng) LINEの IDを 教えてくれませんか。","notes":"","examples":[{"jp":"あのー、アパートのお<ruby>金<rt>かね</rt></ruby>、<ruby>少<rt>すこ</rt></ruby>しだけ<ruby>待<rt>ま</rt></ruby>ってくださいませんか。","kana":"","vi":"","audio":"あのー、アパートのお金、少しだけ待ってくださいませんか。"},{"jp":"④A：<ruby>先生<rt>せんせい</rt></ruby>、この<ruby>漢字<rt>かんじ</rt></ruby>の<ruby>読<rt>よ</rt></ruby>み<ruby>方<rt>かた</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくださいませんか。<br>B：ええ、いいですよ。","kana":"","vi":"","audio":"先生、この漢字の読み方を教えてくださいませんか。 ええ、いいですよ。"}]},{"id":"g13c_8","lesson":"Bài 13C","title":"くれる / Nは/ が (私に) N を / くださる","formula":"くれる / Nは/ が (私に) N を / くださる","meaning":"N cho (tôi) N","explanation":"・「くれる」diễn tả việc ai đó cho người nói hay người có mối quan hệ gần gũi, thân thiết với người nói.<br>・「くださる」dùng khi người cho là người bề trên hay người mà mình kính trọng.<br>・ “Người cho” -「が」; “Người nhận” -「に」<br>❖「くださる」là động từ nhóm I, nhưng chỉ khi ở dạng「ます」âm “r” bị triệt tiêu.<br>❖Không dùng「くださる」khi người thực hiện hành động là người thân trong gia đình, người có mối quan hệ thân thiết, ngang hàng hoặc thấp hơn người nói:","brief":"・「くれる」diễn tả việc ai đó cho người nói hay người có mối quan hệ gần gũi, thân thiết với người nói.","notes":"","examples":[{"jp":"→「くださいます」<br>ます<ruby>形<rt>けい</rt></ruby><ruby>辞書形<rt>じしょけい</rt></ruby>た<ruby>形<rt>けい</rt></ruby>て<ruby>形<rt>けい</rt></ruby><br>くださいますくださるくださったくださって","kana":"","vi":"","audio":"「くださいます」 ます形辞書形た形て形 くださいますくださるくださったくださって"},{"jp":"例（×）<ruby>友達<rt>ともだち</rt></ruby>が<ruby>教<rt>おし</rt></ruby>えてくださいました。<br>（×）<ruby>母<rt>はは</rt></ruby>が<ruby>教<rt>おし</rt></ruby>えてくださいました。","kana":"","vi":"","audio":"（×）友達が教えてくださいました。 （×）母が教えてくださいました。"},{"jp":"①この<ruby>新<rt>あたら</rt></ruby>しいかばんは<ruby>母<rt>はは</rt></ruby>がくれました。","kana":"","vi":"","audio":"この新しいかばんは母がくれました。"},{"jp":"②A：それ、<ruby>素敵<rt>すてき</rt></ruby>なペンですね。<br>B：あ、これは<ruby>部長<rt>ぶちょう</rt></ruby>がくださいました。","kana":"","vi":"","audio":"それ、素敵なペンですね。 あ、これは部長がくださいました。"},{"jp":"③A：そのペン、いいね。<br>B：<ruby>先生<rt>せんせい</rt></ruby>に<ruby>言<rt>い</rt></ruby>えば、くださるよ。","kana":"","vi":"","audio":"そのペン、いいね。 先生に言えば、くださるよ。"},{"jp":"④<ruby>友達<rt>ともだち</rt></ruby>がプレゼントをくれました。","kana":"","vi":"","audio":"友達がプレゼントをくれました。"}]},{"id":"g13c_9","lesson":"Bài 13C","title":"Vて ＋ くれる / N は/が (私に) / Vて ＋ くださる","formula":"Vて ＋ くれる / N は/が (私に) / Vて ＋ くださる","meaning":"N làm gì cho tôi","explanation":"・「V てくれる」diễn tả những việc mà ai đó làm cho người nói vì lòng tốt bụng hoặc được nhờ vả từ người nói.<br>・「くださる」là cách nói tôn kính của「くれる」 .<br>・ “Người cho” -「が」; “Người nhận” -「に」","brief":"・「V てくれる」diễn tả những việc mà ai đó làm cho người nói vì lòng tốt bụng hoặc được nhờ vả từ người nói.","notes":"","examples":[{"jp":"①<ruby>先生<rt>せんせい</rt></ruby>は<ruby>私達<rt>わたしたち</rt></ruby>に<ruby>日本語<rt>にほんご</rt></ruby>や<ruby>日本<rt>にほん</rt></ruby>の<ruby>文化<rt>ぶんか</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてくれます。","kana":"","vi":"","audio":"先生は私達に日本語や日本の文化を教えてくれます。"},{"jp":"②<ruby>山田<rt>やまだ</rt></ruby>さんが（<ruby>私<rt>わたし</rt></ruby>の）<ruby>妹<rt>いもうと</rt></ruby>にケーキを<ruby>買<rt>か</rt></ruby>ってくれた。","kana":"","vi":"","audio":"山田さんが（私の）妹にケーキを買ってくれた。"},{"jp":"③マイさんがジュースを<ruby>買<rt>か</rt></ruby>ってくれました。","kana":"","vi":"","audio":"マイさんがジュースを買ってくれました。"},{"jp":"④<ruby>店員<rt>てんいん</rt></ruby>がコーヒーを<ruby>入<rt>い</rt></ruby>れてくれます。","kana":"","vi":"","audio":"店員がコーヒーを入れてくれます。"},{"jp":"⑤<ruby>友達<rt>ともだち</rt></ruby>がごちそうしてくれました。","kana":"","vi":"","audio":"友達がごちそうしてくれました。"},{"jp":"⑥<ruby>先生<rt>せんせい</rt></ruby>がほめてくださいました。","kana":"","vi":"","audio":"先生がほめてくださいました。"}]},{"id":"g13c_10","lesson":"Bài 13C","title":"あげる / Nは/が N に Nを / さしあげる","formula":"あげる / Nは/が N に Nを / さしあげる","meaning":"N1 cho/ tặng N2 (N3)","explanation":"・「あげる」được dùng trong trường hợp cho, tặng bạn bè hoặc cho người dưới.<br>・「さしあげる」được dùng khi biếu, tặng người bề trên, người không có mối quan hệ thân thiết hoặc người có mối quan hệ trong công việc.<br>例 (Cấp dưới thấy cấp trên hắt xì liền đưa khăn giấy cho cấp trên) 上司 ：ありがとう。(Cấp trên chỉ lấy 1 tờ khăn giấy rồi trả lại)","brief":"・「あげる」được dùng trong trường hợp cho, tặng bạn bè hoặc cho người dưới.","notes":"","examples":[{"jp":"<ruby>上司<rt>じょうし</rt></ruby>：はっくしゅん！<br><ruby>部下<rt>ぶか</rt></ruby>：ああ、<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>ですか。ティッシュ、<ruby>使<rt>つか</rt></ruby>ってください。<br><ruby>部下<rt>ぶか</rt></ruby>：あ、さしあげますよ。<ruby>僕<rt>ぼく</rt></ruby>、たくさん<ruby>持<rt>も</rt></ruby>っていますから。","kana":"","vi":"","audio":"上司：はっくしゅん！ 部下：ああ、大丈夫ですか。ティッシュ、使ってください。 部下：あ、さしあげますよ。僕、たくさん持っていますから。"},{"jp":"①<ruby>私<rt>わたし</rt></ruby>は<ruby>妹<rt>いもうと</rt></ruby>にお<ruby>菓子<rt>かし</rt></ruby>をあげた。","kana":"","vi":"","audio":"私は妹にお菓子をあげた。"},{"jp":"②A：それ、<ruby>何<rt>なに</rt></ruby>？<br>B：チョコレート。<ruby>食<rt>た</rt></ruby>べる？<ruby>一個<rt>いっこ</rt></ruby>あげるよ。<br>A：<ruby>本当<rt>ほんとう</rt></ruby>？ありがとう。","kana":"","vi":"","audio":"それ、何？ チョコレート。食べる？一個あげるよ。 本当？ありがとう。"},{"jp":"③<ruby>私<rt>わたし</rt></ruby>は<ruby>課長<rt>かちょう</rt></ruby>にチョコレートをさしあげました。","kana":"","vi":"","audio":"私は課長にチョコレートをさしあげました。"}]},{"id":"g13c_11","lesson":"Bài 13C","title":"Nは/が Nに Vて ＋ あげる/さしあげる","formula":"Nは/が Nに Vて ＋ あげる/さしあげる","meaning":"N làm gì đó cho N","explanation":"❖Khi N1 là「私」thường được lược bỏ.<br>・Dạng lịch sự của「Ｖてあげる」là「Ｖてさしあげる」<br>・Lưu ý:<br>Không dùng mẫu câu này khi đối phương là người bề trên mình.<br>Không dùng khi đối phương không phải là mối quan hệ thân thiết.<br>③ (A và B là bạn bè)","brief":"❖Khi N1 là「私」thường được lược bỏ.","notes":"","examples":[{"jp":"①<ruby>友達<rt>ともだち</rt></ruby>にプレゼントを<ruby>買<rt>か</rt></ruby>ってあげた。","kana":"","vi":"","audio":"友達にプレゼントを買ってあげた。"},{"jp":"②<ruby>道<rt>みち</rt></ruby>がわからない？じゃあ、<ruby>一緒<rt>いっしょ</rt></ruby>に<ruby>行<rt>い</rt></ruby>ってあげるよ。<br>A：そういえば、Cさんはレポート<ruby>終<rt>お</rt></ruby>わったかな？<br>Bさん<ruby>手伝<rt>てつだ</rt></ruby>ってあげてたよね？<br>B：そうだね。でも、<ruby>私<rt>わたし</rt></ruby>は<ruby>途中<rt>とちゅう</rt></ruby>で<ruby>帰<rt>かえ</rt></ruby>らなきゃいけなかったから、<ruby>最後<rt>さいご</rt></ruby>まで<br><ruby>手伝<rt>てつだ</rt></ruby>ってあげられなかったよ。","kana":"","vi":"","audio":"道がわからない？じゃあ、一緒に行ってあげるよ。 そういえば、Cさんはレポート終わったかな？ Bさん手伝ってあげてたよね？ そうだね。でも、私は途中で帰らなきゃいけなかったから、最後まで 手伝ってあげられなかったよ。"},{"jp":"④<ruby>昔<rt>むかし</rt></ruby>、よく<ruby>弟<rt>おとうと</rt></ruby>に<ruby>勉強<rt>べんきょう</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えてあげた。","kana":"","vi":"","audio":"昔、よく弟に勉強を教えてあげた。"},{"jp":"⑤<ruby>掃除<rt>そうじ</rt></ruby>を<ruby>手伝<rt>てつだ</rt></ruby>ってあげます。","kana":"","vi":"","audio":"掃除を手伝ってあげます。"}]},{"id":"g14a_1","lesson":"Bài 14A","title":"Ｖましょうか/Ｖようか","formula":"Ｖましょうか/Ｖようか","meaning":"Để (tôi) V nhé","explanation":"・ So vớ「i Vてあげる」th「ì Vましょうか/Vようか」là cách nói không mang cảm giác đang ban ơn cho người khác và đối với người nghe cũng sẽ dễ dàng từ chối hơn.<br>② (Trong bữa ăn, khi nói với người đang định lấy lọ muối ở xa.) 取りましょうか。<br>③ (Nói với người đang làm việc có vẻ bận rộn.) 何か、手伝いましょうか。","brief":"・ So vớ「i Vてあげる」th「ì Vましょうか/Vようか」là cách nói không mang cảm giác đang ban ơn cho người khác và đối với người nghe cũng sẽ dễ dàng từ chối hơn.","notes":"","examples":[{"jp":"①<ruby>荷物<rt>にもつ</rt></ruby>、<ruby>多<rt>おお</rt></ruby>いね。<ruby>少<rt>すこ</rt></ruby>し<ruby>持<rt>も</rt></ruby>とうか。","kana":"","vi":"","audio":"荷物、多いね。少し持とうか。"},{"jp":"④エアコンをつけましょうか。","kana":"","vi":"","audio":"エアコンをつけましょうか。"}]},{"id":"g14a_2","lesson":"Bài 14A","title":"N/ số lượng từ ＋ しか 〜 ない","formula":"N/ số lượng từ ＋ しか 〜 ない","meaning":"Chỉ ～","explanation":"・ Động từ sau「しか」luôn được chia về dạng phủ định.<br>・ Khi「しか」kết hợp cùng với những danh từ đi cùng các trợ từ như「に、で、から」 thì「しか」sẽ đứng sau các trợ từ này. Trường hợp là trợ từ「を、が」sẽ được lược bỏ.","brief":"・ Động từ sau「しか」luôn được chia về dạng phủ định.","notes":"","examples":[{"jp":"①<ruby>財布<rt>さいふ</rt></ruby>の<ruby>中<rt>なか</rt></ruby>に、500<ruby>円<rt>えん</rt></ruby>しかない。","kana":"","vi":"","audio":"財布の中に、500円しかない。"},{"jp":"②<ruby>私<rt>わたし</rt></ruby>は<ruby>日本語<rt>にほんご</rt></ruby>しか<ruby>話<rt>はな</rt></ruby>せません。","kana":"","vi":"","audio":"私は日本語しか話せません。"},{"jp":"③<ruby>朝<rt>あさ</rt></ruby>はバナナしか<ruby>食<rt>た</rt></ruby>べていません。","kana":"","vi":"","audio":"朝はバナナしか食べていません。"},{"jp":"④こんなことは<ruby>君<rt>きみ</rt></ruby>にしか<ruby>話<rt>はな</rt></ruby>しません。","kana":"","vi":"","audio":"こんなことは君にしか話しません。"}]},{"id":"g14a_3","lesson":"Bài 14A","title":"N/ số lượng từ ＋ だけ～","formula":"N/ số lượng từ ＋ だけ～","meaning":"Chỉ ～","explanation":"・ Trường hợp sau N là các trợ từ「を、が」th「ì だけ」sẽ đặt trước「を、が」và có thể lược bỏ trợ từ「を、が」.<br>・ Trường hợp sau N là các trợ từ「に、へ、で、と、 から」th「ì だけ」có thể đứng trước hoặc sau trợ từ đều được.","brief":"・ Trường hợp sau N là các trợ từ「を、が」th「ì だけ」sẽ đặt trước「を、が」và có thể lược bỏ trợ từ「を、が」.","notes":"","examples":[{"jp":"①<ruby>昨日<rt>きのう</rt></ruby>は30<ruby>分<rt>ぷん</rt></ruby>だけ<ruby>勉強<rt>べんきょう</rt></ruby>しました。","kana":"","vi":"","audio":"昨日は30分だけ勉強しました。"},{"jp":"②これは<ruby>高校生<rt>こうこうせい</rt></ruby>だけ（が）<ruby>参加<rt>さんか</rt></ruby>できるイベントです。","kana":"","vi":"","audio":"これは高校生だけ（が）参加できるイベントです。"},{"jp":"③<ruby>毎朝<rt>まいあさ</rt></ruby>バナナだけ（を）<ruby>食<rt>た</rt></ruby>べています。","kana":"","vi":"","audio":"毎朝バナナだけ（を）食べています。"},{"jp":"④チャンさん｛だけに/にだけ｝<ruby>会<rt>あ</rt></ruby>いました。ナムさんには<ruby>会<rt>あ</rt></ruby>いませんでした。","kana":"","vi":"","audio":"チャンさん｛だけに/にだけ｝会いました。ナムさんには会いませんでした。"},{"jp":"⑤この<ruby>映画<rt>えいが</rt></ruby>は<ruby>東京<rt>とうきょう</rt></ruby>｛だけで/でだけ｝<ruby>見<rt>み</rt></ruby>られます。","kana":"","vi":"","audio":"この映画は東京｛だけで/でだけ｝見られます。"}]},{"id":"g14b_4","lesson":"Bài 14B","title":"N は 〜","formula":"N は 〜","meaning":"・「は」đặt sau N, biểu thị N là chủ đề người nói muốn đề cập đến.","explanation":"・「は」đặt sau N, biểu thị N là chủ đề người nói muốn đề cập đến.<br>・「を」、「が」sẽ được lược bỏ, chỉ sử dụng trợ từ「は」.<br>❖「は」không đứng sau các từ nghi vấn như「どこ」、「だれ」、「いつ」、「なに」、 ...<br>⑦ (Khi muốn hỏi về anh Tanaka.) ⑧ (Khi muốn hỏi người khác có muốn ăn đồ tráng miệng hay không.) ⑨ (Khi muốn nói về dự định ngày mai.) ⑩ (Khi muốn hỏi về hành lý.) 荷物は どこに 持っていきますか。<br>⑪ (Khi muốn hỏi đường đến thư viện.) 図書館へは/には、バスで 行けますか。<br>⑫ (Khi muốn nói về nước Nhật.) ⑬ (Khi muốn nói về nước Nhật.) 日本では、20歳から お酒が 飲めます。","brief":"・「は」đặt sau N, biểu thị N là chủ đề người nói muốn đề cập đến.","notes":"","examples":[{"jp":"・「は」sẽđứngsaucáctrợtừ「に」、「へ」、「で」、「と」.","kana":"","vi":"","audio":"・「は」sẽđứngsaucáctrợtừ「に」、「へ」、「で」、「と」."},{"jp":"①<ruby>日本<rt>に。ほん</rt></ruby>に→<ruby>日本<rt>にほん</rt></ruby>には⑤<ruby>財布<rt>さいふ</rt></ruby>が→<ruby>財布<rt>さいふ</rt></ruby>は","kana":"","vi":"","audio":"日本に日本には財布が財布は"},{"jp":"②<ruby>会社<rt>かいしゃ</rt></ruby>で→<ruby>会社<rt>かいしゃ</rt></ruby>では⑥<ruby>荷物<rt>にもつ</rt></ruby>を→<ruby>荷物<rt>にもつ</rt></ruby>は","kana":"","vi":"","audio":"会社で会社では荷物を荷物は"},{"jp":"③<ruby>友達<rt>ともだち</rt></ruby>と→<ruby>友達<rt>ともだち</rt></ruby>とは","kana":"","vi":"","audio":"友達と友達とは"},{"jp":"④<ruby>図書館<rt>としょかん</rt></ruby>へ→<ruby>図書館<rt>としょかん</rt></ruby>へは<br>A：<ruby>田中<rt>たなか</rt></ruby>さんはどこにいますか。<br>B：<ruby>田中<rt>たなか</rt></ruby>さんはあそこにいますよ。<br>A：デザートは、<ruby>何<rt>なに</rt></ruby>か<ruby>食<rt>た</rt></ruby>べますか。<br>B：いいえ、デザートは<ruby>大丈夫<rt>だいじょうぶ</rt></ruby>です。<br>A：<ruby>明日<rt>あした</rt></ruby>は<ruby>何<rt>なに</rt></ruby>をしますか？<br>B：<ruby>明日<rt>あした</rt></ruby>は<ruby>家<rt>いえ</rt></ruby>でテレビを<ruby>見<rt>み</rt></ruby>ます。<br><ruby>日本<rt>にほん</rt></ruby>には、<ruby>温泉<rt>おんせん</rt></ruby>がたくさんあります。<ruby>山<rt>やま</rt></ruby>もたくさんあります。","kana":"","vi":"","audio":"図書館へ図書館へは 田中さんはどこにいますか。 田中さんはあそこにいますよ。 デザートは、何か食べますか。 いいえ、デザートは大丈夫です。 明日は何をしますか？ 明日は家でテレビを見ます。 日本には、温泉がたくさんあります。山もたくさんあります。"}]},{"id":"g14b_5","lesson":"Bài 14B","title":"Nは ～ が/けど、 Nは ～","formula":"Nは ～ が/けど、 Nは ～","meaning":"N thì ... nhưng/ còn N thì...","explanation":"・「は」được sử dụng để so sánh giữa N và N.<br>❖Có thể sử dụng câu đơn có một từ「は」, nhưng thường trong câu sẽ có ẩn ý, ám chỉ khác.","brief":"・「は」được sử dụng để so sánh giữa N và N.","notes":"","examples":[{"jp":"①<ruby>私<rt>わたし</rt></ruby>は、ワインが<ruby>好<rt>す</rt></ruby>きです。ビールが<ruby>好<rt>す</rt></ruby>きじゃないです。<br>→<ruby>私<rt>わたし</rt></ruby>は、ワインは<ruby>好<rt>す</rt></ruby>きですが、ビールは<ruby>好<rt>す</rt></ruby>きじゃないです。", :"","audio":"日本の便利さは世界で有名です。"},{"jp":"②また<ruby>試験<rt>しけん</rt></ruby>に<ruby>合格<rt>ごうかく</rt></ruby>できなかった。<ruby>自分<rt>じぶん</rt></ruby>のだめさにがっかりする。","kana":"","vi":"","audio":"また試験に合格できなかった。自分のだめさにがっかりする。"},{"jp":"③ナムさんは<ruby>何年<rt>なんねん</rt></ruby>も<ruby>日本<rt>にほん</rt></ruby>に<ruby>住<rt>す</rt></ruby>んでいるから、<ruby>日本<rt>にほん</rt></ruby>のよさも、<ruby>悪<rt>わる</rt></ruby>さも、<br>よくわかっている。","kana":"","vi":"","audio":"ナムさんは何年も日本に住んでいるから、日本のよさも、悪さも、 よくわかっている。"},{"jp":"④この<ruby>料理<rt>りょうり</rt></ruby>は<ruby>辛<rt>から</rt></ruby>さが<ruby>足<rt>た</rt></ruby>りないので、もうちょっと<ruby>唐辛子<rt>とうがらし</rt></ruby>を<ruby>入<rt>い</rt></ruby>れましょう。","kana":"","vi":"","audio":"この料理は辛さが足りないので、もうちょっと唐辛子を入れましょう。"}]},{"id":"g14c_7","lesson":"Bài 14C","title":"thể Thường / ＋ なら / A / N","formula":"thể Thường / ＋ なら / A / N","meaning":"Nếu～ thì ～ (đưa ra lời khuyên hoặc yêu cầu nhờ vả)","explanation":"—","brief":"","notes":"","examples":[{"jp":"①A：おいしいベトナム<ruby>料理<rt>りょうり</rt></ruby>の<ruby>店<rt>みせ</rt></ruby>を<ruby>知<rt>し</rt></ruby>りませんか。<br>B：ベトナム<ruby>料理<rt>りょうり</rt></ruby>なら、さくら<ruby>駅<rt>えき</rt></ruby>の「フォーハノイ」がいいですよ。","kana":"","vi":"","audio":"おいしいベトナム料理の店を知りませんか。 ベトナム料理なら、さくら駅の「フォーハノイ」がいいですよ。"},{"jp":"②A：<ruby>映画<rt>えいが</rt></ruby><ruby>見<rt>み</rt></ruby>たいなぁ。<br>B：<ruby>映画<rt>えいが</rt></ruby>を<ruby>見<rt>み</rt></ruby>るなら、「Tシネマ」がいいよ。<ruby>広<rt>ひろ</rt></ruby>くてきれいだから。","kana":"","vi":"","audio":"映画見たいなぁ。 映画を見るなら、「Tシネマ」がいいよ。広くてきれいだから。"},{"jp":"③A：<ruby>面白<rt>おもしろ</rt></ruby>い<ruby>小説<rt>しょうせつ</rt></ruby>が<ruby>読<rt>よ</rt></ruby>みたいなあ。<br>B：<ruby>小説<rt>しょうせつ</rt></ruby>ならグエン・ニャット・アインの<ruby>小説<rt>しょうせつ</rt></ruby>がいいですよ。","kana":"","vi":"","audio":"面白い小説が読みたいなあ。 小説ならグエン・ニャット・アインの小説がいいですよ。"}]},{"id":"g14c_8","lesson":"Bài 14C","title":"A / N ＋ なら","formula":"A / N ＋ なら","meaning":"Nếu～ thì ～","explanation":"・Mẫu điều kiện thay choば","brief":"・Mẫu điều kiện thay choば","notes":"","examples":[{"jp":"①A：<ruby>飲<rt>の</rt></ruby>み<ruby>会<rt>かい</rt></ruby>、<ruby>今度<rt>こんど</rt></ruby>の<ruby>水曜日<rt>すいようび</rt></ruby>はどうですか。<
